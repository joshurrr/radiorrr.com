<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Radio RRR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #050710;
      color: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .wrapper {
      max-width: 600px;
      width: 100%;
      padding: 2.5rem 1.75rem;
      border-radius: 18px;
      background: radial-gradient(circle at top, #4338ca 0, #050710 55%);
      box-shadow: 0 18px 40px rgba(0,0,0,0.55);
      text-align: center;
    }
    .tagline {
      font-size: 0.95rem;
      color: #c7c7ff;
      margin: 0.5rem 0 1.25rem;
    }
    .visualizer {
      width: 100%;
      height: 260px;
      border-radius: 14px;
      overflow: hidden;
      background: #050710;
      margin-bottom: 1.5rem;
    }
    #viz { width: 100%; height: 100%; display: block; }
    .channel {
      padding: 1.2rem 1.4rem;
      border-radius: 16px;
      background: rgba(10,10,30,0.85);
      border: 1px solid rgba(129,140,248,0.5);
      margin-bottom: 1.75rem;
      text-align: left;
    }
    .channel span { font-weight: 600; font-size: 1rem; }
    .channel small { font-size: 0.8rem; opacity: 0.75; }
    audio { width: 100%; margin-top: 0.8rem; }
    .status { margin-top: 0.55rem; font-size: 0.78rem; opacity: 0.75; }
    .kick {
      margin-top:0.6rem; padding:0.45rem 0.7rem;
      border-radius:10px; border:1px solid rgba(129,140,248,0.6);
      background:#0b1020; color:#c7c7ff;
      cursor:pointer; font-size:0.85rem;
    }
    .video-container {
      position: relative;
      width: 100%; padding-bottom: 56.25%;
      margin-top: 0.8rem;
    }
    .video-container iframe {
      position: absolute; width: 100%; height: 100%; border: 0;
      top: 0; left: 0; border-radius: 12px;
    }
    .links { margin-top: 0.75rem; font-size: 0.85rem; text-align:center; }
    .links a { color: #a5b4fc; text-decoration: none; margin: 0 0.4rem; }
    .footnote { margin-top: 1.5rem; font-size: 0.7rem; opacity: 0.55; }
  </style>
</head>

<body>
  <main class="wrapper">

    <img src="logo.png" alt="Radio RRR Logo"
         style="width: 300px; max-width: 90%; margin: 0 auto 10px; display: block;">

    <p class="tagline">Streaming Electro · Synth · 80s · Chill</p>

    <!-- RADIO STREAM + VISUALIZER TOGETHER -->
    <div class="channel">
      <span id="streamTitle">RADIO RRR Live</span><br />
      <small id="streamSubtitle">No sound? Press play >></small>

      <div class="visualizer">
        <canvas id="viz"></canvas>
      </div>

      <audio id="liveStream" controls playsinline crossorigin="anonymous">
        <source src="https://stream.nightride.fm/nightride.mp3" type="audio/mpeg" />
        <source src="https://stream.nightride.fm/ebsm.ogg" type="audio/ogg" />
      </audio>

      <button id="kickPlay" class="kick">Play</button>
      <div id="status" class="status">Status: idle</div>
    </div>

    <!-- TIKTOK -->
    <div class="channel">
      <span>Latest on TikTok</span><br />
      <small>@josh.u.rrr · newest shorts</small>

      <blockquote class="tiktok-embed"
        cite="https://www.tiktok.com/@josh.u.rrr"
        data-unique-id="josh.u.rrr"
        data-embed-type="creator"
        style="max-width:100%; min-width:280px; margin-top:0.8rem;">
        <section>
          <a target="_blank" href="https://www.tiktok.com/@josh.u.rrr">@josh.u.rrr</a>
        </section>
      </blockquote>
    </div>

    <!-- YOUTUBE LIKES PLAYLIST -->
    <div class="channel">
      <span>YouTube Likes</span><br />
      <small>Latest videos you've liked</small>

      <div class="video-container">
        <iframe
          src="https://www.youtube.com/embed/videoseries?list=PLli1uTuS0FH7xR1QBnIvY3V9btomaSpTv"
          allowfullscreen
          loading="lazy">
        </iframe>
      </div>
    </div>

    <div class="links">
      <a href="https://www.instagram.com/radio.rrr/" target="_blank">Instagram</a> ·
      <a href="https://www.tiktok.com/@josh.u.rrr" target="_blank">TikTok</a> ·
      <a href="https://www.youtube.com/@RADIO_RRR" target="_blank">YouTube</a> ·
      <a href="https://github.com/joshurrr" target="_blank">GitHub</a>
    </div>

    <p class="footnote">Streaming 24/7</p>
  </main>

  <script async src="https://www.tiktok.com/embed.js"></script>

<script defer>
document.addEventListener("DOMContentLoaded", function () {
  try {

    var audio = document.getElementById("liveStream");
    var statusEl = document.getElementById("status");
    var kick = document.getElementById("kickPlay");

    function setStatus(msg) { statusEl.textContent = "Status: " + msg; }
    audio.load();

    var canvas = document.getElementById("viz");
    var ctx = canvas.getContext("2d");

    function resize() {
      var dpr = window.devicePixelRatio || 1;
      var w = canvas.clientWidth, h = canvas.clientHeight;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    window.addEventListener("resize", resize);

    var analyser = null, dataArray = null, audioCtx = null;

    function initAnalyser() {
      if (audioCtx) return;
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 1024;
        dataArray = new Uint8Array(analyser.frequencyBinCount);
        var sourceNode = audioCtx.createMediaElementSource(audio);
        sourceNode.connect(analyser);
        analyser.connect(audioCtx.destination);
      } catch (e) {}
    }

    function avgRange(start, end) {
      var sum = 0;
      for (let i = start; i < end; i++) sum += dataArray[i];
      return sum / (end - start);
    }

    var stars = [];
    for (let i = 0; i < 120; i++) {
      stars.push({
        x: Math.random()*2 - 1,
        y: Math.random()*0.9 - 0.45,
        z: Math.random()*1 + 0.2
      });
    }
    function resetStar(s) {
      s.x = Math.random()*2 - 1;
      s.y = Math.random()*0.9 - 0.45;
      s.z = Math.random()*1 + 0.2;
    }

    function drawSun(cx, horizonY, radius, glow) {
      var g = ctx.createRadialGradient(cx, horizonY, radius*0.2, cx, horizonY, radius);
      g.addColorStop(0,"rgba(255,100,220,0.95)");
      g.addColorStop(0.6,"rgba(255,70,160,0.85)");
      g.addColorStop(1,"rgba(120,40,255,0)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(cx,horizonY,radius*(0.9+glow),0,Math.PI*2);
      ctx.fill();

      ctx.save();
      ctx.globalCompositeOperation = "source-atop";
      ctx.fillStyle = "rgba(5,7,16,0.65)";
      let stripeH = radius*0.12;
      for (let y=-radius; y<radius; y+=stripeH*1.8)
        ctx.fillRect(cx-radius, horizonY+y, radius*2, stripeH);
      ctx.restore();
    }

    function drawGrid3D(w,h,horizonY,t,energy,bass){
      var vanX = w/2, vanY = horizonY;  <!-- FIXED HERE -->

      var liftAmount = 65 * bass;
      var wobble = 8 * bass;

      ctx.lineWidth = 1.3 + energy*2.4;
      ctx.strokeStyle = "rgba(0,240,255,0.75)";
      ctx.shadowColor = "rgba(255,0,200,0.95)";
      ctx.shadowBlur = 18 + energy*22;

      for (let i=0;i<=18;i++){
        let x=(i/18)*w;
        let sway=Math.sin(t*4+i*0.9)*wobble;
        ctx.beginPath();
        ctx.moveTo(vanX,vanY);
        ctx.lineTo(x+sway,h);
        ctx.stroke();
      }

      for (let r=1;r<=22;r++){
        let p=(r/22 + t*(0.8+energy*2.2))%1;
        let depth=p*p;

        let baseY=vanY + depth*(h-vanY);

        let frontFactor = depth;

        let lift = liftAmount * frontFactor * Math.sin(t*7);
        let ripple = Math.sin((t*2.2 - p*3.3)*Math.PI*2) * (22*bass*frontFactor);

        let y = baseY + lift + ripple;

        ctx.beginPath();
        ctx.moveTo(0,y);
        ctx.lineTo(w,y);
        ctx.stroke();
      }

      ctx.shadowBlur = 0;
    }

    function drawScan(w,h,t){
      ctx.save();
      ctx.globalAlpha=0.12;
      ctx.fillStyle="rgba(0,0,0,1)";
      var gap=3, off=(t*30)%gap;
      for (let y=off;y<h;y+=gap) ctx.fillRect(0,y,w,1);
      ctx.restore();
    }

    var t0=performance.now();
    function draw(){
      var t=(performance.now()-t0)/1000;
      var w=canvas.clientWidth, h=canvas.clientHeight;

      var energy=0.1, bass=0;
      if (analyser){
        analyser.getByteFrequencyData(dataArray);
        bass = avgRange(0,14)/255;
        bass = Math.min(1, Math.pow(bass,2.2)*1.7);
        let mid = avgRange(14,110)/255;
        energy = bass*1.1 + mid*0.3;
      }

      var horizon=h*0.58;
      var cx=w/2;

      var sky=ctx.createLinearGradient(0,0,0,horizon);
      sky.addColorStop(0,"#140022");
      sky.addColorStop(0.5,"#22004a");
      sky.addColorStop(1,"#050710");
      ctx.fillStyle=sky;
      ctx.fillRect(0,0,w,horizon);
      ctx.fillStyle="rgba(255,0,180,0.06)";
      ctx.fillRect(0,0,w,horizon);

      for (let s of stars){
        s.z-=0.003+energy*0.01;
        if (s.z<=0.06) resetStar(s);
        let sx=cx+(s.x/s.z)*cx;
        let sy=horizon*0.55+(s.y/s.z)*(horizon*0.7);
        let size=(1/s.z)*(0.45+energy*1.1);
        ctx.fillStyle="rgba(199,199,255,0.9)";
        ctx.fillRect(sx,sy,size,size);
      }

      drawSun(cx,horizon*0.98,Math.min(w,h)*0.18,energy*0.25);

      var ground=ctx.createLinearGradient(0,horizon,0,h);
      ground.addColorStop(0,"#050710");
      ground.addColorStop(1,"#02030a");
      ctx.fillStyle=ground;
      ctx.fillRect(0,horizon,w,h);

      drawGrid3D(w,h,horizon,t,energy,bass);
      drawScan(w,h,t);

      requestAnimationFrame(draw);
    }
    draw();

    kick.addEventListener("click", function(){
      initAnalyser();
      setStatus("trying to play...");
      audio.play().then(()=>{
        setStatus("playing");
        if (audioCtx && audioCtx.state==="suspended") audioCtx.resume();
      }).catch(()=>{
        setStatus("tap Play again");
      });
    });

  } catch (err) { console.log(err); }
});
</script>

</body>
</html>
