<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Radio RRR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #050710;
      color: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .wrapper {
      max-width: 600px;
      width: 100%;
      padding: 2.5rem 1.75rem;
      border-radius: 18px;
      /* Restored original wrapper styling */
      background: radial-gradient(circle at top, #4338ca 0, #050710 55%);
      box-shadow: 0 18px 40px rgba(0,0,0,0.55);
      text-align: center;
    }
    .tagline {
      font-size: 0.95rem;
      color: #c7c7ff;
      margin: 0.5rem 0 1.25rem;
    }
    .visualizer {
      width: 100%;
      height: 260px;
      border-radius: 14px;
      overflow: hidden;
      background: #050710;
      margin-bottom: 0.6rem;
    }
    #viz { width: 100%; height: 100%; display: block; }

    .channel {
      padding: 1.2rem 1.4rem;
      border-radius: 16px;
      background: rgba(10,10,30,0.85);
      border: 1px solid rgba(129,140,248,0.5);
      margin-bottom: 1.75rem;
      text-align: left;
    }
    .channel span { font-weight: 600; font-size: 1rem; }
    .channel small { font-size: 0.8rem; opacity: 0.75; }

    .stream-title {
      display: block;
      margin: 0.4rem 0 0.4rem;
      font-weight: 600;
      font-size: 1rem;
    }

    audio { width: 100%; margin-top: 0.2rem; }
    .status { display:none; font-size: 0.8rem; margin-top: 0.4rem; opacity: 0.8; }
    .kick {
      margin-top:0.6rem; padding:0.45rem 0.7rem;
      border-radius:10px; border:1px solid rgba(129,140,248,0.6);
      background:#0b1020; color:#c7c7ff;
      cursor:pointer; font-size:0.85rem;
    }
    .video-container {
      position: relative;
      width: 100%; padding-bottom: 56.25%;
      margin-top: 0.8rem;
    }
    .video-container iframe {
      position: absolute; width: 100%; height: 100%; border: 0;
      top: 0; left: 0; border-radius: 12px;
    }
    .links { margin-top: 0.75rem; font-size: 0.85rem; text-align:center; }
    .links a { color: #a5b4fc; text-decoration: none; margin: 0 0.4rem; }
    .footnote { margin-top: 1.5rem; font-size: 0.7rem; opacity: 0.55; }
  </style>
</head>

<body>
  <main class="wrapper">

    <img src="logo.png" alt="Radio RRR Logo"
         style="width: 300px; max-width: 90%; margin: 0 auto 10px; display: block;">

    <p class="tagline">Streaming Electro · Synth · 80s · Chill</p>

    <div class="channel">

      <div class="visualizer">
        <canvas id="viz"></canvas>
      </div>

      <span id="streamTitle" class="stream-title">RADIO RRR Live</span>

      <audio id="liveStream" controls crossorigin="anonymous">
        <source src="https://stream.nightride.fm/nightride.mp3" type="audio/mpeg" />
      </audio>

      <button id="kickPlay" class="kick">Play</button>
      <div id="status" class="status"></div>
    </div>

    <div class="channel">
      <span>Latest on TikTok</span><br />
      <small>@josh.u.rrr · newest shorts</small>

      <blockquote class="tiktok-embed"
        cite="https://www.tiktok.com/@josh.u.rrr"
        data-unique-id="josh.u.rrr"
        data-embed-type="creator"
        style="max-width:100%; min-width:280px; margin-top:0.8rem;">
        <section>
          <a target="_blank" href="https://www.tiktok.com/@josh.u.rrr">@josh.u.rrr</a>
        </section>
      </blockquote>
    </div>

    <div class="channel">
      <span>YouTube Likes</span><br />
      <small>Latest videos we liked</small>

      <div class="video-container">
        <iframe
          src="https://www.youtube.com/embed/videoseries?list=PLli1uTuS0FH7xR1QBnIvY3V9btomaSpTv"
          allowfullscreen
          loading="lazy">
        </iframe>
      </div>
    </div>

    <div class="links">
      <a href="https://www.instagram.com/radio.rrr/" target="_blank">Instagram</a> ·
      <a href="https://www.tiktok.com/@josh.u.rrr" target="_blank">TikTok</a> ·
      <a href="https://www.youtube.com/@RADIO_RRR" target="_blank">YouTube</a> ·
      <a href="https://github.com/joshurrr" target="_blank">GitHub</a>
    </div>

    <p class="footnote">
      Streaming 24/7<br>
      Contact: <a href="mailto:admin@radiorrr.com" style="color:#a5b4fc;">admin@radiorrr.com</a>
    </p>

  </main>

  <script async src="https://www.tiktok.com/embed.js"></script>

  <script>
  document.addEventListener("DOMContentLoaded", () => {

    const titleEl = document.getElementById("streamTitle");

    function getDayPeriod(hour) {
      if (hour < 12) return "Morning";
      if (hour < 17) return "Afternoon";
      return "Night";
    }

    function updateTitle() {
      const now = new Date();
      const days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
      const dayName = days[now.getDay()];
      const period = getDayPeriod(now.getHours());

      const variantsByPeriod = {
        Morning: ["Morning Chill","Sunrise Session","Morning Transmission"],
        Afternoon: ["Afternoon Chill","Daystream Session","Retro Run"],
        Night: ["Night Chill","After Dark","Night Transmission","Late Night Set"]
      };

      const list = variantsByPeriod[period] || ["Live Mix"];
      const label = list[now.getDay() % list.length];

      titleEl.textContent = `RADIO RRR Live – ${dayName} ${label}`;
    }

    updateTitle();
    // Start title updates (you had this missing in your uploaded script)
    setInterval(updateTitle, 3600000); 

    const audio = document.getElementById("liveStream");
    const statusEl = document.getElementById("status");
    const kick = document.getElementById("kickPlay");
    const canvas = document.getElementById("viz");
    const ctx = canvas.getContext("2d");

    function setStatus(msg) {
      statusEl.style.display = "block";
      statusEl.textContent = "Status: " + msg;
    }

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    window.addEventListener("resize", resize);

    let audioCtx = null;
    let analyser = null;
    let dataArray = null;
    let analyserEnabled = false;
    let analyserInitAttempted = false;
    let isPlaying = false;

    function initAnalyser() {
      if (analyserInitAttempted) return;
      analyserInitAttempted = true;
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AC();
        analyser = audioCtx.createAnalyser();
        // Reduced FFT size for simplicity and stability
        analyser.fftSize = 64; 
        dataArray = new Uint8Array(analyser.frequencyBinCount);
        const src = audioCtx.createMediaElementSource(audio);
        src.connect(analyser);
        analyser.connect(audioCtx.destination);
        analyserEnabled = true;
      } catch { analyserEnabled = false; }
    }

    function avgRange(arr, start, end) {
      let sum = 0;
      for (let i = start; i < end; i++) sum += arr[i];
      return sum / (end - start);
    }

    let startTime = performance.now();

    // === SIMPLE, STABLE VISUALIZER (Replaces complex/crashing code) ===
    function drawFrame() {
      // Use a simple color pulse as a reliable fallback/demo
      const t = (performance.now() - startTime) / 1000;
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      const cx = w/2;
      const cy = h/2;

      let energy = 0.5;

      // Handle audio input
      if (analyserEnabled && isPlaying) {
        analyser.getByteFrequencyData(dataArray);
        const avg = avgRange(dataArray, 0, dataArray.length);
        energy = Math.min(1, avg / 255 * 5.0); // Simple gain
      } else {
        // Simple pulsing demo when paused/no audio
        energy = (Math.sin(t*2) + 1) / 2;
      }

      // 1. Background
      ctx.fillStyle = "#000000";
      ctx.fillRect(0, 0, w, h);
      
      // 2. Central Pulse
      const baseRadius = Math.min(w, h) * 0.1;
      const currentRadius = baseRadius + energy * 50; 
      const hue = (t * 50) % 360; 

      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, currentRadius);
      g.addColorStop(0, `hsl(${hue}, 100%, 70%)`);
      g.addColorStop(0.5, `hsl(${hue + 30}, 80%, 40%, 0.5)`);
      g.addColorStop(1, `hsl(${hue + 60}, 50%, 20%, 0)`);
      
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(cx, cy, currentRadius, 0, Math.PI * 2);
      ctx.fill();

      // 3. Simple Neon Dot
      ctx.shadowBlur = 10 + energy * 15;
      ctx.shadowColor = `hsl(${hue}, 100%, 50%)`;
      ctx.fillStyle = `hsl(${hue}, 100%, 80%)`;
      ctx.beginPath();
      ctx.arc(cx, cy, 5 + energy * 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      
      requestAnimationFrame(drawFrame);
    }
    requestAnimationFrame(drawFrame);

    // Play/Pause button logic (simplified to match your current HTML)
    kick.addEventListener("click", () => {
      if (audio.paused) {
        audio.play().then(() => {
          isPlaying = true;
          setStatus("playing");
          initAnalyser();
          if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
        }).catch(() => setStatus("tap the player above to start"));
      } else {
        audio.pause();
        isPlaying = false;
        setStatus("paused");
      }
    });

    audio.addEventListener("play", () => {
      isPlaying = true;
      setStatus("playing");
      initAnalyser();
      if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    });

    audio.addEventListener("pause", () => {
      isPlaying = false;
      setStatus("paused");
    });

    audio.addEventListener("error", () => setStatus("audio error (stream offline?)"));
  });
  </script>

</body>
</html>
