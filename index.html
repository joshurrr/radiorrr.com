<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Radio RRR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #050710;
      color: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .wrapper {
      max-width: 600px;
      width: 100%;
      padding: 2.5rem 1.75rem;
      border-radius: 18px;
      background: radial-gradient(circle at top, #4338ca 0, #050710 55%);
      box-shadow: 0 18px 40px rgba(0,0,0,0.55);
      text-align: center;
    }
    .tagline {
      font-size: 0.95rem;
      color: #c7c7ff;
      margin: 0.5rem 0 1.25rem;
    }
    .visualizer {
      width: 100%;
      height: 260px;
      border-radius: 14px;
      overflow: hidden;
      background: #050710;
      margin-bottom: 1.5rem;
    }
    #viz { width: 100%; height: 100%; display: block; }
    .channel {
      padding: 1.2rem 1.4rem;
      border-radius: 16px;
      background: rgba(10,10,30,0.85);
      border: 1px solid rgba(129,140,248,0.5);
      margin-bottom: 1.75rem;
      text-align: left;
    }
    .channel span { font-weight: 600; font-size: 1rem; }
    .channel small { font-size: 0.8rem; opacity: 0.75; }
    audio { width: 100%; margin-top: 0.8rem; }
    .status { display:none; font-size: 0.8rem; margin-top: 0.4rem; opacity: 0.8; }
    .kick {
      margin-top:0.6rem; padding:0.45rem 0.7rem;
      border-radius:10px; border:1px solid rgba(129,140,248,0.6);
      background:#0b1020; color:#c7c7ff;
      cursor:pointer; font-size:0.85rem;
    }
    .video-container {
      position: relative;
      width: 100%; padding-bottom: 56.25%;
      margin-top: 0.8rem;
    }
    .video-container iframe {
      position: absolute; width: 100%; height: 100%; border: 0;
      top: 0; left: 0; border-radius: 12px;
    }
    .links { margin-top: 0.75rem; font-size: 0.85rem; text-align:center; }
    .links a { color: #a5b4fc; text-decoration: none; margin: 0 0.4rem; }
    .footnote { margin-top: 1.5rem; font-size: 0.7rem; opacity: 0.55; }
  </style>
</head>

<body>
  <main class="wrapper">

    <img src="logo.png" alt="Radio RRR Logo"
         style="width: 300px; max-width: 90%; margin: 0 auto 10px; display: block;">

    <p class="tagline">Streaming Electro · Synth · 80s · Chill</p>

    <!-- RADIO STREAM + VISUALIZER -->
    <div class="channel">
      <span id="streamTitle">RADIO RRR Live</span><br />
      <small id="streamSubtitle">No sound? Press play >></small>

      <div class="visualizer">
        <canvas id="viz"></canvas>
      </div>

      <audio id="liveStream" controls crossorigin="anonymous">
        <source src="https://stream.nightride.fm/nightride.mp3" type="audio/mpeg" />
      </audio>

      <button id="kickPlay" class="kick">Play</button>
      <div id="status" class="status"></div>
    </div>

    <!-- TIKTOK -->
    <div class="channel">
      <span>Latest on TikTok</span><br />
      <small>@josh.u.rrr · newest shorts</small>

      <blockquote class="tiktok-embed"
        cite="https://www.tiktok.com/@josh.u.rrr"
        data-unique-id="josh.u.rrr"
        data-embed-type="creator"
        style="max-width:100%; min-width:280px; margin-top:0.8rem;">
        <section>
          <a target="_blank" href="https://www.tiktok.com/@josh.u.rrr">@josh.u.rrr</a>
        </section>
      </blockquote>
    </div>

    <!-- YOUTUBE LIKES -->
    <div class="channel">
      <span>YouTube Likes</span><br />
      <small>Latest videos we liked</small>

      <div class="video-container">
        <iframe
          src="https://www.youtube.com/embed/videoseries?list=PLli1uTuS0FH7xR1QBnIvY3V9btomaSpTv"
          allowfullscreen
          loading="lazy">
        </iframe>
      </div>
    </div>

    <div class="links">
      <a href="https://www.instagram.com/radio.rrr/" target="_blank">Instagram</a> ·
      <a href="https://www.tiktok.com/@josh.u.rrr" target="_blank">TikTok</a> ·
      <a href="https://www.youtube.com/@RADIO_RRR" target="_blank">YouTube</a> ·
      <a href="https://github.com/joshurrr" target="_blank">GitHub</a>
    </div>

    <p class="footnote">Streaming 24/7</p>
  </main>

  <script async src="https://www.tiktok.com/embed.js"></script>

  <script>
  document.addEventListener("DOMContentLoaded", function () {
    // -------------------- Dynamic title --------------------
    var titleEl = document.getElementById("streamTitle");

    function getDayPeriod(hour) {
      if (hour < 12) return "Morning";
      if (hour < 17) return "Afternoon";
      return "Night";
    }

    function updateTitle() {
      var now = new Date();
      var days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
      var dayName = days[now.getDay()];
      var period = getDayPeriod(now.getHours());
      titleEl.textContent = "RADIO RRR Live \u2013 " + dayName + " " + period + " Mix";
    }

    updateTitle();

    // -------------------- Visualizer + Stream --------------------
    var audio    = document.getElementById("liveStream");
    var statusEl = document.getElementById("status");
    var kick     = document.getElementById("kickPlay");
    var canvas   = document.getElementById("viz");
    var ctx      = canvas.getContext("2d");

    function setStatus(msg) {
      statusEl.style.display = "block";
      statusEl.textContent = "Status: " + msg;
    }

    function resize() {
      var dpr = window.devicePixelRatio || 1;
      var w = canvas.clientWidth  || canvas.parentNode.clientWidth  || 600;
      var h = canvas.clientHeight || canvas.parentNode.clientHeight || 260;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    window.addEventListener("resize", resize);

    var audioCtx = null;
    var analyser = null;
    var dataArray = null;
    var analyserEnabled = false;
    var analyserInitAttempted = false;
    var isPlaying = false;

    function initAnalyser() {
      if (analyserInitAttempted) return;
      analyserInitAttempted = true;
      try {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        audioCtx = new AC();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 1024;
        dataArray = new Uint8Array(analyser.frequencyBinCount);

        var sourceNode = audioCtx.createMediaElementSource(audio);
        sourceNode.connect(analyser);
        analyser.connect(audioCtx.destination);

        analyserEnabled = true;
      } catch (err) {
        console.warn("Analyser blocked, using fake waves instead", err);
        analyserEnabled = false;
      }
    }

    function avgRange(arr, start, end) {
      var sum = 0;
      for (var i = start; i < end; i++) sum += arr[i] || 0;
      return sum / (end - start || 1);
    }

    var startTime = performance.now();

    function drawFrame() {
      var now = performance.now();
      var t = (now - startTime) / 1000;
      var w = canvas.clientWidth;
      var h = canvas.clientHeight;

      if (!w || !h) {
        requestAnimationFrame(drawFrame);
        return;
      }

      var bass = 0, mid = 0, treb = 0, energy = 0.1;

      if (analyserEnabled && analyser && dataArray && isPlaying) {
        try {
