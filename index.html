<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Radio RRR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #050710;
      color: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .wrapper {
      max-width: 600px;
      width: 100%;
      padding: 2.5rem 1.75rem;
      border-radius: 18px;
      background: radial-gradient(circle at top, #4338ca 0, #050710 55%);
      box-shadow: 0 18px 40px rgba(0,0,0,0.55);
      text-align: center;
    }
    .tagline {
      font-size: 0.95rem;
      color: #c7c7ff;
      margin-bottom: 1.75rem;
      margin-top: 0.5rem;
    }
    .channel {
      padding: 1.2rem 1.4rem;
      border-radius: 16px;
      background: rgba(10,10,30,0.85);
      border: 1px solid rgba(129,140,248,0.5);
      margin-bottom: 1.75rem;
      text-align: left;
    }
    .channel span {
      font-weight: 600;
      font-size: 1rem;
    }
    .channel small {
      font-size: 0.8rem;
      opacity: 0.75;
    }
    audio {
      width: 100%;
      margin-top: 0.8rem;
    }
    .status {
      margin-top: 0.55rem;
      font-size: 0.78rem;
      opacity: 0.75;
    }
    .kick {
      margin-top:0.6rem;
      padding:0.45rem 0.7rem;
      border-radius:10px;
      border:1px solid rgba(129,140,248,0.6);
      background:#0b1020;
      color:#c7c7ff;
      cursor:pointer;
      font-size:0.85rem;
    }
    .kick:hover { filter: brightness(1.15); }
    .video-container {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      margin-top: 0.8rem;
    }
    .video-container iframe {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 0;
      top: 0;
      left: 0;
      border-radius: 12px;
    }
    .links {
      margin-top: 0.75rem;
      font-size: 0.85rem;
    }
    .links a {
      color: #a5b4fc;
      text-decoration: none;
      margin: 0 0.4rem;
    }
    .links a:hover { text-decoration: underline; }
    .footnote {
      margin-top: 1.5rem;
      font-size: 0.7rem;
      opacity: 0.55;
    }
  </style>
</head>

<body>
  <main class="wrapper">

    <img src="logo.png" alt="Radio RRR Logo" style="width: 300px; margin: 0 auto 20px; display: block;">

    <p class="tagline">Streaming Electro · Synth · 80s · Chill</p>

    <!-- AUDIO STREAM -->
    <div class="channel">
      <span id="streamTitle">Dark Synth Live Stream (guest station)</span><br />
      <small id="streamSubtitle">Powered by Nightride / REKT Network</small>

      <audio id="liveStream" controls crossorigin="anonymous">
        <!-- default sources (Mon-Sat) -->
        <source id="src1" src="https://stream.rekt.fm/darksynth.mp3" type="audio/mpeg" />
        <source id="src2" src="https://stream.rekt.fm/darksynth.ogg" type="audio/ogg" />
        Your browser does not support the audio element.
      </audio>

      <button id="kickPlay" class="kick">Play</button>
      <div id="status" class="status">Status: idle</div>
    </div>

    <!-- VIDEO STREAM -->
    <div class="channel">
      <span>video</span><br />
      <div class="video-container">
        <iframe
          src="https://www.youtube.com/embed/p6x_4q-xaYU?list=PLli1uTuS0FH6vQ05dGXjiAl2k5K5gZpZs"
          title="YouTube playlist player"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen>
        </iframe>
      </div>
    </div>

    <div class="links">
      <a href="https://www.instagram.com/radio.rrr/" target="_blank" rel="noopener">Instagram</a> ·
      <a href="https://www.tiktok.com/@josh.u.rrr" target="_blank" rel="noopener">TikTok</a> ·
      <a href="https://www.youtube.com/@RADIO_RRR" target="_blank" rel="noopener">YouTube</a> ·
      <a href="https://github.com/joshurrr" target="_blank" rel="noopener">GitHub</a>
    </div>

    <p class="footnote">Streaming 24/7</p>

  </main>

  <script>
    (function () {
      var audio = document.getElementById("liveStream");
      var src1 = document.getElementById("src1");
      var src2 = document.getElementById("src2");
      var titleEl = document.getElementById("streamTitle");
      var subEl = document.getElementById("streamSubtitle");
      var statusEl = document.getElementById("status");
      var kick = document.getElementById("kickPlay");

      function setStatus(msg) { statusEl.textContent = "Status: " + msg; }

      // Your schedule
      var defaultTitle = "Dark Synth Live Stream (guest station)";
      var defaultSubtitle = "Powered by Nightride / REKT Network";
      var defaultMp3 = "https://stream.rekt.fm/darksynth.mp3";
      var defaultOgg = "https://stream.rekt.fm/darksynth.ogg";

      var sundayTitle = "Sunday Recovery Sessions";
      var sundaySubtitle = "Chill / dark synth downshift";
      // PUT YOUR SUNDAY STREAM HERE (mp3 + ogg if you have it)
      var sundayMp3 = "https://stream.rekt.fm/darksynth.mp3";
      var sundayOgg = "https://stream.rekt.fm/darksynth.ogg";

      var isSunday = (new Date()).getDay() === 0;

      if (isSunday) {
        titleEl.textContent = sundayTitle;
        subEl.textContent = sundaySubtitle;
        src1.src = sundayMp3;
        src2.src = sundayOgg;
      } else {
        titleEl.textContent = defaultTitle;
        subEl.textContent = defaultSubtitle;
        src1.src = defaultMp3;
        src2.src = defaultOgg;
      }

      audio.load();

      kick.addEventListener("click", function () {
        setStatus("trying to play...");
        audio.play().then(function () {
          setStatus("playing");
        }).catch(function (err) {
          console.log(err);
          setStatus("blocked by browser (click Play again or disable Shields)");
        });
      });

      audio.addEventListener("playing", function(){ setStatus("playing"); });
      audio.addEventListener("pause", function(){ setStatus("paused"); });
      audio.addEventListener("waiting", function(){ setStatus("buffering..."); });
      audio.addEventListener("error", function(){ setStatus("error loading stream"); });
    })();
  </script>

</body>
</html>
