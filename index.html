<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Radio RRR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- KEEP ALL YOUR ORIGINAL HEAD CONTENT -->
</head>

<body>
  <!-- KEEP ALL YOUR ORIGINAL HTML CONTENT -->

  <script>
    document.addEventListener("DOMContentLoaded", function () {

      const canvas = document.getElementById("viz");
      const ctx = canvas.getContext("2d");

      let audioCtx = null;
      let analyser = null;
      let dataArray = null;
      let analyserReady = false;

      // KEEP YOUR ORIGINAL ANALYSER INIT CODE

      const particles = [];
      const maxParticles = 90;

      class Particle {
        constructor(x, y, vx, vy, hue, size) {
          this.x = x; this.y = y;
          this.vx = vx; this.vy = vy;
          this.hue = hue;
          this.size = size;
          this.alpha = 1;
        }
        update() {
          this.x += this.vx;
          this.y += this.vy;
          this.vy += 0.05;
          this.alpha -= 0.015;
        }
        draw(ctx) {
          ctx.globalAlpha = this.alpha;
          const g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size);
          g.addColorStop(0, `hsla(${this.hue},100%,70%,1)`);
          g.addColorStop(1, `hsla(${this.hue},100%,50%,0)`);
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 1;
        }
      }

      function drawFrame() {
        if (!canvas || !ctx) { requestAnimationFrame(drawFrame); return; }

        const t = performance.now() / 1000;
        const w = canvas.clientWidth;
        const h = canvas.clientHeight;
        const cx = w / 2;
        const cy = h / 2;

        let bass = 0.25 + 0.15 * Math.sin(t * 1.7);
        let mid  = 0.20 + 0.10 * Math.sin(t * 2.1 + 1.0);
        let treble = 0.18 + 0.08 * Math.sin(t * 2.6 + 2.2);
        let spectrum = null;

        if (analyserReady && analyser && dataArray) {
          analyser.getByteFrequencyData(dataArray);
          spectrum = dataArray;

          const bassEnd = Math.floor(dataArray.length * 0.10);
          const midEnd  = Math.floor(dataArray.length * 0.40);

          let bassSum = 0, midSum = 0, trebleSum = 0;
          for (let i = 0; i < bassEnd; i++) bassSum += dataArray[i];
          for (let i = bassEnd; i < midEnd; i++) midSum += dataArray[i];
          for (let i = midEnd; i < dataArray.length * 0.80; i++) trebleSum += dataArray[i];

          bass = (bassSum / Math.max(1,bassEnd)) / 255;
          mid = (midSum / Math.max(1,(midEnd - bassEnd))) / 255;
          treble = (trebleSum / Math.max(1,(dataArray.length * 0.80 - midEnd))) / 255;
        }

        const energy = (bass + mid + treble) / 3;
        const baseHue = (t * 30 + energy * 200) % 360;

        // CLEAR
        ctx.fillStyle = "rgba(0, 0, 0, 0.30)";
        ctx.fillRect(0, 0, w, h);

        // SHAKE
        ctx.save();
        const shake = bass * 5;
        ctx.translate(
          (Math.random() - 0.5) * shake,
          (Math.random() - 0.5) * shake
        );

        // GRID
        ctx.strokeStyle = "rgba(255, 0, 102, 0.15)";
        for (let i = 0; i < h; i += 40) {
          const y = h - i;
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(w, y);
          ctx.stroke();
        }

        for (let i = -w; i < w * 2; i += 40) {
          const x = i + (t * 60 % 40);
          ctx.beginPath();
          ctx.moveTo(x, h);
          ctx.lineTo(w / 2, h * 0.5);
          ctx.stroke();
        }

        // RINGS
        for (let i = 0; i < 4; i++) {
          const radius = Math.min(w, h) * (0.22 + i * 0.08) + bass * 50;
          ctx.beginPath();
          ctx.arc(cx, cy, radius, 0, Math.PI * 2);
          ctx.strokeStyle = `hsla(${baseHue + i * 40}, 100%, 60%, ${0.25 + bass * 0.3})`;
          ctx.lineWidth = 2 + bass * 3;
          ctx.shadowBlur = 15 + bass * 20;
          ctx.shadowColor = `hsla(${baseHue}, 100%, 60%, 1)`;
          ctx.stroke();
        }
        ctx.shadowBlur = 0;

        // WAVEFORM
        if (spectrum) {
          ctx.beginPath();
          const radius = Math.min(w, h) * 0.25;
          for (let i = 0; i < spectrum.length; i += 8) {
            const angle = (i / spectrum.length) * Math.PI * 2;
            const value = spectrum[i] / 255;
            const r = radius + value * 60;
            const x = cx + Math.cos(angle) * r;
            const y = cy + Math.sin(angle) * r;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.closePath();
          ctx.strokeStyle = "rgba(255,255,255,0.25)";
          ctx.lineWidth = 2;
          ctx.stroke();
        }

        // PARTICLES
        if (bass > 0.45 && Math.random() > 0.6) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 2 + bass * 5;
          particles.push(new Particle(
            cx,
            cy,
            Math.cos(angle) * speed,
            Math.sin(angle) * speed,
            baseHue,
            3 + bass * 10
          ));
        }

        ctx.filter = "blur(2px)";
        for (let i = particles.length - 1; i >= 0; i--) {
          particles[i].update();
          particles[i].draw(ctx);
          if (particles[i].alpha <= 0) particles.splice(i, 1);
        }
        ctx.filter = "none";

        // CENTER ORB
        const orbRadius = 20 + bass * 40 + Math.sin(t * 4) * 5;
        const orb = ctx.createRadialGradient(cx, cy, 0, cx, cy, orbRadius * 2);
        orb.addColorStop(0, "#ffffff");
        orb.addColorStop(0.3, `hsla(${baseHue}, 100%, 70%, 0.9)`);
        orb.addColorStop(1, "transparent");

        ctx.fillStyle = orb;
        ctx.beginPath();
        ctx.arc(cx, cy, orbRadius, 0, Math.PI * 2);
        ctx.fill();

        // BASS FLASH
        if (bass > 0.6) {
          ctx.fillStyle = `rgba(255, 0, 102, ${bass * 0.2})`;
          ctx.fillRect(0, 0, w, h);
        }

        ctx.restore();

        requestAnimationFrame(drawFrame);
      }

      requestAnimationFrame(drawFrame);
    });
  </script>
</body>
</html>
