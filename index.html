<script async src="https://www.tiktok.com/embed.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {

  /* -----------------------------
     Dynamic title
  ----------------------------- */
  var titleEl = document.getElementById("streamTitle");

  function getDayPeriod(hour) {
    if (hour < 12) return "Morning";
    if (hour < 17) return "Afternoon";
    return "Night";
  }

  function updateTitle() {
    var now = new Date();
    var days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
    var dayName = days[now.getDay()];
    var period = getDayPeriod(now.getHours());
    titleEl.textContent = "RADIO RRR Live \u2013 " + dayName + " " + period + " Mix";
  }

  updateTitle();

  /* -----------------------------
     Visualizer + Stream Engine
  ----------------------------- */

  var audio    = document.getElementById("liveStream");
  var statusEl = document.getElementById("status");
  var kick     = document.getElementById("kickPlay");
  var canvas   = document.getElementById("viz");
  var ctx      = canvas.getContext("2d");

  function setStatus(msg) {
    statusEl.style.display = "block";
    statusEl.textContent = "Status: " + msg;
  }

  function resize() {
    var dpr = window.devicePixelRatio || 1;
    var w = canvas.clientWidth  || canvas.parentNode.clientWidth  || 600;
    var h = canvas.clientHeight || canvas.parentNode.clientHeight || 260;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener("resize", resize);

  var audioCtx = null;
  var analyser = null;
  var dataArray = null;
  var analyserEnabled = false;
  var analyserInitAttempted = false;
  var isPlaying = false;

  function initAnalyser() {
    if (analyserInitAttempted) return;
    analyserInitAttempted = true;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      audioCtx = new AC();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 1024;
      dataArray = new Uint8Array(analyser.frequencyBinCount);

      var sourceNode = audioCtx.createMediaElementSource(audio);
      sourceNode.connect(analyser);
      analyser.connect(audioCtx.destination);

      analyserEnabled = true;
      console.log("Analyser enabled");
    } catch (err) {
      console.warn("Analyser blocked, using fake waves instead", err);
      analyserEnabled = false;
    }
  }

  function avgRange(arr, start, end) {
    var sum = 0;
    for (var i = start; i < end; i++) sum += arr[i] || 0;
    return sum / (end - start || 1);
  }

  var startTime = performance.now();

  function drawFrame() {
    var now = performance.now();
    var t = (now - startTime) / 1000;
    var w = canvas.clientWidth;
    var h = canvas.clientHeight;

    if (!w || !h) {
      requestAnimationFrame(drawFrame);
      return;
    }

    var bass = 0, mid = 0, treb = 0, energy = 0.1;

    if (analyserEnabled && analyser && dataArray && isPlaying) {
      try {
        analyser.getByteFrequencyData(dataArray);
        var len = dataArray.length;
        bass = avgRange(dataArray, 0, Math.floor(len * 0.08)) / 255;
        mid  = avgRange(dataArray, Math.floor(len * 0.08), Math.floor(len * 0.4)) / 255;
        treb = avgRange(dataArray, Math.floor(len * 0.4), len) / 255;
        energy = bass * 1.2 + mid * 0.6 + treb * 0.3;
      } catch (e) {
        analyserEnabled = false;
      }
    }

    // Fake motion when not analysing / not playing
    if (!analyserEnabled || !isPlaying) {
      bass = (Math.sin(t * 2.0) + 1) / 2;
      mid  = (Math.sin(t * 1.3 + 1.2) + 1) / 2;
      treb = (Math.sin(t * 3.1 + 0.7) + 1) / 2;
      energy = (bass + mid + treb) / 3;
    }

    var horizon = h * 0.55;
    var cx = w / 2;

    /* ---------------------------
       NEON SUNSET BACKGROUND
    --------------------------- */

    // Sky gradient
    var sky = ctx.createLinearGradient(0, 0, 0, horizon);
    sky.addColorStop(0,   "#090018");
    sky.addColorStop(0.3, "#3a0060");
    sky.addColorStop(0.65,"#ff0066");
    sky.addColorStop(1,   "#ff6600");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, w, horizon);

    // Stars drifting
    var starCount = 90;
    ctx.fillStyle = "rgba(255,255,255,0.9)";
    for (var i = 0; i < starCount; i++) {
      var sx = (i * 73 + (t * 18)) % w;
      var sy = (i * 53) % (h * 0.4);
      var size = (i % 7 === 0 ? 1.4 : 0.7);
      ctx.fillRect(sx, sy, size, size);
    }

    // Sun wobbling with bass
    var sunRadius = Math.min(w, h) * 0.16;
    var sunY = horizon - sunRadius * 0.25 - bass * 10;
    var sunGrad = ctx.createRadialGradient(
      cx, sunY, sunRadius * 0.1,
      cx, sunY, sunRadius
    );
    sunGrad.addColorStop(0, "rgba(255,255,220,1)");
    sunGrad.addColorStop(0.4, "rgba(255,190,100,0.98)");
    sunGrad.addColorStop(1, "rgba(255,0,80,0)");
    ctx.fillStyle = sunGrad;
    ctx.beginPath();
    ctx.arc(cx, sunY, sunRadius, 0, Math.PI * 2);
    ctx.fill();

    // Sun scanlines
    ctx.save();
    ctx.globalCompositeOperation = "source-atop";
    ctx.fillStyle = "rgba(10,5,20,0.75)";
    var stripeH = sunRadius * 0.14;
    for (var sy2 = -sunRadius; sy2 < sunRadius; sy2 += stripeH * 1.7) {
      ctx.fillRect(cx - sunRadius, sunY + sy2, sunRadius * 2, stripeH);
    }
    ctx.restore();

    // Water
    var waterGrad = ctx.createLinearGradient(0, horizon, 0, h);
    waterGrad.addColorStop(0, "#150020");
    waterGrad.addColorStop(0.5, "#05071a");
    waterGrad.addColorStop(1, "#02030a");
    ctx.fillStyle = waterGrad;
    ctx.fillRect(0, horizon, w, h);

    // Sun reflection
    var reflectGrad = ctx.createLinearGradient(cx, horizon, cx, h);
    reflectGrad.addColorStop(0, "rgba(255,120,160,0.7)");
    reflectGrad.addColorStop(0.4,"rgba(255,80,200,0.35)");
    reflectGrad.addColorStop(1, "rgba(255,0,150,0)");
    ctx.fillStyle = reflectGrad;
    ctx.globalAlpha = 0.55 + energy * 0.25;
    var reflectWidth = sunRadius * 1.5 + bass * 24;
    ctx.beginPath();
    ctx.moveTo(cx - reflectWidth, horizon);
    ctx.quadraticCurveTo(cx, h * (0.8 + 0.05 * bass), cx + reflectWidth, horizon);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 1;

    // Water scanlines
    ctx.save();
    ctx.globalAlpha = 0.16;
    ctx.fillStyle = "rgba(0,0,0,1)";
    var gap = 3;
    var off = (t * 40) % gap;
    for (var y3 = off; y3 < h; y3 += gap) {
      ctx.fillRect(0, y3, w, 1);
    }
    ctx.restore();

    /* ---------------------------
       DJ MADE OF WAVES + DOTS
       (always visible, moves more when playing)
    --------------------------- */

    var djEnergy = (isPlaying ? 1.2 : 0.4) * (0.4 + energy);
    var djX = cx;
    var djBaseY = horizon + (h - horizon) * 0.18;
    var deckY = djBaseY + 52;

    // Deck line
    ctx.save();
    ctx.globalAlpha = 0.9;
    var deckGrad = ctx.createLinearGradient(0, deckY - 4, 0, deckY + 4);
    deckGrad.addColorStop(0, "rgba(255,0,120,0.95)");
    deckGrad.addColorStop(1, "rgba(0,220,255,0.95)");
    ctx.strokeStyle = deckGrad;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(djX - w * 0.24, deckY);
    ctx.lineTo(djX + w * 0.24, deckY);
    ctx.stroke();
    ctx.restore();

    // Head: ring of dots
    var headRadius = 22 + bass * 18;
    var headY = djBaseY - 40 - bass * 8;
    var headDots = 34;
    for (var hd = 0; hd < headDots; hd++) {
      var angle = (hd / headDots) * Math.PI * 2;
      var wobble = Math.sin(t * 4 + angle * 3) * 2.5 * djEnergy;
      var r = headRadius + wobble;

      var hx = djX + Math.cos(angle) * r;
      var hy = headY + Math.sin(angle) * r;

      var hSize = 2 + treb * 3;
      var hAlpha = 0.55 + 0.45 * Math.sin(t * 5 + hd * 0.5);
      ctx.fillStyle = "rgba(255,255,255," + hAlpha.toFixed(2) + ")";
      ctx.beginPath();
      ctx.arc(hx, hy, hSize, 0, Math.PI * 2);
      ctx.fill();
    }

    // Headphone arcs as colored dots
    var hpOffset = headRadius + 6;
    var hpDots = 18;
    for (var hi = 0; hi < hpDots; hi++) {
      var side = hi < hpDots / 2 ? -1 : 1;
      var localIndex = hi % (hpDots / 2);
      var fracHP = localIndex / (hpDots / 2 - 1);
      var ang = Math.PI * (0.35 + fracHP * 0.3);

      var wob = Math.sin(t * 3 + fracHP * 6 * side) * 2 * djEnergy;
      var rr = hpOffset + wob;

      var hpx = djX + side * Math.cos(ang) * rr;
      var hpy = headY - Math.sin(ang) * rr;

      var hpSize = 2 + mid * 3;
      ctx.fillStyle = (side < 0)
        ? "rgba(255,120,250,0.9)"
        : "rgba(0,240,255,0.9)";
      ctx.beginPath();
      ctx.arc(hpx, hpy, hpSize, 0, Math.PI * 2);
      ctx.fill();
    }

    // Torso: vertical waves of dots
    var torsoHeight = 60 + mid * 40;
    var torsoDots = 20;
    for (var ti = 0; ti < torsoDots; ti++) {
      var fracT = ti / (torsoDots - 1);
      var ty = headY + 10 + fracT * torsoHeight;
      var sway = Math.sin(t * 3 + fracT * 4) * 10 * djEnergy;

      var spread = 18 + bass * 12;

      var baseAlpha = 0.3 + 0.7 * fracT;
      var tSize = 2 + energy * 3;

      // left side
      ctx.fillStyle = "rgba(255,0,150," + baseAlpha.toFixed(2) + ")";
      ctx.beginPath();
      ctx.arc(djX - spread + sway * 0.5, ty, tSize, 0, Math.PI * 2);
      ctx.fill();

      // right side
      ctx.fillStyle = "rgba(0,200,255," + baseAlpha.toFixed(2) + ")";
      ctx.beginPath();
      ctx.arc(djX + spread + sway * 0.5, ty, tSize, 0, Math.PI * 2);
      ctx.fill();

      // center “core”
      ctx.fillStyle = "rgba(255,255,255," + (baseAlpha * 0.7).toFixed(2) + ")";
      ctx.beginPath();
      ctx.arc(djX + sway * 0.15, ty, tSize * 0.7, 0, Math.PI * 2);
      ctx.fill();
    }

    // Arms: waveform strings of dots reaching to decks
    function drawArm(side) {
      var armDots = 28;
      var startY = headY + 14;
      for (var ai = 0; ai < armDots; ai++) {
        var fracA = ai / (armDots - 1);

        var baseX = djX + side * 14 * (1 - fracA) + side * (w * 0.17) * fracA;
        var baseY = startY + (deckY - 8 - startY) * fracA;

        var wave = Math.sin(fracA * Math.PI * 4 + t * 7 + side * 0.8) *
                   (8 + 26 * djEnergy * fracA);

        var ax = baseX + wave * side;
        var ay = baseY + Math.cos(fracA * Math.PI * 3 + t * 4) *
                 (3 + 7 * djEnergy * (1 - fracA));

        var aSize = 1.8 + energy * 2.5 * (1 - fracA);
        var aAlpha = 0.25 + 0.75 * (1 - fracA) * (0.7 + 0.3 * bass);

        ctx.fillStyle = (side < 0)
          ? "rgba(255,80,220," + aAlpha.toFixed(2) + ")"
          : "rgba(0,220,255," + aAlpha.toFixed(2) + ")";

        ctx.beginPath();
        ctx.arc(ax, ay, aSize, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    drawArm(-1);
    drawArm(1);

    // Deck lights
    var deckDots = 22;
    for (var di = 0; di < deckDots; di++) {
      var fracD = di / (deckDots - 1);
      var dx = djX - w * 0.21 + fracD * (w * 0.42);
      var dy = deckY + Math.sin(t * 9 + di * 0.7) * (3 + bass * 7);

      var dSize = 1.6 + energy * 2.4;
      var dAlpha = 0.3 + 0.7 * ((Math.sin(t * 6 + di) + 1) / 2) * energy;

      ctx.fillStyle = (di % 3 === 0)
        ? "rgba(255,255,255," + dAlpha.toFixed(2) + ")"
        : (di % 3 === 1
            ? "rgba(255,255,0," + dAlpha.toFixed(2) + ")"
            : "rgba(255,0,150," + dAlpha.toFixed(2) + ")");

      ctx.beginPath();
      ctx.arc(dx, dy, dSize, 0, Math.PI * 2);
      ctx.fill();
    }

    requestAnimationFrame(drawFrame);
  }

  requestAnimationFrame(drawFrame);

  /* -----------------------------
     Play / Pause wiring
  ----------------------------- */

  kick.addEventListener("click", function () {
    if (audio.paused) {
      var p = audio.play();
      if (p && p.then) {
        p.then(function () {
          isPlaying = true;
          setStatus("playing");
          initAnalyser();
          if (audioCtx && audioCtx.state === "suspended") {
            audioCtx.resume();
          }
        }).catch(function () {
          setStatus("tap the player above to start");
        });
      }
    } else {
      audio.pause();
      isPlaying = false;
      setStatus("paused");
    }
  });

  audio.addEventListener("play", function () {
    isPlaying = true;
    setStatus("playing");
    initAnalyser();
    if (audioCtx && audioCtx.state === "suspended") {
      audioCtx.resume();
    }
  });

  audio.addEventListener("pause", function () {
    isPlaying = false;
    setStatus("paused");
  });

  audio.addEventListener("error", function () {
    setStatus("audio error (stream offline?)");
  });
});
</script>
