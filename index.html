<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        linear-gradient(
          rgba(0, 12, 9, 0.18),
          rgba(0, 8, 7, 0.28)
        ),
        url('radiorrr_egypt_background.png') center center / cover fixed no-repeat;
      background-color: #020806;
      color: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 1rem 0.75rem 1.5rem;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(
          ellipse at center,
          rgba(0, 255, 140, 0.04),
          transparent 55%
        ),
        linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.05),
          rgba(0, 0, 0, 0.22)
        );
    }

    .wrapper {
      max-width: 900px;
      width: 100%;
      padding: 1.25rem 1.25rem 1.5rem;
      border-radius: 18px;
      background: rgba(7, 8, 24, 0.94);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      border: 1px solid rgba(129,140,248,0.38);
      position: relative;
      z-index: 1;
      box-shadow:
        0 0 10px rgba(67, 56, 202, 0.5),
        0 0 30px rgba(255, 0, 102, 0.4);
      text-align: center;
      transition: all 0.3s ease-out;
    }

    /* HERO BANNER */
    .hero {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 1.6rem;
      padding: 1rem 0.95rem;
      border-radius: 16px;
      background:
        radial-gradient(circle at top left, rgba(255,0,102,0.30), transparent 55%),
        radial-gradient(circle at bottom right, rgba(56,189,248,0.20), transparent 55%),
        linear-gradient(90deg, rgba(5,7,22,0.88), rgba(5,7,22,0.38)),
        url('radiorrr_background.png') center / cover no-repeat;
      border: 1px solid rgba(129,140,248,0.6);
      box-shadow:
        0 0 12px rgba(255, 0, 102, 0.45),
        0 0 26px rgba(56,189,248,0.35);
      margin-bottom: 1rem;
      text-align: left;
    }

    .hero-left img {
      width: 150px;
      max-width: 100%;
      border-radius: 10px;
      display: block;
    }

    .hero-right {
      flex: 1;
      min-width: 0;
    }

    .live-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.14rem 0.72rem;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      background: rgba(239, 68, 68, 0.18);
      border: 1px solid rgba(248, 113, 113, 0.6);
      color: #fecaca;
      margin-bottom: 0.5rem;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      flex: 0 0 8px;
      border-radius: 50%;
      background: #f87171;
      box-shadow: 0 0 8px rgba(248,113,113,0.95);
    }

    .hero-title {
      font-size: clamp(1.75rem, 3vw, 2.25rem);
      line-height: 1;
      font-weight: 900;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #e0e7ff;
      text-shadow:
        0 0 8px rgba(129,140,248,0.75),
        0 0 16px rgba(59,130,246,0.8);
      margin: 0 0 0.22rem;
    }

    .hero-main-message {
      font-size: clamp(1.05rem, 1.8vw, 1.35rem);
      line-height: 1.15;
      font-weight: 900;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: #ffffff;
      text-shadow:
        0 0 7px rgba(255,255,255,0.28),
        0 0 14px rgba(103,232,249,0.38);
      margin: 0 0 0.42rem;
    }

    .hero-description {
      max-width: 680px;
      font-size: 0.9rem;
      line-height: 1.4;
      font-weight: 600;
      color: #c7d2fe;
      margin: 0;
    }

    .hero-description strong {
      color: #67e8f9;
      font-weight: 800;
    }

    /* SEO INTRO */
    .seo-intro {
      max-width: 760px;
      margin: 0 auto 0.55rem;
      padding: 0 0.5rem;
      text-align: center;
    }

    .seo-intro h2 {
      font-size: 1.05rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 0.22rem;
    }

    .seo-intro p {
      color: #c7c7ff;
      font-size: 0.78rem;
      line-height: 1.35;
      margin: 0;
    }

    /* NAV TABS */
    .nav-tabs {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.5rem;
      margin-top: 0.4rem;
      margin-bottom: 0.45rem;
      padding-bottom: 0;
      width: 100%;
    }

    .nav-tabs a {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      padding: 0.32rem 0.45rem;
      min-width: 0;
      width: 100%;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.78rem;
      color: #c7c7ff;
      text-decoration: none;
      letter-spacing: 0.06em;
      cursor: pointer;
      border: 1px solid rgba(129,140,248,0.6);
      background: radial-gradient(circle at top, rgba(24, 31, 60, 0.95), rgba(6, 10, 25, 0.98));
      box-shadow: 0 0 8px rgba(15,23,42,0.8);
      text-shadow: 0 0 4px rgba(67, 56, 202, 0.6);
      transition:
        transform 0.15s ease,
        box-shadow 0.2s ease,
        color 0.2s ease,
        border-color 0.2s ease,
        background 0.2s ease;
      overflow: hidden;
    }

    .nav-tabs a::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(circle at top, rgba(255,255,255,0.08), transparent 55%);
      opacity: 0;
      transition: opacity 0.2s ease;
      pointer-events: none;
    }

    .nav-icon {
      font-size: 0.95rem;
      opacity: 0.85;
      transform: translateY(0);
      transition: transform 0.2s ease;
    }

    .nav-label {
      text-transform: uppercase;
    }

    .nav-tabs a:hover {
      transform: translateY(-1px);
      border-color: #ff4dab;
      box-shadow:
        0 0 10px rgba(255, 0, 102, 0.5),
        0 0 14px rgba(129,140,248,0.5);
      color: #ffe4ff;
    }

    .nav-tabs a:hover::after {
      opacity: 1;
    }

    .nav-tabs a.active {
      transform: translateY(-2px) scale(1.02);
      border-color: #ff0066;
      background: linear-gradient(
        135deg,
        rgba(34, 9, 53, 0.98),
        rgba(5, 24, 61, 0.98)
      );
      box-shadow:
        0 0 14px rgba(255, 0, 102, 0.85),
        0 0 18px rgba(129,140,248,0.9);
      color: #ffffff;
    }

    .nav-tabs a.active .nav-icon {
      transform: translateY(-1px);
    }

    /* LIVE NAV BUTTON */
    .nav-tabs a.live-nav {
      border-color: rgba(248,113,113,0.7);
      color: #fecaca;
      background:
        radial-gradient(
          circle at top,
          rgba(80,20,35,0.95),
          rgba(20,8,20,0.98)
        );
      box-shadow:
        0 0 8px rgba(239,68,68,0.25);
    }

    .nav-tabs a.live-nav:hover {
      border-color: #ff0066;
      color: #ffffff;
      box-shadow:
        0 0 12px rgba(255,0,102,0.7),
        0 0 18px rgba(248,113,113,0.45);
    }

    .nav-tabs a.live-nav .live-nav-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #f87171;
      box-shadow: 0 0 8px rgba(248,113,113,1);
      animation: livePulse 1.4s infinite;
    }

    @keyframes livePulse {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.45;
        transform: scale(0.75);
      }
    }

    .content-pane {
      width: 100%;
      transition: opacity 0.3s ease-in-out;
    }

    /* RECOMMEND A DJ */
    .recommend-dj-wrap {
      display: contents;
    }

    .recommend-dj-button {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      padding: 0.32rem 0.45rem;
      min-width: 0;
      width: 100%;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.78rem;
      color: #c7c7ff;
      text-decoration: none;
      letter-spacing: 0.06em;
      cursor: pointer;
      border: 1px solid rgba(129,140,248,0.6);
      background: radial-gradient(circle at top, rgba(24, 31, 60, 0.95), rgba(6, 10, 25, 0.98));
      box-shadow: 0 0 8px rgba(15,23,42,0.8);
      text-shadow: 0 0 4px rgba(67, 56, 202, 0.6);
      transition:
        transform 0.15s ease,
        box-shadow 0.2s ease,
        color 0.2s ease,
        border-color 0.2s ease,
        background 0.2s ease;
      overflow: hidden;
    }

    .recommend-dj-button:hover {
      transform: translateY(-1px);
      border-color: #ff4dab;
      box-shadow:
        0 0 10px rgba(255, 0, 102, 0.5),
        0 0 14px rgba(129,140,248,0.5);
      color: #ffe4ff;
    }

    .recommend-dj-button.active {
      transform: translateY(-2px) scale(1.02);
      border-color: #ff0066;
      background: linear-gradient(
        135deg,
        rgba(34, 9, 53, 0.98),
        rgba(5, 24, 61, 0.98)
      );
      box-shadow:
        0 0 14px rgba(255, 0, 102, 0.85),
        0 0 18px rgba(129,140,248,0.9);
      color: #ffffff;
    }

    .recommend-modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background: rgba(2, 4, 12, 0.78);
      backdrop-filter: blur(6px);
      z-index: 9999;
    }

    .recommend-modal.open {
      display: flex;
    }

    .recommend-modal-card {
      width: min(100%, 420px);
      position: relative;
      padding: 1.25rem;
      border: 1px solid rgba(129, 140, 248, 0.75);
      border-radius: 18px;
      background: radial-gradient(circle at top, rgba(24, 31, 60, 0.98), rgba(6, 10, 25, 0.99));
      box-shadow: 0 0 30px rgba(255, 0, 102, 0.22), 0 0 40px rgba(67, 56, 202, 0.18);
    }

    .recommend-modal-title {
      margin: 0 2rem 0.35rem 0;
      font-size: 1.05rem;
      color: #ffffff;
    }

    .recommend-modal-copy {
      margin: 0 0 1rem;
      color: #c7c7ff;
      font-size: 0.9rem;
      line-height: 1.45;
    }

    .recommend-modal-close {
      position: absolute;
      top: 0.65rem;
      right: 0.75rem;
      border: 0;
      background: transparent;
      color: #c7c7ff;
      font-size: 1.3rem;
      cursor: pointer;
      padding: 0.2rem 0.35rem;
    }

    .recommend-modal-close:hover {
      color: #ffffff;
    }

    .recommend-form label {
      display: block;
      margin-bottom: 0.4rem;
      color: #ffffff;
      font-size: 0.82rem;
      font-weight: 700;
    }

    .recommend-form input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid rgba(129, 140, 248, 0.6);
      border-radius: 10px;
      background: rgba(4, 8, 20, 0.92);
      color: #ffffff;
      padding: 0.7rem 0.8rem;
      outline: none;
    }

    .recommend-form input[type="text"]:focus {
      border-color: #ff0066;
      box-shadow: 0 0 0 2px rgba(255, 0, 102, 0.12);
    }

    .recommend-form button[type="submit"] {
      width: 100%;
      margin-top: 0.8rem;
      border: 1px solid #ff0066;
      border-radius: 10px;
      padding: 0.7rem 1rem;
      background: linear-gradient(135deg, rgba(255, 0, 102, 0.24), rgba(67, 56, 202, 0.22));
      color: #ffffff;
      font-weight: 800;
      letter-spacing: 0.05em;
      cursor: pointer;
    }

    .recommend-form button[type="submit"]:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    .recommend-status {
      min-height: 1.1rem;
      margin-top: 0.65rem;
      font-size: 0.82rem;
    }

    .recommend-status.success {
      color: #86efac;
    }

    .recommend-status.error {
      color: #fca5a5;
    }

    @media (max-width: 720px) {
      .recommend-modal-card {
        padding: 1rem;
      }
    }

    .hidden-pane {
      display: none;
    }

    /* VISUALIZER */
    .visualizer {
      width: 100%;
      height: 360px;
      border-radius: 14px;
      overflow: hidden;
      background: #000000;
      margin-bottom: 0.6rem;
      border: 2px solid #ff0066;
      box-shadow: 0 0 15px rgba(255, 0, 102, 0.5);
    }

    #viz {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* LIVE AUDIO */
    .live-audio-channel {
      text-align: left;
    }

    .live-audio-header {
      display: flex;
      align-items: baseline;
      justify-content: flex-start;
      gap: 0.75rem;
      margin-bottom: 0.65rem;
      flex-wrap: wrap;
    }

    .live-audio-title {
      font-size: 1.2rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 0.04em;
      text-shadow: 0 0 8px rgba(34,211,238,0.65);
    }

    .live-audio-subtitle {
      color: #a5b4fc;
      font-size: 0.78rem;
    }

    .audio-nav {
      border-color: rgba(34,211,238,0.55) !important;
      color: #bae6fd !important;
      background: radial-gradient(circle at top, rgba(8,45,58,0.95), rgba(6,10,25,0.98)) !important;
    }

    .audio-nav:hover {
      border-color: #22d3ee !important;
      color: #ffffff !important;
      box-shadow: 0 0 12px rgba(34,211,238,0.55), 0 0 18px rgba(129,140,248,0.45) !important;
    }

    .live-audio-stream-url {
      margin: 0 0 0.8rem;
      padding: 0.7rem 0.8rem;
      border: 1px solid rgba(34,211,238,0.45);
      border-radius: 10px;
      background: rgba(5,12,28,0.82);
    }

    .live-audio-stream-url-label {
      display: block;
      margin-bottom: 0.35rem;
      color: #67e8f9;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .live-audio-stream-url-row {
      display: flex;
      align-items: center;
      gap: 0.55rem;
    }

    .live-audio-stream-url-value {
      flex: 1;
      min-width: 0;
      padding: 0.55rem 0.65rem;
      border: 1px solid rgba(129,140,248,0.35);
      border-radius: 7px;
      background: rgba(0,0,0,0.5);
      color: #ffffff;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.82rem;
      line-height: 1.2;
      user-select: all;
      cursor: text;
      overflow-x: auto;
      white-space: nowrap;
    }

    .live-audio-copy-button {
      flex: 0 0 auto;
      padding: 0.55rem 0.75rem;
      border: 1px solid rgba(236,72,153,0.65);
      border-radius: 7px;
      background: rgba(70,8,45,0.75);
      color: #ffffff;
      font-weight: 800;
      font-size: 0.76rem;
      cursor: pointer;
    }

    .live-audio-copy-button:hover {
      border-color: #ec4899;
      box-shadow: 0 0 10px rgba(236,72,153,0.4);
    }

    @media (max-width: 600px) {
      .live-audio-stream-url-row {
        flex-direction: column;
        align-items: stretch;
      }

      .live-audio-copy-button {
        width: 100%;
      }
    }

    /* CHANNEL PANELS */
    .channel {
      padding: 0.9rem 1rem;
      border-radius: 16px;
      background: rgba(10,10,30,0.85);
      border: 1px solid rgba(129,140,248,0.5);
      margin-bottom: 1rem;
      text-align: left;
    }

    .channel span {
      font-weight: 600;
      font-size: 1rem;
    }

    .channel small {
      font-size: 0.8rem;
      color: #e0e0ff;
      opacity: 0.9;
    }

    /* Keep the live DJ area compact so the video starts higher on the page. */
    #live-section > .channel {
      padding: 0.65rem 0.85rem;
      margin-bottom: 0.75rem;
    }

    audio {
      width: 100%;
      margin-top: 0.2rem;
    }

    .status {
      display:none;
      font-size: 0.8rem;
      margin-top: 0.4rem;
      opacity: 0.9;
      color:#e0e0ff;
    }

    .kick {
      margin-top:0.6rem;
      padding:0.45rem 0.7rem;
      border-radius:10px;
      border:1px solid rgba(129,140,248,0.6);
      background:#0b1020;
      color:#c7c7ff;
      cursor:pointer;
      font-size:0.85rem;
      transition: all 0.3s;
      text-decoration: none;
      display: inline-block;
    }

    .kick:hover {
      color: #ff0066;
      border-color: #ff0066;
      box-shadow: 0 0 12px rgba(255, 0, 102, 0.7);
    }


    /* RANDOM LIVE DJ */
    .random-live-dj {
      display: none;
      margin-bottom: 0.75rem;
      padding: 0.65rem;
      border-radius: 16px;
      background:
        radial-gradient(circle at top left, rgba(34,211,238,0.18), transparent 55%),
        radial-gradient(circle at bottom right, rgba(250,204,21,0.12), transparent 55%),
        rgba(7,10,25,0.96);
      border: 1px solid rgba(34,211,238,0.68);
      box-shadow: 0 0 18px rgba(34,211,238,0.28), 0 0 28px rgba(168,85,247,0.2);
      text-align: left;
    }

    .random-live-header {
      display: block;
      margin-bottom: 0.45rem;
    }

    .random-live-heading-row {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 0.65rem 1rem;
      min-width: 0;
    }

    .random-live-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: #fff;
      text-shadow: 0 0 8px rgba(34,211,238,0.72);
      white-space: nowrap;
    }

    .random-live-now-playing {
      flex: 1;
      min-width: 240px;
      text-align: right;
      font-size: 1.248rem;
      font-weight: 700;
      color: #fde68a;
      text-shadow: 0 0 6px rgba(34,211,238,0.5);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .random-live-now-playing strong {
      color: #ffffff;
      font-weight: 800;
    }

    .random-live-program-target {
      margin-top: 0.55rem;
      padding: 0.5rem 0.65rem 0.6rem;
      border: 1px solid rgba(129, 140, 248, 0.34);
      border-radius: 10px;
      background: rgba(12, 15, 35, 0.68);
      box-shadow: 0 0 10px rgba(34, 211, 238, 0.06);
    }

    .random-live-program-target-label {
      color: #c7c7ff;
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      margin-bottom: 0.38rem;
      text-shadow: 0 0 6px rgba(34, 211, 238, 0.35);
    }

    /* RADIO ROUTER LIVE DJ PLAYER */
    .radio-router-player {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      min-height: 320px;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      border: 1px solid rgba(129,140,248,0.6);
      box-shadow: 0 0 15px rgba(255,0,102,0.25);
    }

    /* Enlarged/blurred copy fills the side areas behind the real portrait video. */
    .radio-router-player .live-dj-background {
      position: absolute;
      inset: -30px;
      width: calc(100% + 60px);
      height: calc(100% + 60px);
      object-fit: cover;
      filter: blur(24px) brightness(0.62) saturate(1.15);
      transform: scale(1.06);
      opacity: 0.95;
      z-index: 0;
      pointer-events: none;
      background: #000;
    }

    /* Keeps the actual DJ feed sharp and at its original portrait aspect ratio. */
    .radio-router-player #liveDjVideo {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      background: transparent;
    }

    .radio-router-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;

        0 0 20px rgba(251,146,60,0.42);
      transform: translateY(-1px);
    }

    .live-empty,
    .live-error {
      padding: 1.5rem;
      border-radius: 14px;
      border: 1px solid rgba(129,140,248,0.35);
      background: rgba(5,7,20,0.8);
      color: #c7c7ff;
      text-align: center;
    }

    .live-error {
      color: #fecaca;
      border-color: rgba(248,113,113,0.4);
    }

    /* LIVE GENRES DETECTED */
    /* CURRENT DJ — top card */
    .current-dj-card {
      margin: 0 0 0.85rem;
      padding: 0.9rem 1rem;
      border-radius: 14px;
      background:
        radial-gradient(circle at top left, rgba(168,85,247,0.16), transparent 55%),
        radial-gradient(circle at bottom right, rgba(34,211,238,0.10), transparent 55%),
        rgba(7,10,25,0.94);
      border: 1px solid rgba(168,85,247,0.52);
      box-shadow:
        0 0 14px rgba(168,85,247,0.16),
        inset 0 0 20px rgba(34,211,238,0.025);
      text-align: left;
      position: relative;
      overflow: hidden;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .current-dj-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(4,7,18,0.90), rgba(4,7,18,0.66) 55%, rgba(4,7,18,0.78));
      pointer-events: none;
      z-index: 0;
    }

    .current-dj-card .random-live-dj-row {
      position: relative;
      z-index: 1;
    }

    .current-dj-card-heading {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 0.75rem;
      margin-bottom: 0.65rem;
    }

    .current-dj-card-title {
      color: #ffffff;
      font-size: 0.9rem;
      font-weight: 900;
      letter-spacing: 0.07em;
      text-shadow: 0 0 8px rgba(168,85,247,0.7);
    }

    .current-dj-card-subtitle {
      color: #a5b4fc;
      font-size: 0.68rem;
      margin-top: 0.14rem;
    }

    .current-dj-live-badge {
      flex: 0 0 auto;
      padding: 0.25rem 0.55rem;
      border-radius: 999px;
      border: 1px solid rgba(248,113,113,0.65);
      background: rgba(127,29,29,0.24);
      color: #fecaca;
      font-size: 0.68rem;
      font-weight: 900;
      letter-spacing: 0.05em;
      box-shadow: 0 0 9px rgba(248,113,113,0.18);
    }

    .current-dj-card .random-live-dj-row {
      margin-bottom: 0;
    }

    /* LIVE GENRES DETECTED */
    .live-genres-detected {
      display: none;
      margin: 0 0 0.9rem;
      padding: 0.85rem 1rem;
      border-radius: 14px;
      background:
        radial-gradient(circle at top left, rgba(34,211,238,0.10), transparent 55%),
        rgba(7,10,25,0.92);
      border: 1px solid rgba(34,211,238,0.38);
      box-shadow: 0 0 12px rgba(34,211,238,0.12);
      text-align: left;
    }

    .live-genres-detected-title {
      display: flex;
      align-items: baseline;
      justify-content: flex-start;
      gap: 0.75rem;
      margin-bottom: 0.55rem;
    }

    .live-genres-detected-title strong {
      color: #ffffff;
      font-size: 0.92rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-shadow: 0 0 7px rgba(34,211,238,0.55);
    }

    .live-genres-detected-status {
      color: #a5b4fc;
      font-size: 0.7rem;
      white-space: nowrap;
    }

    .live-genres-detected-list {
      display: grid;
      gap: 0.34rem;
    }

    .live-genre-detected-row {
      display: grid;
      /* Dynamic genre-name column: it grows to fit the longest detected
         genre, while the bar automatically takes the remaining space. */
      grid-template-columns: max-content minmax(0, 1fr) 42px;
      align-items: center;
      gap: 0.55rem;
      min-width: 0;
    }

    .live-genre-detected-name {
      min-width: 0;
      max-width: min(32ch, 40vw);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #e0e0ff;
      font-size: 0.72rem;
      font-weight: 700;
    }

    .live-genre-detected-bar {
      height: 6px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(129,140,248,0.14);
      border: 1px solid rgba(129,140,248,0.14);
    }

    .live-genre-detected-bar > span {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #22d3ee, #7c3aed, #ff0066);
      box-shadow: 0 0 7px rgba(34,211,238,0.45);
    }

    .live-genre-detected-confidence {
      color: #ffffff;
      font-size: 0.7rem;
      font-weight: 800;
      text-align: right;
    }

    @media (max-width: 520px) {
      .live-genres-detected {
        padding: 0.75rem 0.8rem;
      }

      .live-genres-detected-title {
        align-items: flex-start;
        flex-direction: column;
        gap: 0.15rem;
      }

      .live-genre-detected-row {
        /* Keep the label content-sized on smaller screens too; the bar
           absorbs whatever width is left. */
        grid-template-columns: max-content minmax(0, 1fr) 40px;
        gap: 0.4rem;
      }
    }


    @media (max-width: 520px) {
      .live-genre-detected-name {
        max-width: 42vw;
      }
    }



    /* DISCOVER DJs
       Keep the discovery panel out of the individual LIVE DJ card grid.
       Making it span the complete grid also prevents its height from
       stretching the last LIVE DJ card in the same CSS grid row. */
    .dj-discovery {
      grid-column: 1 / -1;
      width: 100%;
      min-width: 0;
      margin-top: 0.25rem;
      padding: 1rem;
      border-radius: 16px;
      background:
        radial-gradient(circle at top left, rgba(255,0,102,0.10), transparent 52%),
        radial-gradient(circle at bottom right, rgba(34,211,238,0.08), transparent 55%),
        rgba(7,10,25,0.94);
      border: 1px solid rgba(129,140,248,0.48);
      box-shadow: 0 0 14px rgba(129,140,248,0.12);
      text-align: left;
    }

    .dj-discovery-header {
      margin-bottom: 0.75rem;
    }

    .dj-discovery-title {
      font-size: 1.2rem;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 8px rgba(34,211,238,0.55);
    }

    .dj-discovery-subtitle {
      margin-top: 0.2rem;
      color: #a5b4fc;
      font-size: 0.78rem;
    }

    .dj-discovery-search {
      width: 100%;
      padding: 0.72rem 0.85rem;
      border-radius: 10px;
      border: 1px solid rgba(129,140,248,0.58);
      background: rgba(3,7,18,0.92);
      color: #fff;
      outline: none;
      font-size: 0.9rem;
    }

    .dj-discovery-search::placeholder {
      color: #8185b8;
    }

    .dj-discovery-search:focus {
      border-color: #22d3ee;
      box-shadow: 0 0 0 2px rgba(34,211,238,0.10), 0 0 12px rgba(34,211,238,0.22);
    }

    .dj-discovery-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin: 0.65rem 0 0.8rem;
    }

    .dj-discovery-chip {
      border: 1px solid rgba(129,140,248,0.48);
      border-radius: 999px;
      padding: 0.3rem 0.62rem;
      background: rgba(15,23,42,0.82);
      color: #c7c7ff;
      font-size: 0.68rem;
      font-weight: 800;
      cursor: pointer;
    }

    .dj-discovery-chip:hover,
    .dj-discovery-chip.active {
      border-color: #22d3ee;
      color: #fff;
      box-shadow: 0 0 9px rgba(34,211,238,0.28);
    }

    .dj-discovery-results {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 0.75rem;
      align-items: stretch;
    }

    .dj-discovery-card {
      min-width: 0;
      padding: 0.8rem;
      border-radius: 13px;
      border: 1px solid rgba(168,85,247,0.42);
      background: rgba(7,10,25,0.92);
      color: inherit;
      text-decoration: none;
      transition: transform 0.15s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .dj-discovery-card:hover,
    .dj-discovery-card:focus-visible {
      transform: translateY(-2px);
      border-color: #22d3ee;
      box-shadow: 0 0 16px rgba(34,211,238,0.28);
      outline: none;
    }

    .dj-discovery-card-top {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      min-width: 0;
    }

    .dj-discovery-thumb {
      width: 52px;
      height: 52px;
      flex: 0 0 52px;
      border-radius: 11px;
      object-fit: cover;
      border: 1px solid rgba(129,140,248,0.55);
      background: rgba(15,23,42,0.9);
    }

    .dj-discovery-name-wrap {
      min-width: 0;
    }

    .dj-discovery-name {
      color: #fff;
      font-weight: 850;
      font-size: 0.92rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .dj-discovery-handle {
      color: #a5b4fc;
      font-size: 0.7rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .dj-discovery-status {
      margin-top: 0.55rem;
      color: #94a3b8;
      font-size: 0.66rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .dj-discovery-status.live {
      color: #fecaca;
    }

    .dj-discovery-genres {
      display: flex;
      flex-wrap: wrap;
      gap: 0.28rem;
      margin-top: 0.45rem;
    }

    .dj-discovery-empty {
      grid-column: 1 / -1;
      padding: 1rem;
      border-radius: 12px;
      border: 1px solid rgba(129,140,248,0.3);
      color: #a5b4fc;
      text-align: center;
      background: rgba(5,7,20,0.65);
      font-size: 0.8rem;
    }

    @media (max-width: 900px) {
      .dj-discovery-results {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 560px) {
      .dj-discovery {
        padding: 0.8rem;
      }

      .dj-discovery-results {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    /* SCHEDULE — spreadsheet / Excel-style grid */
    .schedule-table {
      overflow-x: auto;
      margin-top: 1rem;
      padding-top: 0.5rem;
      border: 1px solid rgba(129, 140, 248, 0.45);
      border-radius: 6px;
      overflow-y: hidden;
      background: rgba(5, 7, 16, 0.55);
    }

    .schedule-row {
      display: grid;
      grid-template-columns: 1.05fr 1.05fr 1.25fr 2.65fr;
      gap: 0;
      align-items: stretch;
      padding: 0;
      border-bottom: 1px solid rgba(129, 140, 248, 0.38);
      color: #f5f5f5;
      font-size: 0.84rem;
    }

    .schedule-row > div {
      padding: 0.72rem 0.75rem;
      border-right: 1px solid rgba(129, 140, 248, 0.32);
    }

    .schedule-row > div:last-child {
      border-right: 0;
    }

    .schedule-row:last-child {
      border-bottom: 0;
    }

    .schedule-row > div:first-child {
      color: #ffffff;
      font-weight: 700;
      white-space: nowrap;
    }

    /* Schedule genres use the exact same neon pill system as the DJ cards. */
    .schedule-genres {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.35rem;
      margin-top: 0.38rem;
    }

    .schedule-genres .dj-genre-pill {
      margin: 0;
    }

    @media (max-width: 720px) {
      .schedule-genres {
        gap: 0.28rem;
      }

      .schedule-genres .dj-genre-pill {
        font-size: 0.62rem;
        padding: 0.16rem 0.42rem;
      }
    }

    .schedule-row > div:nth-child(2) {
      color: #ffffff;
      font-weight: 700;
    }

    .schedule-row > div:nth-child(3) {
      color: #ffffff;
      font-weight: 700;
    }

    .schedule-row > div:nth-child(4) {
      color: #e0e0ff;
    }

    .schedule-header {
      padding: 0;
      border-bottom: 1px solid rgba(129, 140, 248, 0.55);
      color: #ffffff;
      font-weight: 800;
      background: rgba(129, 140, 248, 0.10);
    }

    .schedule-header > div {
      padding: 0.72rem 0.75rem;
      border-right: 1px solid rgba(129, 140, 248, 0.42);
    }

    .schedule-header > div:last-child {
      border-right: 0;
    }

    .schedule-header > div {
      color: #ffffff !important;
      font-weight: 800 !important;
    }


    @media (max-width: 720px) {
      .schedule-table {
        -webkit-overflow-scrolling: touch;
      }

      .schedule-row {
        min-width: 720px;
        grid-template-columns: 1fr 0.95fr 1.15fr 2fr;
        font-size: 0.72rem;
      }
    }

    /* ACTIVE SCHEDULE ROW — bright white station-style outline */
    .schedule-row.schedule-active {
      position: relative;
      z-index: 2;
      border-bottom-color: transparent;
      box-shadow:
        0 0 5px rgba(255,255,255,0.95),
        0 0 12px rgba(255,255,255,0.75),
        0 0 24px rgba(255,255,255,0.45);
    }

    .schedule-row.schedule-active::after {
      content: "";
      position: absolute;
      inset: 0;
      border: 2px solid #ffffff;
      border-radius: 3px;
      pointer-events: none;
      box-shadow:
        0 0 7px rgba(255,255,255,0.95),
        0 0 16px rgba(255,255,255,0.7);
      animation: scheduleActiveGlow 2.8s ease-in-out infinite;
    }

    @keyframes scheduleActiveGlow {
      0%, 100% {
        opacity: 0.82;
      }
      50% {
        opacity: 1;
      }
    }

    .schedule-row.schedule-active > div {
      border-color: rgba(255,255,255,0.28);
    }

    .events-list {

      text-align: left;
      margin-top: 1rem;
      padding-top: 0.5rem;
      border-top: 1px solid rgba(129, 140, 248, 0.15);

    .event-item {
      margin: 1.25rem 0;
      border-left: 3px solid #4338ca;
      padding-left: 1rem;
    }

    .event-item h4 {
      margin: 0;
      font-size: 1rem;

      text-shadow: 0 0 3px rgba(255, 0, 102, 0.5);

    .event-item p {

    .video-container {

      padding-bottom: 56.25%;

    .neon-embed-frame {

      border-radius: 16px;

      border: 1px solid rgba(129,140,248,0.7);
      box-shadow:
        0 0 12px rgba(129,140,248,0.45),
        0 0 24px rgba(255,0,102,0.35);

    .neon-embed-frame .tiktok-embed {
      margin: 0 auto !important;

    /* TOOLS */

      text-align: left;
    }

      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }

    .tools-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 0 8px rgba(255, 0, 102, 0.65);
    }

    .tools-subtitle {
      margin-top: 0.25rem;
      color: #c7c7ff;
      font-size: 0.85rem;
    }

    .tools-actions {
      display: flex;
      gap: 0.7rem;
      flex-wrap: wrap;
      margin: 1rem 0;
    }

      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      padding: 0.55rem 0.95rem;

      background: linear-gradient(135deg, #ff0066, #4338ca);
      border: 1px solid rgba(255,255,255,0.25);

      cursor: pointer;
      box-shadow: 0 0 10px rgba(255,0,102,0.35);

    .tool-button.secondary {

      border-color: rgba(129,140,248,0.6);

    .tool-input-row input {
      width: 100%;
      padding: 0.65rem 0.8rem;

    .tool-input-row input:focus {
      border-color: #ff0066;

    .scanner-note {

    .scanner-score {
      font-size: 0.78rem;

    .scanner-verdict {
      margin-top: 0.45rem;

    }

    .scanner-reasons {

      function normalizeTikTokHandle(input) {
        const s = String(input || "").trim();
        if (!s) return "";

        let m = s.match(/tiktok\.com\/@([A-Za-z0-9._]+)/i);
        if (m && m[1]) return m[1];

        m = s.match(/^@?([A-Za-z0-9._]{2,24})$/);
        return m && m[1] ? m[1] : "";
      }

      function scanAccountSignals(account) {
        const handle = normalizeTikTokHandle(
          account.username ||
          account.unique_id ||
          account.handle ||
          account
        );

        let score = 8;
        const reasons = [];

        if (!handle) {
          return {
            handle: "",
            score: 30,
            verdict: "Medium",
            level: "medium",
            reasons: ["Could not extract a TikTok username."]
          };
        }

        if (/\d{5,}$/.test(handle)) {
          score += 28;
          reasons.push("Username ends with a large block of digits.");
        } else if (/\d{4}$/.test(handle)) {
          score += 18;
          reasons.push("Username ends with four digits.");
        }

        const separators = (handle.match(/[._]/g) || []).length;
        if (separators >= 3) {
          score += 10;
          reasons.push("Username contains many separators.");
        }

        if (handle.length <= 4) {
          score += 10;
          reasons.push("Very short username.");
        }

        if (/^(user|account|official|real|dj)\d+/i.test(handle)) {
          score += 12;
          reasons.push("Generic/generated-looking username pattern.");
        }

        if (/(free|promo|airdrop|crypto|giveaway|cash|adult|sex|dm|whatsapp|telegram)/i.test(handle)) {
          score += 25;
          reasons.push("Username contains a common spam/scam keyword.");
        }

        // Use API data when it is available.
        const followers = Number(
          account.followers ??
          account.follower_count ??
          account.followerCount
        );

        const following = Number(
          account.following ??
          account.following_count ??
          account.followingCount
        );

        const likes = Number(
          account.likes ??
          account.like_count ??
          account.likeCount
        );

        const videos = Number(
          account.videos ??
          account.video_count ??
          account.videoCount
        );

        if (Number.isFinite(followers) && Number.isFinite(following)) {
          if (following >= 5000 && followers <= 200) {
            score += 22;
            reasons.push("Very high following count with very few followers.");
          } else if (following >= 2000 && followers <= 50) {
            score += 25;
            reasons.push("Extreme following/follower imbalance.");
          }

          if (following > 500 && followers > 0 && followers / following < 0.02) {
            score += 12;
            reasons.push("Extremely low follower/following ratio.");
          }
        }

        if (Number.isFinite(videos)) {
          if (videos === 0) {
            score += 16;
            reasons.push("No public videos.");
          } else if (videos <= 2) {
            score += 8;
            reasons.push("Very small public content footprint.");
          }
        }

        if (Number.isFinite(likes) && likes === 0) {
          score += 6;
          reasons.push("No visible likes/activity reported.");
        }

        // A lack of API stats is deliberately NOT treated as proof of a bot.
        if (reasons.length === 0) {
          reasons.push("No strong bot-like signals found from the available data.");
        }

        score = Math.max(0, Math.min(100, score));

        let verdict = "Low";
        let level = "low";

        if (score >= 65) {
          verdict = "High";
          level = "high";
        } else if (score >= 35) {
          verdict = "Medium";
          level = "medium";
        }

        return {
          handle,
          score,
          verdict,
          level,
          reasons
        };
      }

          const name = item.genre.replace(/^.*---/, "");
          const percent = Math.round(item.confidence * 100);
          const barWidth = Math.max(
            4,
            Math.min(100, (item.confidence / maxConfidence) * 100)
          );

          row.innerHTML =
            '<span class="live-genre-detected-name" title="' +
              escapeAttr(name) + '">' +
              escapeHtml(name) +
            '</span>' +
            '<span class="live-genre-detected-bar" aria-hidden="true">' +
              '<span style="width:' + barWidth.toFixed(1) + '%;"></span>' +
            '</span>' +
            '<span class="live-genre-detected-confidence">' +
              percent + '%' +
            '</span>';

          liveGenresDetectedList.appendChild(row);
        });

        // Genre data has successfully refreshed. Restart the visible
        // countdown from 30 seconds at the moment the new result is rendered.
        resetLiveGenreRefreshCountdown();
      }

      function getDJGenres(dj) {
        if (!window.RadioRRRGenreDetection) return [];

        const bio = String(
          dj && (dj.bio || dj.biography || dj.profile_bio || dj.about || "")
        );

        // The API's curated genre can be broad; profile text supplies the
        // more specific taxonomy match when one is present.
        return window.RadioRRRGenreDetection.normalizeGenres(
          [dj && dj.genre, dj && dj.genre_keywords, dj && dj.genres],
          bio
        );
      }

      function getStoredDJGenres(dj) {
        if (!window.RadioRRRGenreDetection) return [];

        return filterMusicGenres(window.RadioRRRGenreDetection.normalizeGenres(
          [dj && dj.genre, dj && dj.genre_keywords, dj && dj.genres],
          ""
        ));
      }

      const GENRE_NEON_CLASS_MAP = [
        { match: /\bdeep\s+house\b/i, className: "genre-neon-electric-purple" },
        { match: /\bhouse\b/i, className: "genre-neon-hot-pink" },
        { match: /\btechno\b/i, className: "genre-neon-electric-blue" },
        { match: /\bpsy\s*trance\b|\bpsytrance\b/i, className: "genre-neon-acid-green" },
        { match: /\btrance\b/i, className: "genre-neon-cyan" },
        { match: /\bdrum\s*(?:&|and|\+)?\s*bass\b|\bdnb\b|\bd&b\b/i, className: "genre-neon-orange" },
        { match: /\bdubstep\b/i, className: "genre-neon-blue" },
        { match: /\bhardstyle\b/i, className: "genre-neon-red" },
        { match: /\bdisco\b/i, className: "genre-neon-violet" },
        { match: /\bfunk\b/i, className: "genre-neon-yellow" },
        { match: /\bchill\b|\bdowntempo\b/i, className: "genre-neon-aqua" },
        { match: /\bbreaks?\b|\bbreakbeat\b/i, className: "genre-neon-orange" },
        { match: /\buk\s+garage\b|\bgarage\b/i, className: "genre-neon-lime" },
        { match: /\bedm\b/i, className: "genre-neon-blue-purple" },
        { match: /\bpop\b/i, className: "genre-neon-magenta" }
      ];

      function getGenreNeonClass(genre) {
        const text = String(genre || "");
        const mapped = GENRE_NEON_CLASS_MAP.find(item => item.match.test(text));
        return mapped ? mapped.className : "genre-neon-cyan";
      }

      function getGenrePillHtml(genre) {
        return '<span class="dj-genre-pill ' + getGenreNeonClass(genre) + '">' +
          escapeHtml(String(genre)) +
          '</span>';
      }

      function isMusicGenre(value) {
        const text = String(value || "").trim();
        return !!text && !/^non[\s_-]*music$/i.test(text);
      }

      function filterMusicGenres(genres) {
        return (Array.isArray(genres) ? genres : []).filter(isMusicGenre);
      }

      function getLiveAIGenres(dj) {
        const raw = Array.isArray(dj && dj.ai_genres)
          ? dj.ai_genres
          : [];

        const genres = [];
        const seen = new Set();

        raw.forEach(item => {
          const rawGenre =
            item && typeof item === "object"
              ? item.genre
              : item;

          const value = String(rawGenre || "").trim();
          if (!value) return;

          // AI labels are stored as Parent---Child.
          // The frontend displays only the child genre.
          const parts = value.split("---");
          const displayGenre =
            parts.length > 1
              ? parts.slice(1).join("---").trim()
              : value;

          if (!displayGenre || !isMusicGenre(displayGenre)) return;

          const key = displayGenre.toLowerCase();
          if (seen.has(key)) return;

          seen.add(key);
          genres.push(displayGenre);
        });

        return genres;
      }

      let learnedDJGenreRequestId = 0;
      const learnedDJGenreCache = new Map();
      const LEARNED_DJ_GENRE_CACHE_TTL = 2 * 60 * 1000;

      function parseLearnedDJGenres(profile) {
        const learned = Array.isArray(profile && profile.genres)
          ? profile.genres
          : [];

        const genres = [];

        learned.forEach(item => {
          const rawGenre =
            item && typeof item === "object"
              ? item.genre
              : item;

          const value = String(rawGenre || "").trim();
          if (!value) return;

          const displayGenre = value.split("---").pop().trim();
          if (!displayGenre || !isMusicGenre(displayGenre)) return;

          if (!genres.some(
            existing => existing.toLowerCase() === displayGenre.toLowerCase()
          )) {
            genres.push(displayGenre);
          }
        });

        return genres;
      }

      async function getLearnedDJGenres(dj) {
        const username = getDJUsername(dj);
        if (!username) return [];

        const cacheKey = username.toLowerCase();
        const cached = learnedDJGenreCache.get(cacheKey);
        const now = Date.now();

        if (cached && (now - cached.timestamp) < LEARNED_DJ_GENRE_CACHE_TTL) {
          return cached.genres.slice();
        }

        try {
          const response = await fetch(
            getFreshUrl(
              "https://api.radiorrr.com/api/ai-genre/profile?username=" +
              encodeURIComponent(username)
            ),
            {
              cache: "no-store",
              headers: {
                "Cache-Control": "no-cache",
                "Pragma": "no-cache"
              }
            }
          );

          if (!response.ok) {
            throw new Error("API returned " + response.status);
          }

          const genres = parseLearnedDJGenres(await response.json());
          learnedDJGenreCache.set(cacheKey, {
            timestamp: now,
            genres
          });

          return genres.slice();
        } catch (error) {
          console.warn("Could not load learned DJ genre profile:", error);

          // Keep the last known learned profile if a temporary request fails.
          return cached ? cached.genres.slice() : [];
        }
      }

      async function updateLiveDjGenres(dj) {
        if (!randomLiveDjGenres) return;

        const requestId = ++learnedDJGenreRequestId;

        // The CURRENT DJ card shows the learned/rolling DJ profile.
        // This is deliberately separate from LIVE GENRES DETECTED, which
        // continues to show the latest live audio classification.
        let genres = await getLearnedDJGenres(dj);

        // Ignore a slower response for an older DJ selection.
        if (requestId !== learnedDJGenreRequestId) return;

        // Only use the stored/profile genre as a fallback if the DJ has never
        // accumulated a learned AI profile. Do not live-analyse this card.
        if (!genres.length) {
          genres = getStoredDJGenres(dj);
        }

        randomLiveDjGenres.innerHTML = "";

        if (randomLiveDjGenresField) {
          randomLiveDjGenresField.hidden = !genres.length;
        }

        genres.slice(0, 5).forEach(genre => {
          const tag = document.createElement("span");
          tag.className = "random-live-genre " + getGenreNeonClass(genre);
          tag.textContent = genre;
          randomLiveDjGenres.appendChild(tag);
        });
      }

      function updateLiveDjProfile(dj) {
        if (!dj) {
          const currentDjCard = document.querySelector("#randomLiveDj .current-dj-card");
          if (currentDjCard) currentDjCard.style.backgroundImage = "";
          if (randomLiveDjAvatar) {

          if (randomLiveDjBio) randomLiveDjBio.textContent = "";
          if (randomLiveDjMeta) randomLiveDjMeta.textContent = "";
          return;
        }

        const profilePic =
          dj.profile_pic ||
          dj.profile_picture ||

          dj.photo ||

        const currentDjCard = document.querySelector("#randomLiveDj .current-dj-card");
        if (currentDjCard) {

        if (randomLiveDjAvatar) {

          if (profilePic) {

            randomLiveDjAvatar.appendChild(image);
          }
        }

        const bio = String(
          dj.bio ||
          dj.biography ||

          dj.about ||

        ).trim();

        if (randomLiveDjBio) randomLiveDjBio.textContent = bio;
        if (randomLiveDjBioField) randomLiveDjBioField.hidden = !bio;

        const username = getDJUsername(dj);
        const title = dj.title || dj.room_title || dj.description || "";
        const viewers = dj.viewers ?? dj.viewer_count ?? dj.viewerCount;
        const metadata = [
          username ? "@" + username : "",
          title ? String(title).trim() : "",
          viewers !== undefined && viewers !== null && Number(viewers) > 0
            ? String(viewers) + " watching"
            : ""
        ].filter(Boolean).join(" · ");

        if (randomLiveDjMeta) randomLiveDjMeta.textContent = metadata;
        if (randomLiveDjMetaField) randomLiveDjMetaField.hidden = !metadata;
      }

      function showLiveDjPlayer(dj) {
        if (!liveDjVideo || !randomLiveDj) return;

        const username = getDJUsername(dj);
        const name = dj.name || dj.username || dj.display_name || "LIVE DJ";
        const liveUrl = getDJLiveUrl(dj);
        // The station default uses the shared Router relay. A listener who
        // manually selects a DJ gets that DJ's existing per-DJ manual relay
        // in this browser only. Never call /api/live/switch for a listener
        // selection because that changes the shared station relay.
        const isManualSelection =
          Boolean(manualFeaturedDJIdentity) &&
          getDJIdentity(dj) === manualFeaturedDJIdentity;
        const streamUrl = isManualSelection && username
          ? RADIO_ROUTER_STREAM_URL + "?dj=" + encodeURIComponent(username)
          : RADIO_ROUTER_STREAM_URL;

        activeLiveUsername = username;
        activeLiveStreamKey = (isManualSelection ? "manual:" : "default:") + (username || String(name));
        activeLiveStreamUrl = streamUrl;
        liveDjVideo.autoplay = true;
        liveDjVideo.playsInline = true;
        liveDjVideo.muted = !userRequestedAudio;
        updateLiveDjMuteButton();
        if (liveDjBackground) {
          liveDjBackground.autoplay = true;
          liveDjBackground.playsInline = true;
          liveDjBackground.muted = true;
        }
        randomLiveDjName.textContent = "🎧 " + String(name);
        updateMainDJMatchScore(dj);
        updateLiveDjGenres(dj);
        updateLiveDjProfile(dj);
        randomLiveDj.style.display = "block";

        // Chrome/Edge/Firefox need hls.js for HLS (.m3u8).
        // Safari can use native HLS directly.
        if (window.Hls && Hls.isSupported()) {
          if (window.radioRrrHls) {
            window.radioRrrHls.destroy();
            window.radioRrrHls = null;
          }

          if (window.radioRrrHlsBackground) {
            window.radioRrrHlsBackground.destroy();
            window.radioRrrHlsBackground = null;
          }

          const hls = new Hls({
            enableWorker: true,

            // Stability-first settings for the TikTok → FFmpeg → HLS relay.
            // Running too close to the live edge was causing bufferStalledError.
            lowLatencyMode: false,
            liveSyncDurationCount: 5,
            maxLiveSyncPlaybackRate: 1.1,
            maxBufferLength: 30,
            maxMaxBufferLength: 60,
            backBufferLength: 30,

            manifestLoadingTimeOut: 10000,
            manifestLoadingMaxRetry: 3,
            manifestLoadingRetryDelay: 1000
          });

          window.radioRrrHls = hls;
          hls.loadSource(getFreshUrl(streamUrl));
          hls.attachMedia(liveDjVideo);

          hls.on(Hls.Events.MANIFEST_PARSED, function () {
            resumeLivePlayback();
          });

          // Desktop keeps the blurred background copy for the existing
          // visual treatment. Mobile deliberately uses ONE HLS connection.
          if (liveDjBackground && !isMobileLivePlayer) {
            const bgHls = new Hls({
              enableWorker: true,
              lowLatencyMode: false,
              liveSyncDurationCount: 5,
              maxLiveSyncPlaybackRate: 1.1,
              maxBufferLength: 30,
              maxMaxBufferLength: 60,
              backBufferLength: 30,
              manifestLoadingTimeOut: 10000,
              manifestLoadingMaxRetry: 3,
              manifestLoadingRetryDelay: 1000
            });

            window.radioRrrHlsBackground = bgHls;
            bgHls.loadSource(getFreshUrl(streamUrl));
            bgHls.attachMedia(liveDjBackground);

            bgHls.on(Hls.Events.MANIFEST_PARSED, function () {
              liveDjBackground.play().catch(() => {});
            });

            bgHls.on(Hls.Events.ERROR, function (event, data) {
              console.warn("Radio RRR background HLS error:", data);

              if (handleManualDJStreamFailure(data)) return;

              if (data.details === Hls.ErrorDetails.BUFFER_STALLED_ERROR) {
                try {
                  bgHls.startLoad();
                } catch (e) {}
                return;
              }

              if (data.fatal) {
                if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                  bgHls.startLoad();
                } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                  bgHls.recoverMediaError();
                }
              }
            });
          }

          hls.on(Hls.Events.ERROR, function (event, data) {
            console.warn("Radio RRR HLS error:", data);

            if (handleManualDJStreamFailure(data)) return;

            // A temporary buffer stall is recoverable. Keep the player alive
            // and let hls.js load more media instead of treating it as a stop.
            if (data.details === Hls.ErrorDetails.BUFFER_STALLED_ERROR) {
              try {
                hls.startLoad();
              } catch (e) {}
              return;
            }

            if (data.fatal) {
              if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                hls.startLoad();
              } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                hls.recoverMediaError();
              }
            }
          });

        } else if (liveDjVideo.canPlayType("application/vnd.apple.mpegurl")) {
          liveDjVideo.src = getFreshUrl(streamUrl);
          liveDjVideo.addEventListener("loadedmetadata", resumeLivePlayback, { once: true });
          liveDjVideo.addEventListener("canplay", resumeLivePlayback, { once: true });
          resumeLivePlayback();

          // Native HLS is common on Safari/iOS. Do not create a second
          // native HLS stream on mobile; the main video is the only decoder.
          if (liveDjBackground && !isMobileLivePlayer) {
            liveDjBackground.src = getFreshUrl(streamUrl);
            liveDjBackground.addEventListener("loadedmetadata", function () {
              liveDjBackground.play().catch(() => {});
            }, { once: true });
            liveDjBackground.play().catch(() => {});
          }
        } else {
          if (liveDjPlaceholder) {
            liveDjPlaceholder.querySelector("span").textContent =
              "This browser does not support HLS playback.";
          }
        }

        const player = liveDjVideo.closest(".radio-router-player");
        if (player) player.classList.add("live-active");

        if (liveDjPlaceholder) {
          liveDjPlaceholder.querySelector("span").textContent =
            "LIVE DJ stream is connecting…";
        }
      }

      function showRadioFallback() {
        activeLiveUsername = "";
        activeLiveStreamKey = "";
        activeLiveStreamUrl = "";

        if (nativePlaybackRecoveryTimer) {
          window.clearTimeout(nativePlaybackRecoveryTimer);
          nativePlaybackRecoveryTimer = null;
        }

        if (window.radioRrrHls) {
          window.radioRrrHls.destroy();

        }

        if (window.radioRrrHlsBackground) {
          window.radioRrrHlsBackground.destroy();
          window.radioRrrHlsBackground = null;
        }

        if (liveDjVideo) {
          liveDjVideo.pause();
          liveDjVideo.removeAttribute("src");
          liveDjVideo.load();
        }

        if (liveDjBackground) {
          liveDjBackground.pause();
          liveDjBackground.removeAttribute("src");
          liveDjBackground.load();
        }

        if (randomLiveDj) {

        }
