<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Radio RRR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #050710;
      color: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .wrapper {
      max-width: 600px;
      width: 100%;
      padding: 2.5rem 1.75rem;
      border-radius: 18px;
      background: radial-gradient(circle at top, #4338ca 0, #050710 55%);
      box-shadow: 0 18px 40px rgba(0,0,0,0.55);
      text-align: center;
    }
    .tagline {
      font-size: 0.95rem;
      color: #c7c7ff;
      margin: 0.5rem 0 1.25rem;
    }
    .visualizer {
      width: 100%;
      height: 260px;
      border-radius: 14px;
      overflow: hidden;
      background: #050710;
      margin-bottom: 1.5rem;
    }
    #viz { width: 100%; height: 100%; display: block; }
    .channel {
      padding: 1.2rem 1.4rem;
      border-radius: 16px;
      background: rgba(10,10,30,0.85);
      border: 1px solid rgba(129,140,248,0.5);
      margin-bottom: 1.75rem;
      text-align: left;
    }
    .channel span { font-weight: 600; font-size: 1rem; }
    .channel small { font-size: 0.8rem; opacity: 0.75; }
    audio { width: 100%; margin-top: 0.8rem; }
    .status { display:none; font-size: 0.8rem; margin-top: 0.4rem; opacity: 0.8; }
    .kick {
      margin-top:0.6rem; padding:0.45rem 0.7rem;
      border-radius:10px; border:1px solid rgba(129,140,248,0.6);
      background:#0b1020; color:#c7c7ff;
      cursor:pointer; font-size:0.85rem;
    }
    .video-container {
      position: relative;
      width: 100%; padding-bottom: 56.25%;
      margin-top: 0.8rem;
    }
    .video-container iframe {
      position: absolute; width: 100%; height: 100%; border: 0;
      top: 0; left: 0; border-radius: 12px;
    }
    .links { margin-top: 0.75rem; font-size: 0.85rem; text-align:center; }
    .links a { color: #a5b4fc; text-decoration: none; margin: 0 0.4rem; }
    .footnote { margin-top: 1.5rem; font-size: 0.7rem; opacity: 0.55; }
  </style>
</head>

<body>
  <main class="wrapper">

    <img src="logo.png" alt="Radio RRR Logo"
         style="width: 300px; max-width: 90%; margin: 0 auto 10px; display: block;">

    <p class="tagline">Streaming Electro · Synth · 80s · Chill</p>

    <!-- RADIO STREAM + VISUALIZER -->
    <div class="channel">
      <span id="streamTitle">RADIO RRR Live</span><br />
      <small id="streamSubtitle">No sound? Press play >></small>

      <div class="visualizer">
        <canvas id="viz"></canvas>
      </div>

      <!-- Stream URL: swap this for any HTTPS station you like -->
      <audio id="liveStream" controls>
        <source src="https://ice2.somafm.com/defcon-128-mp3" type="audio/mpeg" />
      </audio>

      <button id="kickPlay" class="kick">Play</button>
      <div id="status" class="status"></div>
    </div>

    <!-- TIKTOK -->
    <div class="channel">
      <span>Latest on TikTok</span><br />
      <small>@josh.u.rrr · newest shorts</small>

      <blockquote class="tiktok-embed"
        cite="https://www.tiktok.com/@josh.u.rrr"
        data-unique-id="josh.u.rrr"
        data-embed-type="creator"
        style="max-width:100%; min-width:280px; margin-top:0.8rem;">
        <section>
          <a target="_blank" href="https://www.tiktok.com/@josh.u.rrr">@josh.u.rrr</a>
        </section>
      </blockquote>
    </div>

    <!-- YOUTUBE LIKES -->
    <div class="channel">
      <span>YouTube Likes</span><br />
      <small>Latest videos we liked</small>

      <div class="video-container">
        <iframe
          src="https://www.youtube.com/embed/videoseries?list=PLli1uTuS0FH7xR1QBnIvY3V9btomaSpTv"
          allowfullscreen
          loading="lazy">
        </iframe>
      </div>
    </div>

    <div class="links">
      <a href="https://www.instagram.com/radio.rrr/" target="_blank">Instagram</a> ·
      <a href="https://www.tiktok.com/@josh.u.rrr" target="_blank">TikTok</a> ·
      <a href="https://www.youtube.com/@RADIO_RRR" target="_blank">YouTube</a> ·
      <a href="https://github.com/joshurrr" target="_blank">GitHub</a>
    </div>

    <p class="footnote">Streaming 24/7</p>
  </main>

  <script async src="https://www.tiktok.com/embed.js"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const audio = document.getElementById("liveStream");
  const statusEl = document.getElementById("status");
  const kick = document.getElementById("kickPlay");
  const canvas = document.getElementById("viz");
  const ctx = canvas.getContext("2d");

  function setStatus(msg) {
    statusEl.style.display = "block";
    statusEl.textContent = "Status: " + msg;
  }

  // Resize canvas for HiDPI
  function resize() {
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.clientWidth;
    const h = canvas.clientHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener("resize", resize);

  let startTime = performance.now();
  let isPlaying = false;

  function drawFrame() {
    const t = (performance.now() - startTime) / 1000;
    const w = canvas.clientWidth;
    const h = canvas.clientHeight;

    // Animation speed changes depending on play state
    const speed = isPlaying ? 1.0 : 0.4;
    const tt = t * speed;

    // Fake "bass" pulses – look musical, not actually from audio
    const bass = (Math.sin(tt * 2.2) + 1) / 2;
    const mid  = (Math.sin(tt * 1.3 + 1.2) + 1) / 2;
    const treb = (Math.sin(tt * 3.1 + 0.8) + 1) / 2;
    const energy = (bass * 1.4 + mid + treb * 0.8) / 3.2;

    const horizon = h * 0.55;
    const cx = w / 2;

    // Sky gradient
    const sky = ctx.createLinearGradient(0, 0, 0, horizon);
    sky.addColorStop(0, "#090018");
    sky.addColorStop(0.35, "#3a0060");
    sky.addColorStop(0.7, "#ff0066");
    sky.addColorStop(1, "#ff6600");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, w, horizon);

    // Stars
    const starCount = 90;
    ctx.fillStyle = "rgba(255,255,255,0.8)";
    for (let i = 0; i < starCount; i++) {
      const sx = (i * 73 + (tt * 25)) % w;
      const sy = (i * 53) % (h * 0.4);
      const size = (i % 7 === 0 ? 1.4 : 0.7);
      ctx.fillRect(sx, sy, size, size);
    }

    // Sun
    const sunRadius = Math.min(w, h) * 0.16;
    const sunY = horizon - sunRadius * 0.25 - bass * 10;
    const sunGlow = 0.15 + energy * 0.25;

    const sunGrad = ctx.createRadialGradient(cx, sunY, sunRadius * 0.1, cx, sunY, sunRadius);
    sunGrad.addColorStop(0, "rgba(255,255,200,0.98)");
    sunGrad.addColorStop(0.4, "rgba(255,180,80,0.96)");
    sunGrad.addColorStop(1, "rgba(255,0,80,0)");
    ctx.fillStyle = sunGrad;
    ctx.beginPath();
    ctx.arc(cx, sunY, sunRadius * (0.9 + sunGlow), 0, Math.PI * 2);
    ctx.fill();

    // Sun scanlines
    ctx.save();
    ctx.globalCompositeOperation = "source-atop";
    ctx.fillStyle = "rgba(10,5,20,0.7)";
    const stripeH = sunRadius * 0.14;
    for (let y = -sunRadius; y < sunRadius; y += stripeH * 1.7) {
      ctx.fillRect(cx - sunRadius, sunY + y, sunRadius * 2, stripeH);
    }
    ctx.restore();

    // Water background
    const waterGrad = ctx.createLinearGradient(0, horizon, 0, h);
    waterGrad.addColorStop(0, "#150020");
    waterGrad.addColorStop(0.5, "#05071a");
    waterGrad.addColorStop(1, "#02030a");
    ctx.fillStyle = waterGrad;
    ctx.fillRect(0, horizon, w, h);

    // Sun reflection
    const reflectGrad = ctx.createLinearGradient(cx, horizon, cx, h);
    reflectGrad.addColorStop(0, "rgba(255,120,160,0.7)");
    reflectGrad.addColorStop(0.4, "rgba(255,80,200,0.35)");
    reflectGrad.addColorStop(1, "rgba(255,0,150,0)");
    ctx.fillStyle = reflectGrad;
    ctx.globalAlpha = 0.55 + energy * 0.25;
    const reflectWidth = sunRadius * 1.4 + bass * 24;
    ctx.beginPath();
    ctx.moveTo(cx - reflectWidth, horizon);
    ctx.quadraticCurveTo(cx, h * 0.8 + bass * 18, cx + reflectWidth, horizon);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 1;

    // Waves
    const waveLines = 6;
    const baseAmp = h * 0.04;
    const baseFreq = 2.2;
    for (let j = 0; j < waveLines; j++) {
      const progress = j / (waveLines - 1 || 1);
      const yBase = horizon + progress * (h - horizon);
      const amp = baseAmp * (0.4 + bass * 1.6) * (1 + progress * 0.7);
      const speedWave = 1.2 + progress * 0.8;
      const phase = tt * speedWave * (1 + bass * 0.5) + j * 0.7;

      const lineGrad = ctx.createLinearGradient(0, yBase - amp, 0, yBase + amp);
      lineGrad.addColorStop(0, `rgba(0, 240, 255, ${0.3 + 0.5 * (1-progress)})`);
      lineGrad.addColorStop(1, `rgba(255, 0, 150, ${0.2 + 0.4 * progress})`);
      ctx.strokeStyle = lineGrad;
      ctx.lineWidth = 1 + (1 - progress) * 2 + bass * 2;

      ctx.beginPath();
      const steps = 90;
      for (let i = 0; i <= steps; i++) {
        const x = (i / steps) * w;
        const y =
          yBase +
          Math.sin((i / steps) * baseFreq * Math.PI * 2 + phase) * amp *
          (0.7 + mid * 0.6);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }

    // Scanline overlay
    ctx.save();
    ctx.globalAlpha = 0.13;
    ctx.fillStyle = "rgba(0,0,0,1)";
    const gap = 3, off = (tt * 35) % gap;
    for (let y = off; y < h; y += gap) {
      ctx.fillRect(0, y, w, 1);
    }
    ctx.restore();

    requestAnimationFrame(drawFrame);
  }

  requestAnimationFrame(drawFrame);

  // Play button + audio handlers
  kick.addEventListener("click", () => {
    if (audio.paused) {
      const p = audio.play();
      if (p && p.then) {
        p.then(() => {
          isPlaying = true;
          setStatus("playing");
        }).catch(err => {
          console.warn("play() rejected", err);
          setStatus("tap the white player control above to start");
        });
      }
    } else {
      audio.pause();
      isPlaying = false;
      setStatus("paused");
    }
  });

  audio.addEventListener("play", () => {
    isPlaying = true;
    setStatus("playing");
  });

  audio.addEventListener("pause", () => {
    isPlaying = false;
    setStatus("paused");
  });

  audio.addEventListener("error", () => {
    setStatus("audio error (check stream URL)");
  });
});
</script>

</body>
</html>
