<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Radio RRR</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
/* KEEP YOUR EXISTING CSS EXACTLY AS IS */
</style>
</head>

<body>
<main class="wrapper">

<!-- KEEP YOUR EXISTING HTML EXACTLY AS IS -->

</main>

<script>
document.addEventListener("DOMContentLoaded", function () {

const audio = document.getElementById("liveStream");
const canvas = document.getElementById("viz");
const ctx = canvas.getContext("2d");

let audioCtx, analyser, dataArray;
let analyserReady = false;

if (audio) audio.crossOrigin = "anonymous";

function initAudioAnalyser() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AC();
    const source = audioCtx.createMediaElementSource(audio);

    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 2048;
    analyser.smoothingTimeConstant = 0.85;

    dataArray = new Uint8Array(analyser.frequencyBinCount);

    source.connect(analyser);
    analyser.connect(audioCtx.destination);

    analyserReady = true;
  } catch (e) {
    analyserReady = false;
  }
}

function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = canvas.clientWidth * dpr;
  canvas.height = canvas.clientHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
window.addEventListener("resize", resize);

// PARTICLES
const particles = [];
const maxParticles = 100;

class Particle {
  constructor(x, y, vx, vy, hue, size) {
    this.x = x; this.y = y;
    this.vx = vx; this.vy = vy;
    this.hue = hue;
    this.size = size;
    this.alpha = 1;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vy += 0.05;
    this.alpha -= 0.015;
  }
  draw() {
    ctx.globalAlpha = this.alpha;
    const g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size);
    g.addColorStop(0, `hsla(${this.hue},100%,70%,1)`);
    g.addColorStop(1, `hsla(${this.hue},100%,50%,0)`);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function drawFrame() {
  requestAnimationFrame(drawFrame);

  const t = performance.now() / 1000;
  const w = canvas.clientWidth;
  const h = canvas.clientHeight;
  const cx = w / 2;
  const cy = h / 2;

  let bass = 0.3, mid = 0.2, treble = 0.2;
  let spectrum = null;

  if (analyserReady) {
    analyser.getByteFrequencyData(dataArray);
    spectrum = dataArray;

    let sum = 0;
    for (let i = 0; i < 20; i++) sum += dataArray[i];
    bass = sum / (20 * 255);
  } else {
    bass += Math.sin(t * 3) * 0.1;
  }

  const energy = bass;
  const baseHue = (t * 30 + energy * 200) % 360;

  // CLEAR
  ctx.fillStyle = "rgba(0,0,0,0.3)";
  ctx.fillRect(0, 0, w, h);

  // SHAKE
  const shake = bass * 5;
  ctx.save();
  ctx.translate(
    (Math.random() - 0.5) * shake,
    (Math.random() - 0.5) * shake
  );

  // GRID FLOOR
  ctx.strokeStyle = "rgba(255,0,102,0.15)";
  for (let i = 0; i < h; i += 40) {
    const y = h - i;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(w, y);
    ctx.stroke();
  }
  for (let i = -w; i < w * 2; i += 40) {
    ctx.beginPath();
    ctx.moveTo(i + (t * 60 % 40), h);
    ctx.lineTo(w / 2, h * 0.5);
    ctx.stroke();
  }

  // RINGS
  for (let i = 0; i < 4; i++) {
    const radius = 100 + i * 40 + bass * 60;
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.strokeStyle = `hsla(${baseHue + i * 40},100%,60%,0.4)`;
    ctx.lineWidth = 2 + bass * 3;
    ctx.stroke();
  }

  // WAVEFORM RING
  if (spectrum) {
    ctx.beginPath();
    const radius = 120;
    for (let i = 0; i < spectrum.length; i += 10) {
      const angle = (i / spectrum.length) * Math.PI * 2;
      const value = spectrum[i] / 255;
      const r = radius + value * 50;
      const x = cx + Math.cos(angle) * r;
      const y = cy + Math.sin(angle) * r;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.strokeStyle = "rgba(255,255,255,0.25)";
    ctx.stroke();
  }

  // PARTICLES
  ctx.filter = "blur(2px)";
  if (bass > 0.4 && Math.random() > 0.6) {
    particles.push(new Particle(cx, cy,
      (Math.random() - 0.5) * 6,
      (Math.random() - 0.5) * 6,
      baseHue,
      4 + bass * 10
    ));
  }

  particles.forEach((p, i) => {
    p.update();
    p.draw();
    if (p.alpha <= 0) particles.splice(i, 1);
  });
  ctx.filter = "none";

  // CENTER ORB
  const orbSize = 20 + bass * 40;
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, orbSize);
  g.addColorStop(0, "#fff");
  g.addColorStop(1, "transparent");
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(cx, cy, orbSize, 0, Math.PI * 2);
  ctx.fill();

  // BASS FLASH
  if (bass > 0.55) {
    ctx.fillStyle = `rgba(255,0,102,${bass * 0.2})`;
    ctx.fillRect(0, 0, w, h);
  }

  ctx.restore();
}

drawFrame();

// INIT AUDIO ON CLICK
document.getElementById("kickPlay")?.addEventListener("click", () => {
  if (!audioCtx) initAudioAnalyser();
  audio.play();
});

});
</script>
</body>
</html>
