<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Radio RRR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #050710;
      color: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .wrapper {
      max-width: 600px;
      width: 100%;
      padding: 2.5rem 1.75rem;
      border-radius: 18px;
      background: radial-gradient(circle at top, #4338ca 0, #050710 55%);
      box-shadow: 0 18px 40px rgba(0,0,0,0.55);
      text-align: center;
    }
    .tagline {
      font-size: 0.95rem;
      color: #c7c7ff;
      margin: 0.5rem 0 1.25rem;
    }
    .visualizer {
      width: 100%;
      height: 260px;
      border-radius: 14px;
      overflow: hidden;
      background: #050710;
      margin-bottom: 1.5rem;
    }
    #viz { width: 100%; height: 100%; display: block; }
    .channel {
      padding: 1.2rem 1.4rem;
      border-radius: 16px;
      background: rgba(10,10,30,0.85);
      border: 1px solid rgba(129,140,248,0.5);
      margin-bottom: 1.75rem;
      text-align: left;
    }
    .channel span { font-weight: 600; font-size: 1rem; }
    .channel small { font-size: 0.8rem; opacity: 0.75; }
    audio { width: 100%; margin-top: 0.8rem; }
    .status { display:none; font-size: 0.8rem; margin-top: 0.4rem; opacity: 0.8; }
    .kick {
      margin-top:0.6rem; padding:0.45rem 0.7rem;
      border-radius:10px; border:1px solid rgba(129,140,248,0.6);
      background:#0b1020; color:#c7c7ff;
      cursor:pointer; font-size:0.85rem;
    }
    .video-container {
      position: relative;
      width: 100%; padding-bottom: 56.25%;
      margin-top: 0.8rem;
    }
    .video-container iframe {
      position: absolute; width: 100%; height: 100%; border: 0;
      top: 0; left: 0; border-radius: 12px;
    }
    .links { margin-top: 0.75rem; font-size: 0.85rem; text-align:center; }
    .links a { color: #a5b4fc; text-decoration: none; margin: 0 0.4rem; }
    .footnote { margin-top: 1.5rem; font-size: 0.7rem; opacity: 0.55; }
  </style>
</head>

<body>
  <main class="wrapper">

    <img src="logo.png" alt="Radio RRR Logo"
         style="width: 300px; max-width: 90%; margin: 0 auto 10px; display: block;">

    <p class="tagline">Streaming Electro · Synth · 80s · Chill</p>

    <!-- RADIO STREAM + VISUALIZER -->
    <div class="channel">
      <span id="streamTitle">RADIO RRR Live</span><br />
      <small id="streamSubtitle">No sound? Press play >></small>

      <div class="visualizer">
        <canvas id="viz"></canvas>
      </div>

      <!-- WORKING TEST STREAM -->
      <audio id="liveStream" controls>
        <source src="https://stream.electroradio.fm/electroradio.mp3" />
      </audio>

      <button id="kickPlay" class="kick">Play</button>
      <div id="status" class="status"></div>
    </div>

    <!-- TIKTOK -->
    <div class="channel">
      <span>Latest on TikTok</span><br />
      <small>@josh.u.rrr · newest shorts</small>

      <blockquote class="tiktok-embed"
        cite="https://www.tiktok.com/@josh.u.rrr"
        data-unique-id="josh.u.rrr"
        data-embed-type="creator"
        style="max-width:100%; min-width:280px; margin-top:0.8rem;">
        <section>
          <a target="_blank" href="https://www.tiktok.com/@josh.u.rrr">@josh.u.rrr</a>
        </section>
      </blockquote>
    </div>

    <!-- YOUTUBE LIKES -->
    <div class="channel">
      <span>YouTube Likes</span><br />
      <small>Latest videos we liked</small>

      <div class="video-container">
        <iframe
          src="https://www.youtube.com/embed/videoseries?list=PLli1uTuS0FH7xR1QBnIvY3V9btomaSpTv"
          allowfullscreen
          loading="lazy">
        </iframe>
      </div>
    </div>

    <div class="links">
      <a href="https://www.instagram.com/radio.rrr/" target="_blank">Instagram</a> ·
      <a href="https://www.tiktok.com/@josh.u.rrr" target="_blank">TikTok</a> ·
      <a href="https://www.youtube.com/@RADIO_RRR" target="_blank">YouTube</a> ·
      <a href="https://github.com/joshurrr" target="_blank">GitHub</a>
    </div>

    <p class="footnote">Streaming 24/7</p>
  </main>

  <script async src="https://www.tiktok.com/embed.js"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const audio = document.getElementById("liveStream");
  const statusEl = document.getElementById("status");
  const kick = document.getElementById("kickPlay");
  const canvas = document.getElementById("viz");
  const ctx = canvas.getContext("2d");

  function setStatus(msg) {
    statusEl.style.display = "block";
    statusEl.textContent = "Status: " + msg;
  }

  // basic resize
  function resize() {
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.clientWidth, h = canvas.clientHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener("resize", resize);

  // simple looping viz background (no analyser yet – keeps things safe)
  function loop() {
    const w = canvas.clientWidth;
    const h = canvas.clientHeight;
    ctx.fillStyle = "#050710";
    ctx.fillRect(0,0,w,h);

    // fake grid so it doesn't look dead if analyser can't read stream
    ctx.strokeStyle = "rgba(0,240,255,0.6)";
    for (let i = 0; i <= 16; i++) {
      const x = (i / 16) * w;
      ctx.beginPath();
      ctx.moveTo(x, h * 0.4);
      ctx.lineTo(x, h);
      ctx.stroke();
    }
    ctx.strokeStyle = "rgba(255,0,180,0.4)";
    for (let r = 0; r < 14; r++) {
      const y = h * 0.4 + (r / 14) * (h * 0.6);
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(w, y);
      ctx.stroke();
    }

    requestAnimationFrame(loop);
  }
  loop();

  // play button
  kick.addEventListener("click", () => {
    if (audio.paused) {
      const p = audio.play();
      if (p && p.then) {
        p.then(() => setStatus("playing"))
         .catch(err => {
           console.warn("play() rejected", err);
           setStatus("tap the white player control above to start");
         });
      }
    } else {
      audio.pause();
      setStatus("paused");
    }
  });

  audio.addEventListener("play", () => setStatus("playing"));
  audio.addEventListener("pause", () => setStatus("paused"));
  audio.addEventListener("error", () => setStatus("audio error (check stream URL / console)"));
});
</script>

</body>
</html>
