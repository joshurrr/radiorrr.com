<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Radio RRR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #050710;
      color: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .wrapper {
      max-width: 600px;
      width: 100%;
      padding: 2.5rem 1.75rem;
      border-radius: 18px;
      background: radial-gradient(circle at top, #4338ca 0, #050710 55%);
      box-shadow: 0 18px 40px rgba(0,0,0,0.55);
      text-align: center;
    }
    .tagline {
      font-size: 0.95rem;
      color: #c7c7ff;
      margin: 0.5rem 0 1.25rem;
    }

    /* Visualizer */
    .visualizer {
      width: 100%;
      height: 260px;
      border-radius: 14px;
      overflow: hidden;
      background: #050710;
      border: 1px solid rgba(129,140,248,0.5);
      margin-bottom: 1.5rem;
      position: relative;
    }
    #viz { width: 100%; height: 100%; display: block; }

    .channel {
      padding: 1.2rem 1.4rem;
      border-radius: 16px;
      background: rgba(10,10,30,0.85);
      border: 1px solid rgba(129,140,248,0.5);
      margin-bottom: 1.75rem;
      text-align: left;
    }
    .channel span { font-weight: 600; font-size: 1rem; }
    .channel small { font-size: 0.8rem; opacity: 0.75; }
    audio { width: 100%; margin-top: 0.8rem; }

    .status {
      margin-top: 0.55rem;
      font-size: 0.78rem;
      opacity: 0.75;
    }
    .kick {
      margin-top:0.6rem;
      padding:0.45rem 0.7rem;
      border-radius:10px;
      border:1px solid rgba(129,140,248,0.6);
      background:#0b1020;
      color:#c7c7ff;
      cursor:pointer;
      font-size:0.85rem;
    }
    .kick:hover { filter: brightness(1.15); }

    .video-container {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      margin-top: 0.8rem;
    }
    .video-container iframe {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 0;
      top: 0; left: 0;
      border-radius: 12px;
    }

    .links { margin-top: 0.75rem; font-size: 0.85rem; }
    .links a { color: #a5b4fc; text-decoration: none; margin: 0 0.4rem; }
    .links a:hover { text-decoration: underline; }

    .footnote { margin-top: 1.5rem; font-size: 0.7rem; opacity: 0.55; text-align:center; }
  </style>
</head>

<body>
  <main class="wrapper">

    <img src="logo.png" alt="Radio RRR Logo"
         style="width: 300px; max-width: 90%; margin: 0 auto 10px; display: block;">

    <p class="tagline">Streaming Electro · Synth · 80s · Chill</p>

    <!-- Visualizer -->
    <div class="visualizer">
      <canvas id="viz"></canvas>
    </div>

    <!-- AUDIO STREAM -->
    <div class="channel">
      <span id="streamTitle">Dark Synth Live Stream (guest station)</span><br />
      <small id="streamSubtitle">Powered by Nightride / REKT Network</small>

      <audio id="liveStream" controls playsinline crossorigin="anonymous">
        <source id="src1" src="https://stream.rekt.fm/darksynth.mp3" type="audio/mpeg" />
        <source id="src2" src="https://stream.rekt.fm/darksynth.ogg" type="audio/ogg" />
      </audio>

      <button id="kickPlay" class="kick">Play</button>
      <div id="status" class="status">Status: idle</div>
    </div>

    <!-- VIDEO -->
    <div class="channel">
      <span>video</span><br />
      <div class="video-container">
        <iframe
          src="https://www.youtube.com/embed/p6x_4q-xaYU?list=PLli1uTuS0FH6vQ05dGXjiAl2k5K5gZpZs"
          allowfullscreen>
        </iframe>
      </div>
    </div>

    <div class="links">
      <a href="https://www.instagram.com/radio.rrr/" target="_blank">Instagram</a> ·
      <a href="https://www.tiktok.com/@josh.u.rrr" target="_blank">TikTok</a> ·
      <a href="https://www.youtube.com/@RADIO_RRR" target="_blank">YouTube</a> ·
      <a href="https://github.com/joshurrr" target="_blank">GitHub</a>
    </div>

    <p class="footnote">Streaming 24/7</p>
  </main>

  <script defer>
    document.addEventListener("DOMContentLoaded", function () {
      try {

        /* --------------------------------------------------------------
           AUDIO + SCHEDULE
        -------------------------------------------------------------- */

        var audio = document.getElementById("liveStream");
        var src1 = document.getElementById("src1");
        var src2 = document.getElementById("src2");
        var titleEl = document.getElementById("streamTitle");
        var subEl = document.getElementById("streamSubtitle");
        var statusEl = document.getElementById("status");
        var kick = document.getElementById("kickPlay");

        function setStatus(msg) { statusEl.textContent = "Status: " + msg; }

        var defaultTitle = "Dark Synth Live Stream (guest station)";
        var defaultSubtitle = "Powered by Nightride / REKT Network";

        var isSunday = (new Date()).getDay() === 0;
        if (isSunday) {
          titleEl.textContent = "Sunday Recovery Sessions";
          subEl.textContent = "Chill / dark synth downshift";
        } else {
          titleEl.textContent = defaultTitle;
          subEl.textContent = defaultSubtitle;
        }

        audio.load();


        /* --------------------------------------------------------------
           OUTRUN VISUALIZER + BASS GRID
        -------------------------------------------------------------- */

        var canvas = document.getElementById("viz");
        var ctx = canvas.getContext("2d");

        function resize() {
          var dpr = window.devicePixelRatio || 1;
          var w = canvas.clientWidth, h = canvas.clientHeight;
          if (!w || !h) return;
          canvas.width = w * dpr;
          canvas.height = h * dpr;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        resize();
        window.addEventListener("resize", resize);

        var analyser = null, dataArray = null, audioCtx = null, sourceNode = null;

        function initAnalyser() {
          if (audioCtx || analyser) return;
          try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 1024;
            dataArray = new Uint8Array(analyser.frequencyBinCount);
            sourceNode = audioCtx.createMediaElementSource(audio);
            sourceNode.connect(analyser);
            analyser.connect(audioCtx.destination);
          } catch (e) {
            console.log("Analyser blocked/CORS. Idle viz only.", e);
            analyser = null;
          }
        }

        function avgRange(start, end) {
          if (!dataArray) return 0;
          var sum = 0;
          for (var i = start; i < end; i++) sum += dataArray[i];
          return sum / (end - start);
        }

        var stars = [];
        var STAR_COUNT = 120;

        function resetStar(s) {
          s.x = (Math.random() * 2 - 1);
          s.y = (Math.random() * 0.9 - 0.45);
          s.z = Math.random() * 1.0 + 0.2;
        }
        for (var i = 0; i < STAR_COUNT; i++) { var s = {}; resetStar(s); stars.push(s); }

        var t0 = performance.now();

        function drawSun(cx, horizonY, radius, glow) {
          var g = ctx.createRadialGradient(cx, horizonY, radius * 0.2, cx, horizonY, radius);
          g.addColorStop(0, "rgba(255, 100, 220, 0.95)");
          g.addColorStop(0.6, "rgba(255, 70, 160, 0.85)");
          g.addColorStop(1, "rgba(120, 40, 255, 0.0)");
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(cx, horizonY, radius * (0.9 + glow), 0, Math.PI * 2);
          ctx.fill();

          ctx.save();
          ctx.globalCompositeOperation = "source-atop";
          ctx.fillStyle = "rgba(5,7,16,0.65)";
          var stripeH = radius * 0.12;
          for (var y = -radius; y < radius; y += stripeH * 1.8) {
            ctx.fillRect(cx - radius, horizonY + y, radius * 2, stripeH);
          }
          ctx.restore();
        }

        /* --------------------------------------------------------------
           UPDATED BASS-REACTIVE GRID
        -------------------------------------------------------------- */
        function drawGrid(w, h, horizonY, t, energy) {
          var vanX = w / 2;
          var vanY = horizonY;

          var bassBoost = Math.min(1, energy * 1.4);

          ctx.lineWidth = 1 + energy * 2.2;
          ctx.strokeStyle = "rgba(0, 240, 255, 0.65)";
          ctx.shadowColor = "rgba(255, 0, 200, 0.9)";
          ctx.shadowBlur = 12 + energy * 25;

          // Vertical lines (side sway)
          var cols = 18;
          for (var i = 0; i <= cols; i++) {
            var x = (i / cols) * w;
            var sway = Math.sin(t * 3.2 + i * 0.7) * (6 * bassBoost);

            ctx.beginPath();
            ctx.moveTo(vanX, vanY);
            ctx.lineTo(x + sway, h);
            ctx.stroke();
          }

          // Horizontal lines (bass bounce)
          var rows = 22;
          var speed = 0.6 + energy * 2.2;
          for (var r = 1; r <= rows; r++) {
            var p = (r / rows + t * speed) % 1;
            var depth = p * p;
            var y = vanY + depth * (h - vanY);

            var frontFactor = depth;
            var bounce = Math.sin(t * 6.0 + r * 0.9) * (10 * bassBoost * frontFactor);

            ctx.beginPath();
            ctx.moveTo(0, y + bounce);
            ctx.lineTo(w, y + bounce);
            ctx.stroke();
          }

          ctx.shadowBlur = 0;
        }

        function drawScanlines(w, h, t) {
          ctx.save();
          ctx.globalAlpha = 0.12;
          ctx.fillStyle = "rgba(0,0,0,1)";
          var lineGap = 3;
          var offset = (t * 30) % lineGap;
          for (var y = offset; y < h; y += lineGap) {
            ctx.fillRect(0, y, w, 1);
          }
          ctx.restore();
        }

        function draw() {
          var t = (performance.now() - t0) / 1000;
          var w = canvas.clientWidth, h = canvas.clientHeight;
          if (!w || !h) { requestAnimationFrame(draw); return; }

          var energy = 0.15;
          if (analyser && dataArray) {
            analyser.getByteFrequencyData(dataArray);
            var bass = avgRange(0, 18) / 255;
            var mid  = avgRange(18, 110) / 255;
            energy = Math.min(1, bass * 1.0 + mid * 0.35);
          } else {
            energy = 0.08 + 0.05 * Math.sin(t * 1.6);
          }

          var horizonY = h * 0.58;
          var cx = w / 2;

          var sky = ctx.createLinearGradient(0, 0, 0, horizonY);
          sky.addColorStop(0, "#140022");
          sky.addColorStop(0.5, "#22004a");
          sky.addColorStop(1, "#050710");
          ctx.fillStyle = sky;
          ctx.fillRect(0, 0, w, horizonY);

          ctx.fillStyle = "rgba(255, 0, 180, 0.06)";
          ctx.fillRect(0, 0, w, horizonY);

          for (var j = 0; j < stars.length; j++) {
            var st = stars[j];
            st.z -= (0.003 + energy * 0.01);
            if (st.z <= 0.06) resetStar(st);

            var sx = cx + (st.x / st.z) * cx;
            var sy = horizonY * 0.55 + (st.y / st.z) * (horizonY * 0.7);

            if (sx < 0 || sx > w || sy < 0 || sy > horizonY) {
              resetStar(st); continue;
            }

            var size = (1 / st.z) * (0.45 + energy * 1.1);
            ctx.fillStyle = "rgba(199,199,255,0.9)";
            ctx.fillRect(sx, sy, size, size);
          }

          drawSun(cx, horizonY * 0.98, Math.min(w, h) * 0.18, energy * 0.25);

          var ground = ctx.createLinearGradient(0, horizonY, 0, h);
          ground.addColorStop(0, "#050710");
          ground.addColorStop(1, "#02030a");
          ctx.fillStyle = ground;
          ctx.fillRect(0, horizonY, w, h - horizonY);

          drawGrid(w, h, horizonY, t, energy);
          drawScanlines(w, h, t);

          requestAnimationFrame(draw);
        }
        requestAnimationFrame(draw);


        /* --------------------------------------------------------------
           PLAY BUTTON
        -------------------------------------------------------------- */

        kick.addEventListener("click", function(){
          initAnalyser();
          setStatus("trying to play...");
          audio.play().then(function(){
            setStatus("playing");
            if (audioCtx && audioCtx.state==="suspended") audioCtx.resume();
          }).catch(function(err){
            console.log(err);
            setStatus("blocked by browser (tap Play again)");
          });
        });

      } catch (err) {
        console.log("Init error:", err);
      }

    });
  </script>
</body>
</html>
