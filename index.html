<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Radio RRR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #050710;
      color: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .wrapper {
      max-width: 600px;
      width: 100%;
      padding: 2.5rem 1.75rem;
      border-radius: 18px;
      background: radial-gradient(circle at top, #4338ca 0, #050710 55%);
      box-shadow: 0 18px 40px rgba(0,0,0,0.55);
      text-align: center;
    }
    h1 {
      font-size: 2.4rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 0.25rem;
    }
    .tagline {
      font-size: 0.95rem;
      color: #c7c7ff;
      margin-bottom: 1.75rem;
    }

    .channel {
      padding: 1.2rem 1.4rem;
      border-radius: 16px;
      background: rgba(10,10,30,0.85);
      border: 1px solid rgba(129,140,248,0.5);
      margin-bottom: 1.75rem;
      text-align: left;
    }
    .channel span {
      font-weight: 600;
      font-size: 1rem;
    }
    .channel small {
      font-size: 0.8rem;
      opacity: 0.75;
    }
    audio {
      width: 100%;
      margin-top: 0.8rem;
    }

    /* Video embed styling */
    .video-container {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%; /* 16:9 ratio */
      margin-top: 0.8rem;
    }
    .video-container iframe {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 0;
      top: 0;
      left: 0;
      border-radius: 12px;
    }

    .links {
      margin-top: 0.75rem;
      font-size: 0.85rem;
    }
    .links a {
      color: #a5b4fc;
      text-decoration: none;
      margin: 0 0.4rem;
    }
    .links a:hover {
      text-decoration: underline;
    }
    .footnote {
      margin-top: 1.5rem;
      font-size: 0.7rem;
      opacity: 0.55;
    }
  </style>
</head>

<body>
  <main class="wrapper">

    <img src="logo.png" alt="Radio RRR Logo" style="width: 300px; margin: 0 auto 20px; display: block;">

    <h1>Radio RRR</h1>
    <p class="tagline">Streaming Electro · Synth · 80s · Chill</p>

    <!-- AUDIO STREAM -->
    <div class="channel">
      <span>Live Stream</span><br />
      
      <audio controls preload="none">
        <source src="https://stream.radiorrr.com/electro.mp3" type="audio/mpeg" />
        Your browser doesn’t support the audio element.
      </audio>
    </div>

    <!-- VIDEO STREAM -->
    <div class="channel">
      <span>video</span><br />
         <div class="video-container">
        <iframe 
          src="https://youtube.com/shorts/J4w8UD1q_qQ?feature=share" 
          allowfullscreen
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture">
        </iframe>
      </div>
    </div>

    <div class="links">
      <a href="https://www.instagram.com/radio.rrr/" target="_blank" rel="noopener">Instagram</a> ·
      <a href="https://www.tiktok.com/@josh.u.rrr" target="_blank" rel="noopener">TikTok</a> ·
      <a href="https://www.youtube.com/@RADIO_RRR" target="_blank" rel="noopener">YouTube</a> ·
      <a href="https://github.com/joshurrr" target="_blank" rel="noopener">GitHub</a>
    </div>

    <p class="footnote">Streaming 24/7</p>
  </main>
</body>
</html>
