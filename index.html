<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Radio RRR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    /* RESET */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    /* BODY & CONTAINER */
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #050710;
      color: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .wrapper {
      max-width: 600px;
      width: 100%;
      padding: 2.5rem 1.75rem;
      border-radius: 18px;
      /* Aesthetic Update: Simpler background, new multi-color neon box-shadow */
      background: #0d0e1f;
      border: 1px solid #1f224b;
      box-shadow: 
        0 0 10px rgba(67, 56, 202, 0.5), 
        0 0 30px rgba(255, 0, 102, 0.4);
      text-align: center;
      transition: all 0.3s ease-out; 
    }
    .tagline {
      font-size: 0.95rem;
      color: #c7c7ff;
      margin: 0.5rem 0 1.25rem;
    }
    
    /* VISUALIZER */
    .visualizer {
      width: 100%;
      height: 260px;
      border-radius: 14px;
      overflow: hidden;
      /* Background is now pure black for contrast with bright neon */
      background: #000000; 
      margin-bottom: 0.6rem;
      /* Aesthetic Update: Neon frame for visualizer */
      border: 2px solid #ff0066; 
      box-shadow: 0 0 15px rgba(255, 0, 102, 0.5);
    }
    #viz { width: 100%; height: 100%; display: block; }

    /* CHANNEL PANELS */
    .channel {
      padding: 1.2rem 1.4rem;
      border-radius: 16px;
      background: rgba(10,10,30,0.85);
      border: 1px solid rgba(129,140,248,0.5);
      margin-bottom: 1.75rem;
      text-align: left;
    }
    .channel span { font-weight: 600; font-size: 1rem; }
    /* Accessibility/Aesthetic Improvement: Increased contrast/brightness */
    .channel small { font-size: 0.8rem; color: #e0e0ff; opacity: 0.9; } 

    /* STREAM TITLE */
    .stream-title {
      display: block;
      margin: 0.4rem 0 0.4rem;
      font-weight: 600;
      font-size: 1rem;
      /* Aesthetic Update: Neon Text Glow */
      color: #ffccff;
      text-shadow: 
        0 0 4px #ff0066, 
        0 0 10px #4338ca;
      letter-spacing: 0.1em;
      transition: all 0.3s;
    }

    /* AUDIO / STATUS */
    audio { width: 100%; margin-top: 0.2rem; }
    .status { display:none; font-size: 0.8rem; margin-top: 0.4rem; opacity: 0.8; }
    
    /* VIDEO EMBEDS */
    .video-container {
      position: relative;
      width: 100%; padding-bottom: 56.25%;
      margin-top: 0.8rem;
    }
    .video-container iframe {
      position: absolute; width: 100%; height: 100%; border: 0;
      top: 0; left: 0; border-radius: 12px;
    }
    
    /* LINKS */
    .links { margin-top: 0.75rem; font-size: 0.85rem; text-align:center; }
    .links a { 
      color: #a5b4fc; 
      text-decoration: none; 
      margin: 0 0.4rem;
      transition: color 0.3s, text-shadow 0.3s;
    }
    /* Aesthetic Update: Neon Hover Effect for Links */
    .links a:hover {
      color: #ff0066;
      text-shadow: 0 0 8px #ff0066;
    }
    
    /* FOOTNOTE */
    .footnote { margin-top: 1.5rem; font-size: 0.7rem; opacity: 0.55; }
  </style>
</head>

<body>
  <main class="wrapper">

    <h1 style="margin: 0 auto 10px;">
        <img src="logo.png" alt="Radio RRR Logo"
             style="width: 300px; max-width: 90%; display: block; margin: 0 auto;">
    </h1>

    <p class="tagline">Streaming Electro · Synth · 80s · Chill</p>

    <div class="channel">

      <div class="visualizer">
        <canvas id="viz"></canvas>
      </div>

      <span id="streamTitle" class="stream-title">RADIO RRR Live</span>

      <audio id="liveStream" controls crossorigin="anonymous">
        <source src="https://stream.nightride.fm/nightride.mp3" type="audio/mpeg" />
      </audio>

      <div id="status" class="status"></div>
    </div>

    <div class="channel">
      <span>Latest on TikTok</span><br />
      <small>@josh.u.rrr · newest shorts</small>

      <blockquote class="tiktok-embed"
        cite="https://www.tiktok.com/@josh.u.rrr"
        data-unique-id="josh.u.rrr"
        data-embed-type="creator"
        style="max-width:100%; min-width:280px; margin-top:0.8rem;">
        <section>
          <a target="_blank" href="https://www.tiktok.com/@josh.u.rrr">@josh.u.rrr</a>
        </section>
      </blockquote>
    </div>

    <div class="channel">
      <span>YouTube Likes</span><br />
      <small>Latest videos we liked</small>

      <div class="video-container">
        <iframe
          src="https://www.youtube.com/embed/videoseries?list=PLli1uTuS0FH7xR1QBnIvY3V9btomaSpTv"
          allowfullscreen
          loading="lazy">
        </iframe>
      </div>
    </div>

    <div class="links">
      <a href="https://www.instagram.com/radio.rrr/" target="_blank">Instagram</a> ·
      <a href="https://www.tiktok.com/@josh.u.rrr" target="_blank">TikTok</a> ·
      <a href="https://www.youtube.com/@RADIO_RRR" target="_blank">YouTube</a> ·
      <a href="https://github.com/joshurrr" target="_blank">GitHub</a>
    </div>

    <p class="footnote">
      Streaming 24/7<br>
      Contact: <a href="mailto:admin@radiorrr.com" style="color:#a5b4fc;">admin@radiorrr.com</a>
    </p>

  </main>

  <script async src="https://www.tiktok.com/embed.js"></script>

  <script>
  document.addEventListener("DOMContentLoaded", () => {

    const titleEl = document.getElementById("streamTitle");

    function getDayPeriod(hour) {
      if (hour < 12) return "Morning";
      if (hour < 17) return "Afternoon";
      return "Night";
    }

    function updateTitle() {
      const now = new Date();
      const days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
      const dayName = days[now.getDay()];
      const period = getDayPeriod(now.getHours());

      const variantsByPeriod = {
        Morning: ["Morning Chill","Sunrise Session","Morning Transmission"],
        Afternoon: ["Afternoon Chill","Daystream Session","Retro Run"],
        Night: ["Night Chill","After Dark","Night Transmission","Late Night Set"]
      };

      const list = variantsByPeriod[period] || ["Live Mix"];
      const label = list[now.getDay() % list.length];

      titleEl.textContent = `RADIO RRR Live – ${dayName} ${label}`;
    }

    updateTitle();
    setInterval(updateTitle, 60000); 

    const audio = document.getElementById("liveStream");
    const statusEl = document.getElementById("status");
    const canvas = document.getElementById("viz");
    const ctx = canvas.getContext("2d");

    function setStatus(msg) {
      statusEl.style.display = "block";
      statusEl.textContent = "Status: " + msg;
    }

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      // No more static gradients needed for the new visualizer
    }
    resize();
    window.addEventListener("resize", resize);

    let audioCtx = null;
    let analyser = null;
    let dataArray = null;
    let analyserEnabled = false;
    let analyserInitAttempted = false;
    let isPlaying = false;

    function initAnalyser() {
      if (analyserInitAttempted) return;
      analyserInitAttempted = true;
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AC();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 1024;
        dataArray = new Uint8Array(analyser.frequencyBinCount);
        const src = audioCtx.createMediaElementSource(audio);
        src.connect(analyser);
        analyser.connect(audioCtx.destination);
        analyserEnabled = true;
      } catch { analyserEnabled = false; }
    }

    function avgRange(arr, start, end) {
      let sum = 0;
      for (let i = start; i < end; i++) sum += arr[i];
      return sum / (end - start);
    }

    let startTime = performance.now();

    // 🚀 NEW CORE SPECTRUM TUNNEL VISUALIZER 🚀
    function drawFrame() {
      const t = (performance.now() - startTime) / 1000;
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      const cx = w / 2;
      const cy = h / 2;
      const maxDim = Math.max(w, h);
      const minDim = Math.min(w, h);

      let bass = 0.1, mid = 0.1, treb = 0.1, energy = 0.1;

      if (analyserEnabled && isPlaying) {
        analyser.getByteFrequencyData(dataArray);
        const len = dataArray.length;
        bass = avgRange(dataArray, 0, len * 0.08) / 255;
        mid  = avgRange(dataArray, len * 0.08, len * 0.4) / 255;
        treb = avgRange(dataArray, len * 0.4, len) / 255;
        energy = (bass + mid + treb) / 3;
      } else {
        // Fallback animation
        bass = (Math.sin(t * 1.5) + 1) / 2;
        mid  = (Math.sin(t * 0.9 + 1.2) + 1) / 2;
        treb = (Math.sin(t * 2.1 + 0.7) + 1) / 2;
        energy = (bass + mid + treb) / 3;
      }

      // 1. Digital Fade Background (Cleaner than simple clearRect)
      ctx.fillStyle = "rgba(0, 0, 0, 0.25)";
      ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
      ctx.fillRect(0, 0, w, h);
      
      // 2. Draw Spectrum Circles
      const circleCount = 6;
      for (let i = 0; i < circleCount; i++) {
        const radius = (minDim * 0.05) + (i * minDim * 0.07);
        const freqAmp = (i % 2 === 0 ? mid : treb); // Alternate between mid and treb
        const currentRadius = radius + (freqAmp * 20);
        
        ctx.beginPath();
        ctx.arc(cx, cy, currentRadius, 0, Math.PI * 2);
        
        // Dynamic color based on time and frequency
        const hue = (t * 50 + i * 20) % 360; 
        ctx.strokeStyle = `hsl(${hue}, 100%, ${60 + freqAmp * 20}%)`;
        ctx.lineWidth = 1 + freqAmp * 2;
        ctx.shadowBlur = 10 + freqAmp * 10;
        ctx.shadowColor = `hsl(${hue}, 100%, 50%)`;
        ctx.stroke();
      }
      ctx.shadowBlur = 0; // Reset shadow

      // 3. Draw Radial Lines (Wireframe Tunnel)
      const lineCount = 64;
      for (let i = 0; i < lineCount; i++) {
        const angle = (i * (Math.PI * 2) / lineCount) + (t * 0.05 * treb);
        const maxDist = maxDim * 0.7;
        const lineLength = maxDist + (bass * 50);

        const x2 = cx + Math.cos(angle) * lineLength;
        const y2 = cy + Math.sin(angle) * lineLength;
        
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(x2, y2);
        
        // Color shift based on bass/mid
        const lineHue = (i * 5 + t * 50) % 360; 
        ctx.strokeStyle = `hsla(${lineHue}, 100%, 50%, ${0.2 + energy * 0.5})`;
        ctx.lineWidth = 1;
        ctx.stroke();
      }
      
      // 4. Central Core Pulse (Bass Reaction)
      const coreRadius = 5 + bass * 20;
      const coreGradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, coreRadius);
      coreGradient.addColorStop(0, `rgba(255, 255, 255, ${0.8 + bass * 0.2})`);
      coreGradient.addColorStop(0.5, `rgba(255, 0, 102, ${0.5 + bass * 0.5})`);
      coreGradient.addColorStop(1, "rgba(255, 0, 102, 0)");

      ctx.fillStyle = coreGradient;
      ctx.beginPath();
      ctx.arc(cx, cy, coreRadius, 0, Math.PI * 2);
      ctx.fill();


      requestAnimationFrame(drawFrame);
    }
    requestAnimationFrame(drawFrame);

    audio.addEventListener("play", () => {
      isPlaying = true;
      setStatus("playing");
      initAnalyser();
      if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    });

    audio.addEventListener("pause", () => {
      isPlaying = false;
      setStatus("paused");
    });

    audio.addEventListener("error", () => setStatus("audio error (stream offline?)"));
  });
  </script>

</body>
</html>
