<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Radio RRR - Enhanced</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #050710;
      color: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .wrapper {
      max-width: 900px;
      width: 100%;
      padding: 2.5rem 1.75rem 2rem;
      border-radius: 18px;
      background: #0d0e1f;
      border: 1px solid rgba(129,140,248,0.3);
      box-shadow:
        0 0 10px rgba(67, 56, 202, 0.5),
        0 0 30px rgba(255, 0, 102, 0.4);
      text-align: center;
    }

    .hero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.75rem;
      padding: 1.4rem 1.6rem;
      border-radius: 16px;
      background: radial-gradient(circle at top left, rgba(255,0,102,0.4), transparent 55%),
                  radial-gradient(circle at bottom right, rgba(56,189,248,0.35), transparent 55%),
                  #050716;
      border: 1px solid rgba(129,140,248,0.6);
      box-shadow:
        0 0 12px rgba(255, 0, 102, 0.45),
        0 0 26px rgba(56,189,248,0.35);
      margin-bottom: 1.75rem;
      text-align: left;
    }
    .hero-left img {
      width: 180px;
      max-width: 100%;
      border-radius: 10px;
      display: block;
    }
    .hero-right {
      flex: 1;
      min-width: 0;
    }
    .live-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.12rem 0.7rem;
      border-radius: 999px;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      background: rgba(239, 68, 68, 0.18);
      border: 1px solid rgba(248, 113, 113, 0.6);
      color: #fecaca;
      margin-bottom: 0.55rem;
    }
    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f87171;
      box-shadow: 0 0 8px rgba(248,113,113,0.95);
    }
    .hero-title {
      font-size: 1.7rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #e0e7ff;
      text-shadow:
        0 0 8px rgba(129,140,248,0.75),
        0 0 16px rgba(59,130,246,0.8);
      margin-bottom: 0.3rem;
    }
    .hero-sub {
      font-size: 0.9rem;
      color: #e5e7eb;
      opacity: 0.9;
      margin-bottom: 0.6rem;
    }
    .hero-now-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #f9a8d4;
      margin-top: 0.35rem;
      text-shadow:
        0 0 6px rgba(129,140,248,0.9),
        0 0 10px rgba(59,130,246,0.9);
    }
    .hero-now-title strong {
      color: #ffffff;
      font-weight: 800;
    }

    .visualizer {
      width: 100%;
      height: 360px;
      border-radius: 14px;
      overflow: hidden;
      background: #000000;
      margin-bottom: 0.6rem;
      border: 2px solid #ff0066;
      box-shadow: 0 0 15px rgba(255, 0, 102, 0.5);
      position: relative;
    }
    #viz { 
      width: 100%; 
      height: 100%; 
      display: block;
      position: absolute;
      top: 0;
      left: 0;
    }

    .channel {
      padding: 1.2rem 1.4rem;
      border-radius: 16px;
      background: rgba(10,10,30,0.85);
      border: 1px solid rgba(129,140,248,0.5);
      margin-bottom: 1.75rem;
      text-align: left;
    }

    audio { width: 100%; margin-top: 0.2rem; }
    .kick {
      margin-top:0.6rem; padding:0.45rem 0.7rem;
      border-radius:10px; border:1px solid rgba(129,140,248,0.6);
      background:#0b1020; color:#c7c7ff;
      cursor:pointer; font-size:0.85rem;
      transition: all 0.3s;
      text-decoration: none;
      display: inline-block;
    }
    .kick:hover {
      color: #ff0066;
      border-color: #ff0066;
      box-shadow: 0 0 12px rgba(255, 0, 102, 0.7);
    }

    @media (max-width: 720px) {
      .hero {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .hero-right { text-align: center; }
      .visualizer { height: 280px; }
    }
  </style>
</head>
<body>
  <main class="wrapper">
    <section class="hero">
      <div class="hero-left">
        <img src="logo.png" alt="Radio RRR Logo">
      </div>
      <div class="hero-right">
        <div class="live-pill">
          <span class="live-dot"></span>
          LIVE · BROADCASTING 24/7
        </div>
        <h1 class="hero-title">RADIO RRR</h1>
        <p class="hero-now-title">
          Now Playing:
          <strong id="heroNowPlaying">Loading...</strong>
        </p>
      </div>
    </section>

    <div class="channel">
      <div class="visualizer">
        <canvas id="viz"></canvas>
      </div>

      <audio id="liveStream" controls crossorigin="anonymous">
        <source src="https://stream.nightride.fm/nightride.mp3" type="audio/mpeg" />
      </audio>

      <button id="kickPlay" class="kick">Play</button>
    </div>
  </main>

  <script>
    const audio = document.getElementById("liveStream");
    const canvas = document.getElementById("viz");
    const ctx = canvas.getContext("2d");
    const kick = document.getElementById("kickPlay");

    let audioCtx = null;
    let analyser = null;
    let dataArray = null;
    let analyserReady = false;

    // Particle system
    const particles = [];
    const maxParticles = 80;

    class Particle {
      constructor(x, y, vx, vy, hue, size) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.hue = hue;
        this.size = size;
        this.alpha = 1;
        this.decay = 0.015;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.1; // gravity
        this.alpha -= this.decay;
      }

      draw(ctx) {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size);
        gradient.addColorStop(0, `hsla(${this.hue}, 100%, 70%, 1)`);
        gradient.addColorStop(1, `hsla(${this.hue}, 100%, 50%, 0)`);
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    function initAudioAnalyser() {
      if (audioCtx || !audio) return;
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        audioCtx = new AC();
        const source = audioCtx.createMediaElementSource(audio);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 2048;
        analyser.smoothingTimeConstant = 0.85;
        const bufferLength = analyser.frequencyBinCount;
        dataArray = new Uint8Array(bufferLength);
        source.connect(analyser);
        analyser.connect(audioCtx.destination);
        analyserReady = true;
      } catch (e) {
        console.warn("Analyser init failed:", e);
        analyserReady = false;
      }
    }

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    window.addEventListener("resize", resize);

    let prevBass = 0;
    let prevMid = 0;
    let prevTreble = 0;
    const smoothing = 0.7;

    function drawFrame() {
      const t = performance.now() / 1000;
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      const cx = w / 2;
      const cy = h / 2;

      let bass = 0.1;
      let mid = 0.1;
      let treble = 0.1;
      let spectrum = null;

      if (analyserReady && analyser && dataArray) {
        analyser.getByteFrequencyData(dataArray);
        spectrum = dataArray;

        // Analyze frequency ranges
        const bassEnd = Math.floor(dataArray.length * 0.1);
        const midEnd = Math.floor(dataArray.length * 0.4);
        
        let bassSum = 0, midSum = 0, trebleSum = 0;
        
        for (let i = 0; i < bassEnd; i++) bassSum += dataArray[i];
        for (let i = bassEnd; i < midEnd; i++) midSum += dataArray[i];
        for (let i = midEnd; i < dataArray.length * 0.8; i++) trebleSum += dataArray[i];

        bass = (bassSum / bassEnd) / 255;
        mid = (midSum / (midEnd - bassEnd)) / 255;
        treble = (trebleSum / (dataArray.length * 0.8 - midEnd)) / 255;

        // Smooth the values
        bass = prevBass * smoothing + bass * (1 - smoothing);
        mid = prevMid * smoothing + mid * (1 - smoothing);
        treble = prevTreble * smoothing + treble * (1 - smoothing);

        prevBass = bass;
        prevMid = mid;
        prevTreble = treble;
      }

      // Dark background with trail effect
      ctx.fillStyle = "rgba(0, 0, 0, 0.15)";
      ctx.fillRect(0, 0, w, h);

      // Animated gradient background
      const bgGradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(w, h) * 0.7);
      bgGradient.addColorStop(0, `hsla(${(t * 20) % 360}, 70%, 15%, 0.05)`);
      bgGradient.addColorStop(0.5, `hsla(${(t * 15 + 180) % 360}, 80%, 10%, 0.03)`);
      bgGradient.addColorStop(1, "rgba(0, 0, 0, 0)");
      ctx.fillStyle = bgGradient;
      ctx.fillRect(0, 0, w, h);

      // Spawn particles on bass hits
      if (bass > 0.6 && Math.random() > 0.5) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 2 + bass * 4;
        const vx = Math.cos(angle) * speed;
        const vy = Math.sin(angle) * speed - 2;
        const hue = (t * 50 + Math.random() * 60) % 360;
        particles.push(new Particle(cx, cy, vx, vy, hue, 3 + bass * 8));
      }

      // Update and draw particles
      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw(ctx);
        if (particles[i].alpha <= 0) {
          particles.splice(i, 1);
        }
      }
      if (particles.length > maxParticles) {
        particles.splice(0, particles.length - maxParticles);
      }

      // Outer rotating rings
      const ringCount = 5;
      for (let i = 0; i < ringCount; i++) {
        const radius = Math.min(w, h) * (0.3 + i * 0.08) + bass * 30;
        const rotation = t * (0.2 + i * 0.1) + i * Math.PI / 3;
        
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(rotation);
        
        ctx.beginPath();
        const segments = 60;
        for (let j = 0; j <= segments; j++) {
          const angle = (j / segments) * Math.PI * 2;
          const r = radius + Math.sin(j * 0.5 + t * 2) * 10 * mid;
          const x = Math.cos(angle) * r;
          const y = Math.sin(angle) * r;
          if (j === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        
        const hue = (t * 30 + i * 60) % 360;
        ctx.strokeStyle = `hsla(${hue}, 100%, 60%, ${0.2 + bass * 0.3})`;
        ctx.lineWidth = 2 + bass * 3;
        ctx.shadowBlur = 15 + bass * 20;
        ctx.shadowColor = `hsla(${hue}, 100%, 60%, 1)`;
        ctx.stroke();
        
        ctx.restore();
      }
      ctx.shadowBlur = 0;

      // Circular frequency bars
      if (spectrum) {
        const barCount = 120;
        const barWidth = 3;
        const innerRadius = Math.min(w, h) * 0.12;
        
        for (let i = 0; i < barCount; i++) {
          const angle = (i / barCount) * Math.PI * 2 - Math.PI / 2;
          const specIndex = Math.floor((i / barCount) * spectrum.length);
          let value = (spectrum[specIndex] || 0) / 255;
          
          // Interpolate for smoother bars
          const nextIndex = Math.min(specIndex + 1, spectrum.length - 1);
          const nextValue = (spectrum[nextIndex] || 0) / 255;
          value = value * 0.7 + nextValue * 0.3;
          
          const barHeight = value * Math.min(w, h) * 0.35;
          
          const x1 = cx + Math.cos(angle) * innerRadius;
          const y1 = cy + Math.sin(angle) * innerRadius;
          const x2 = cx + Math.cos(angle) * (innerRadius + barHeight);
          const y2 = cy + Math.sin(angle) * (innerRadius + barHeight);
          
          const hue = (i * 3 + t * 50) % 360;
          const gradient = ctx.createLinearGradient(x1, y1, x2, y2);
          gradient.addColorStop(0, `hsla(${hue}, 100%, 50%, 0.3)`);
          gradient.addColorStop(1, `hsla(${hue}, 100%, 70%, ${0.7 + value * 0.3})`);
          
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.strokeStyle = gradient;
          ctx.lineWidth = barWidth;
          ctx.lineCap = "round";
          ctx.stroke();
        }
      }

      // Center pulsing orb
      const orbRadius = 15 + bass * 35 + Math.sin(t * 4) * 5;
      const orbGradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, orbRadius * 2);
      orbGradient.addColorStop(0, `hsla(${(t * 100) % 360}, 100%, 90%, 1)`);
      orbGradient.addColorStop(0.3, `hsla(${(t * 100 + 60) % 360}, 100%, 70%, 0.8)`);
      orbGradient.addColorStop(0.6, `hsla(${(t * 100 + 120) % 360}, 100%, 50%, 0.4)`);
      orbGradient.addColorStop(1, "rgba(255, 0, 170, 0)");
      
      ctx.fillStyle = orbGradient;
      ctx.beginPath();
      ctx.arc(cx, cy, orbRadius * 1.5, 0, Math.PI * 2);
      ctx.fill();

      // Waveform overlay
      if (spectrum) {
        ctx.beginPath();
        const wavePoints = 150;
        const waveAmplitude = h * 0.15;
        for (let i = 0; i <= wavePoints; i++) {
          const x = (i / wavePoints) * w;
          const specIndex = Math.floor((i / wavePoints) * spectrum.length * 0.3);
          const value = (spectrum[specIndex] || 0) / 255;
          const y = cy + Math.sin(i * 0.1 + t * 2) * (20 + value * waveAmplitude);
          
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        
        ctx.strokeStyle = `hsla(${(t * 60) % 360}, 100%, 70%, 0.4)`;
        ctx.lineWidth = 2;
        ctx.shadowBlur = 10;
        ctx.shadowColor = `hsla(${(t * 60) % 360}, 100%, 70%, 1)`;
        ctx.stroke();
        ctx.shadowBlur = 0;
      }

      requestAnimationFrame(drawFrame);
    }

    requestAnimationFrame(drawFrame);

    if (kick && audio) {
      kick.addEventListener("click", function () {
        if (audio.paused) {
          kick.textContent = "Connecting...";
          if (!audioCtx) {
            initAudioAnalyser();
          } else if (audioCtx.state === "suspended") {
            audioCtx.resume();
          }
          audio.play().then(() => {
            kick.textContent = "Pause";
          }).catch((e) => {
            console.error("Play error:", e);
            kick.textContent = "Play";
          });
        } else {
          audio.pause();
          kick.textContent = "Play";
        }
      });

      audio.addEventListener("play", () => {
        if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
        if (!audioCtx) initAudioAnalyser();
        kick.textContent = "Pause";
      });

      audio.addEventListener("pause", () => {
        kick.textContent = "Play";
      });
    }

    function updateNowPlaying() {
      const now = new Date();
      const hour = now.getHours();
      const days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
      const dayName = days[now.getDay()];
      
      let period, label;
      if (hour >= 6 && hour < 12) {
        period = "Morning";
        label = "Neon Sunrise Chill";
      } else if (hour >= 12 && hour < 18) {
        period = "Afternoon";
        label = "Daydrive Synthwave";
      } else {
        period = "Evening";
        label = "Night Drive Electro";
      }
      
      document.getElementById("heroNowPlaying").textContent = 
        `${dayName} ${period} – ${label}`;
    }

    updateNowPlaying();
    setInterval(updateNowPlaying, 15 * 60 * 1000);
  </script>
</body>
</html>
