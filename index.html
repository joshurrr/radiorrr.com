<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Radio RRR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <meta name="description" content="Radio RRR: The #1 neon 80s inspired synth electro neon radio station." />
  <meta property="og:title" content="Radio RRR - 24/7 Electro, Synth, 80s, Remixed" />
  <meta property="og:description" content="Tune in to the best Retrowave, Synthwave, and Outrun music for your late-night drives." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://radiorrr.com/" />
  <meta property="og:image" content="https://radiorrr.com/logo.png" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #050710;
      color: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .wrapper {
      max-width: 900px;
      width: 100%;
      padding: 2.5rem 1.75rem 2rem;
      border-radius: 18px;
      background: #0d0e1f;
      border: 1px solid rgba(129,140,248,0.3);
      box-shadow:
        0 0 10px rgba(67, 56, 202, 0.5),
        0 0 30px rgba(255, 0, 102, 0.4);
      text-align: center;
      transition: all 0.3s ease-out;
    }

    /* HERO BANNER */
    .hero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.75rem;
      padding: 1.4rem 1.6rem;
      border-radius: 16px;
      background: radial-gradient(circle at top left, rgba(255,0,102,0.4), transparent 55%),
                  radial-gradient(circle at bottom right, rgba(56,189,248,0.35), transparent 55%),
                  #050716;
      border: 1px solid rgba(129,140,248,0.6);
      box-shadow:
        0 0 12px rgba(255, 0, 102, 0.45),
        0 0 26px rgba(56,189,248,0.35);
      margin-bottom: 1.75rem;
      text-align: left;
    }

    .hero-left img {
      width: 180px;
      max-width: 100%;
      border-radius: 10px;
      display: block;
    }

    .hero-right {
      flex: 1;
      min-width: 0;
    }

    .live-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.12rem 0.7rem;
      border-radius: 999px;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      background: rgba(239, 68, 68, 0.18);
      border: 1px solid rgba(248, 113, 113, 0.6);
      color: #fecaca;
      margin-bottom: 0.55rem;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f87171;
      box-shadow: 0 0 8px rgba(248,113,113,0.95);
    }

    .hero-title {
      font-size: 1.7rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #e0e7ff;
      text-shadow:
        0 0 8px rgba(129,140,248,0.75),
        0 0 16px rgba(59,130,246,0.8);
      margin-bottom: 0.3rem;
    }

    .hero-now-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #f9a8d4;
      margin-top: 0.35rem;
      text-shadow:
        0 0 6px rgba(129,140,248,0.9),
        0 0 10px rgba(59,130,246,0.9);
    }

    .hero-now-title strong {
      color: #ffffff;
      font-weight: 800;
    }

    /* NAV TABS */
    .nav-tabs {
      display: flex;
      justify-content: center;
      gap: 0.9rem;
      margin-top: 1.2rem;
      margin-bottom: 2rem;
      padding-bottom: 0.5rem;
      flex-wrap: wrap;
    }

    .nav-tabs a {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      padding: 0.40rem 1.35rem;
      border-radius: 999px;
      font-weight: 700;
      font-size: 1.02rem;
      color: #c7c7ff;
      text-decoration: none;
      letter-spacing: 0.06em;
      cursor: pointer;
      border: 1px solid rgba(129,140,248,0.6);
      background: radial-gradient(circle at top, rgba(24, 31, 60, 0.95), rgba(6, 10, 25, 0.98));
      box-shadow: 0 0 8px rgba(15,23,42,0.8);
      text-shadow: 0 0 4px rgba(67, 56, 202, 0.6);
      transition:
        transform 0.15s ease,
        box-shadow 0.2s ease,
        color 0.2s ease,
        border-color 0.2s ease,
        background 0.2s ease;
      overflow: hidden;
    }

    .nav-tabs a::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(circle at top, rgba(255,255,255,0.08), transparent 55%);
      opacity: 0;
      transition: opacity 0.2s ease;
      pointer-events: none;
    }

    .nav-icon {
      font-size: 0.95rem;
      opacity: 0.85;
      transform: translateY(0);
      transition: transform 0.2s ease;
    }

    .nav-label {
      text-transform: uppercase;
    }

    .nav-tabs a:hover {
      transform: translateY(-1px);
      border-color: #ff4dab;
      box-shadow:
        0 0 10px rgba(255, 0, 102, 0.5),
        0 0 14px rgba(129,140,248,0.5);
      color: #ffe4ff;
    }

    .nav-tabs a:hover::after {
      opacity: 1;
    }

    .nav-tabs a.active {
      transform: translateY(-2px) scale(1.02);
      border-color: #ff0066;
      background: linear-gradient(
        135deg,
        rgba(34, 9, 53, 0.98),
        rgba(5, 24, 61, 0.98)
      );
      box-shadow:
        0 0 14px rgba(255, 0, 102, 0.85),
        0 0 18px rgba(129,140,248,0.9);
      color: #ffffff;
    }

    .nav-tabs a.active .nav-icon {
      transform: translateY(-1px);
    }

    /* LIVE NAV BUTTON */
    .nav-tabs a.live-nav {
      border-color: rgba(248,113,113,0.7);
      color: #fecaca;
      background:
        radial-gradient(
          circle at top,
          rgba(80,20,35,0.95),
          rgba(20,8,20,0.98)
        );
      box-shadow:
        0 0 8px rgba(239,68,68,0.25);
    }

    .nav-tabs a.live-nav:hover {
      border-color: #ff0066;
      color: #ffffff;
      box-shadow:
        0 0 12px rgba(255,0,102,0.7),
        0 0 18px rgba(248,113,113,0.45);
    }

    .nav-tabs a.live-nav .live-nav-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #f87171;
      box-shadow: 0 0 8px rgba(248,113,113,1);
      animation: livePulse 1.4s infinite;
    }

    @keyframes livePulse {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.45;
        transform: scale(0.75);
      }
    }

    .content-pane {
      width: 100%;
      transition: opacity 0.3s ease-in-out;
    }

    .hidden-pane {
      display: none;
    }

    /* VISUALIZER */
    .visualizer {
      width: 100%;
      height: 360px;
      border-radius: 14px;
      overflow: hidden;
      background: #000000;
      margin-bottom: 0.6rem;
      border: 2px solid #ff0066;
      box-shadow: 0 0 15px rgba(255, 0, 102, 0.5);
    }

    #viz {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* CHANNEL PANELS */
    .channel {
      padding: 1.2rem 1.4rem;
      border-radius: 16px;
      background: rgba(10,10,30,0.85);
      border: 1px solid rgba(129,140,248,0.5);
      margin-bottom: 1.75rem;
      text-align: left;
    }

    .channel span {
      font-weight: 600;
      font-size: 1rem;
    }

    .channel small {
      font-size: 0.8rem;
      color: #e0e0ff;
      opacity: 0.9;
    }

    audio {
      width: 100%;
      margin-top: 0.2rem;
    }

    .status {
      display:none;
      font-size: 0.8rem;
      margin-top: 0.4rem;
      opacity: 0.9;
      color:#e0e0ff;
    }

    .kick {
      margin-top:0.6rem;
      padding:0.45rem 0.7rem;
      border-radius:10px;
      border:1px solid rgba(129,140,248,0.6);
      background:#0b1020;
      color:#c7c7ff;
      cursor:pointer;
      font-size:0.85rem;
      transition: all 0.3s;
      text-decoration: none;
      display: inline-block;
    }

    .kick:hover {
      color: #ff0066;
      border-color: #ff0066;
      box-shadow: 0 0 12px rgba(255, 0, 102, 0.7);
    }

    /* LIVE DJs */
    .live-djs-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    .live-djs-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 0 8px rgba(255, 0, 102, 0.65);
    }

    .live-refresh {
      padding: 0.4rem 0.8rem;
      border-radius: 999px;
      border: 1px solid rgba(129,140,248,0.6);
      background: #0b1020;
      color: #c7c7ff;
      cursor: pointer;
      font-weight: 700;
    }

    .live-refresh:hover {
      border-color: #ff0066;
      color: #ffffff;
      box-shadow: 0 0 10px rgba(255,0,102,0.55);
    }

    .live-djs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1rem;
    }

    .dj-card {
      padding: 1.1rem;
      border-radius: 14px;
      background:
        radial-gradient(circle at top left, rgba(255,0,102,0.18), transparent 55%),
        rgba(7,10,25,0.95);
      border: 1px solid rgba(248,113,113,0.5);
      box-shadow: 0 0 12px rgba(255,0,102,0.2);
      text-align: left;
    }

    .dj-live {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: #fecaca;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 0.65rem;
    }

    .dj-live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #f87171;
      box-shadow: 0 0 8px rgba(248,113,113,1);
      animation: livePulse 1.4s infinite;
    }

    .dj-name {
      font-size: 1.15rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 0.25rem;
    }

    .dj-meta {
      font-size: 0.85rem;
      color: #c7c7ff;
      margin-bottom: 0.9rem;
      min-height: 2.4em;
    }

    .dj-watch {
      display: inline-block;
      padding: 0.5rem 0.9rem;
      border-radius: 999px;
      background: linear-gradient(135deg, #ff0066, #4338ca);
      border: 1px solid rgba(255,255,255,0.25);
      color: #ffffff;
      text-decoration: none;
      font-weight: 800;
      box-shadow: 0 0 10px rgba(255,0,102,0.45);
    }

    .dj-watch:hover {
      box-shadow:
        0 0 14px rgba(255,0,102,0.8),
        0 0 20px rgba(129,140,248,0.6);
      transform: translateY(-1px);
    }

    .live-empty,
    .live-error {
      padding: 1.5rem;
      border-radius: 14px;
      border: 1px solid rgba(129,140,248,0.35);
      background: rgba(5,7,20,0.8);
      color: #c7c7ff;
      text-align: center;
    }

    .live-error {
      color: #fecaca;
      border-color: rgba(248,113,113,0.4);
    }

    /* SCHEDULE */
    .events-list {
      text-align: left;
      margin-top: 1rem;
      padding-top: 0.5rem;
      border-top: 1px solid rgba(129, 140, 248, 0.15);
    }

    .event-item {
      margin: 1.25rem 0;
      border-left: 3px solid #4338ca;
      padding-left: 1rem;
    }

    .event-item h4 {
      margin: 0;
      font-size: 1rem;
      color: #ffccff;
      text-shadow: 0 0 3px rgba(255, 0, 102, 0.5);
    }

    .event-item p {
      margin: 0.25rem 0 0;
      font-size: 0.85rem;
      color: #e0e0ff;
    }

    /* VIDEO */
    .video-container {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      margin-top: 0.8rem;
    }

    .video-container iframe {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 0;
      top: 0;
      left: 0;
      border-radius: 12px;
    }

    .neon-embed-frame {
      margin-top: 1.2rem;
      padding: 1rem 0.75rem;
      border-radius: 16px;
      background:
        radial-gradient(circle at top, rgba(15,23,42,0.9), rgba(3,7,18,0.98));
      border: 1px solid rgba(129,140,248,0.7);
      box-shadow:
        0 0 12px rgba(129,140,248,0.45),
        0 0 24px rgba(255,0,102,0.35);
    }

    .neon-embed-frame .tiktok-embed {
      margin: 0 auto !important;
    }

    /* FOOTER LINKS */
    .links {
      margin-top: 0.75rem;
      font-size: 0.85rem;
      text-align:center;
    }

    .links a {
      color: #a5b4fc;
      text-decoration: none;
      margin: 0 0.4rem;
      transition: color 0.3s, text-shadow 0.3s;
    }

    .links a:hover {
      color: #ff0066;
      text-shadow: 0 0 8px #ff0066;
    }

    .footnote {
      margin-top: 1.5rem;
      font-size: 0.7rem;
      opacity: 0.55;
      text-align:center;
    }

    .genre-tagline {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 0.2rem;
      color: #ff0066;
      text-shadow: 0 0 5px rgba(255, 0, 102, 0.8);
    }

    @media (max-width: 720px) {
      .hero {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .hero-right {
        text-align: center;
      }

      .visualizer {
        height: 280px;
      }

      .nav-tabs {
        gap: 0.5rem;
      }

      .nav-tabs a {
        padding: 0.4rem 0.9rem;
        font-size: 0.9rem;
      }
    }
  </style>
</head>

<body>
  <main class="wrapper">

    <!-- HERO BANNER -->
    <section class="hero">
      <div class="hero-left">
        <img
          src="logo.png"
          alt="Radio RRR Logo - Neon Retrowave Text"
        >
      </div>

      <div class="hero-right">
        <div class="live-pill">
          <span class="live-dot"></span>
          LIVE · BROADCASTING 24/7
        </div>

        <h1 class="hero-title">RADIO RRR</h1>

        <p class="hero-now-title">
          Now Playing:
          <strong id="heroNowPlaying">Loading current block…</strong>
        </p>
      </div>
    </section>

    <!-- NAV TABS -->
    <nav class="nav-tabs">

      <a data-target="stream-section">
        <span class="nav-icon">📻</span>
        <span class="nav-label">Radio</span>
      </a>

      <a data-target="events-section">
        <span class="nav-icon">📅</span>
        <span class="nav-label">Schedule</span>
      </a>

      <a data-target="video-section">
        <span class="nav-icon">🎬</span>
        <span class="nav-label">Video</span>
      </a>

      <!-- LIVE DJs -->
      <a data-target="live-section" class="live-nav active">
        <span class="live-nav-dot"></span>
        <span class="nav-label">Live DJs</span>
      </a>

    </nav>

    <!-- RADIO TAB -->
    <div id="stream-section" class="content-pane">

      <div class="channel">

        <div class="visualizer">
          <canvas id="viz"></canvas>
        </div>

        <audio id="liveStream" controls crossorigin="anonymous">
          <source
            src="https://stream.nightride.fm/nightride.mp3"
            type="audio/mpeg"
          />
          Your browser does not support the audio element.
        </audio>

        <button id="kickPlay" class="kick">Play</button>

        <div id="status" class="status"></div>

      </div>

    </div>

    <!-- LIVE DJs TAB -->
    <div id="live-section" class="content-pane hidden-pane">

      <div class="channel">

        <div class="live-djs-header">
          <div>
            <span class="live-djs-title">Live DJs</span><br />
            <small>Live DJs streaming right now.</small>
          </div>

          <button id="liveRefresh" class="live-refresh">
            ↻ Refresh
          </button>
        </div>

        <div id="liveDjsList" class="live-djs-grid">
          <div class="live-empty">Checking who's live…</div>
        </div>

      </div>

    </div>
