<script async src="https://www.tiktok.com/embed.js"></script>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const navLinks = document.querySelectorAll(".nav-tabs a");
    const contentPanes = document.querySelectorAll(".content-pane");
    const titleEl = document.getElementById("streamTitle");
    const heroNowEl = document.getElementById("heroNowPlaying");
    const audio = document.getElementById("liveStream");
    const statusEl = document.getElementById("status");
    const canvas = document.getElementById("viz");
    const ctx = canvas && canvas.getContext ? canvas.getContext("2d") : null;

    const GAIN = 8.0;
    const MIN_AMP = 0.05;

    /* ---- Tabs ---- */
    function switchTab(targetId) {
      for (let pane of contentPanes) pane.classList.add("hidden-pane");
      const targetElement = document.getElementById(targetId);
      if (targetElement) targetElement.classList.remove("hidden-pane");

      for (let l of navLinks) l.classList.remove("active");
      const activeLink = document.querySelector('.nav-tabs a[data-target="' + targetId + '"]');
      if (activeLink) activeLink.classList.add("active");
    }

    for (let link of navLinks) {
      link.addEventListener("click", function (e) {
        const targetId = e.target.getAttribute("data-target");
        if (targetId) switchTab(targetId);
      });
    }

    switchTab("stream-section"); // default tab

    /* ---- Day period + labels ---- */
    function getDayPeriod(hour) {
      if (hour >= 6 && hour < 12) return "Morning";
      if (hour >= 12 && hour < 18) return "Afternoon";
      return "Evening";
    }

    function getBlockLabel(dayName, period) {
      // Tweak these to exactly match your AzuraCast playlist titles
      const labels = {
        Morning: "Neon Sunrise Chill",
        Afternoon: "Daydrive Synthwave",
        Evening: "Night Drive Electro"
      };

      const base = labels[period] || "Live Mix";
      return dayName + " " + period + " – " + base;
    }

    function updateTitles() {
      const now = new Date();
      const days = [
        "Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"
      ];
      const dayName = days[now.getDay()];
      const period = getDayPeriod(now.getHours());

      const blockLabel = getBlockLabel(dayName, period);

      if (titleEl) {
        titleEl.textContent = "RADIO RRR Live – " + blockLabel;
      }
      if (heroNowEl) {
        heroNowEl.textContent = blockLabel;
      }
    }

    updateTitles();
    setInterval(updateTitles, 15 * 60 * 1000);

    /* ---- Status ---- */
    function setStatus(msg) {
      if (!statusEl) return;
      statusEl.style.display = "block";
      statusEl.textContent = "Status: " + msg;
    }

    /* ---- Canvas Resize ---- */
    function resize() {
      if (!canvas || !ctx) return;
      const dpr = window.devicePixelRatio || 1;
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    window.addEventListener("resize", resize);

    /* ---- Audio analyser ---- */
    let audioCtx = null;
    let analyser = null;
    let dataArray = null;
    let analyserEnabled = false;
    let analyserInitAttempted = false;
    let isPlaying = false;

    function avgRange(arr, start, end) {
      let sum = 0;
      for (let i = start; i < end; i++) sum += arr[i];
      return sum / (end - start);
    }

    function initAnalyser() {
      if (analyserInitAttempted) return;
      analyserInitAttempted = true;
      if (!audio) return;
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AC();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;
        dataArray = new Uint8Array(analyser.frequencyBinCount);
        const src = audioCtx.createMediaElementSource(audio);
        src.connect(analyser);
        analyser.connect(audioCtx.destination);
        analyserEnabled = true;
      } catch (err) {
        console.error("Analyser init failed:", err);
        analyserEnabled = false;
      }
    }

    let startTime = performance.now();

    /* ---- Visualizer ---- */
    function drawFrame() {
      const streamPane = document.getElementById("stream-section");
      if (!streamPane || streamPane.classList.contains("hidden-pane")) {
        requestAnimationFrame(drawFrame);
        return;
      }

      if (!canvas || !ctx) {
        // No canvas, just keep the loop alive so the rest of the script works
        requestAnimationFrame(drawFrame);
        return;
      }

      const t = (performance.now() - startTime) / 1000;
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      const cx = w / 2;
      const cy = h / 2;
      const minDim = Math.min(w, h);

      ctx.fillStyle = "rgba(0, 0, 0, 0.9)";
      ctx.fillRect(0, 0, w, h);

      let bass = 0.1, mid = 0.1, treb = 0.1, energy = 0.1;
      let useAudio = false;

      if (analyserEnabled && isPlaying && analyser && dataArray) {
        try {
          analyser.getByteFrequencyData(dataArray);
          const len = dataArray.length;

          const calculated_bass = Math.min(
            1,
            (avgRange(dataArray, 0, Math.floor(len * 0.15)) / 255) * GAIN
          );
          const calculated_mid = Math.min(
            1,
            (avgRange(dataArray, Math.floor(len * 0.15), Math.floor(len * 0.5)) / 255) * GAIN
          );
          const calculated_treb = Math.min(
            1,
            (avgRange(dataArray, Math.floor(len * 0.5), len) / 255) * GAIN
          );

          bass = Math.max(MIN_AMP, calculated_bass);
          mid  = Math.max(MIN_AMP, calculated_mid);
          treb = Math.max(MIN_AMP, calculated_treb);
          energy = (bass + mid + treb) / 3;
          useAudio = true;
        } catch (err) {
          console.error("Analyser frame failed, falling back to demo:", err);
          analyserEnabled = false;
        }
      }

      if (useAudio) {
        const bgGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, minDim * 0.8);
        bgGrad.addColorStop(0, "rgba(255,0,102," + (0.18 + energy * 0.35) + ")");
        bgGrad.addColorStop(0.4, "rgba(67,56,202," + (0.1 + mid * 0.25) + ")");
        bgGrad.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, w, h);

        const barCount = 72;
        const innerRadius = minDim * 0.14;
        const outerRadiusBase = minDim * 0.38;

        for (let i = 0; i < barCount; i++) {
          const idx = Math.floor((i / barCount) * dataArray.length);
          const v = dataArray[idx] / 255;
          const barAmp = Math.pow(v, 1.25);
          const radius = innerRadius + barAmp * outerRadiusBase;

          const angle = (i / barCount) * Math.PI * 2;
          const x1 = cx + Math.cos(angle) * innerRadius;
          const y1 = cy + Math.sin(angle) * innerRadius;
          const x2 = cx + Math.cos(angle) * radius;
          const y2 = cy + Math.sin(angle) * radius;

          const hue = (210 + i * 2 + t * 40) % 360;
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.strokeStyle = "hsla(" + hue + ", 100%, " + (40 + barAmp * 40) + "%, " +
            (0.25 + barAmp * 0.7) + ")";
          ctx.lineWidth = 0.8 + barAmp * 2.8;
          ctx.stroke();
        }

        ctx.beginPath();
        const ringRadius = innerRadius + outerRadiusBase * 1.05 + bass * 35;
        ctx.arc(cx, cy, ringRadius, 0, Math.PI * 2);
        const ringHue = (t * 80) % 360;
        ctx.strokeStyle = "hsla(" + ringHue + ", 100%, 60%, " + (0.35 + energy * 0.4) + ")";
        ctx.lineWidth = 1.5 + energy * 3.5;
        ctx.shadowBlur = 18 + energy * 32;
        ctx.shadowColor = ctx.strokeStyle;
        ctx.stroke();
        ctx.shadowBlur = 0;

        const coreRadius = 10 + bass * 30;
        const coreGradient = ctx.createRadialGradient(
          cx, cy, 0, cx, cy, coreRadius
        );
        coreGradient.addColorStop(0, "rgba(255,255,255," + (0.7 + treb * 0.3) + ")");
        coreGradient.addColorStop(0.4, "rgba(255,0,150," + (0.65 + bass * 0.3) + ")");
        coreGradient.addColorStop(1, "rgba(255,0,150,0)");
        ctx.fillStyle = coreGradient;
        ctx.beginPath();
        ctx.arc(cx, cy, coreRadius, 0, Math.PI * 2);
        ctx.fill();

      } else {
        bass = (Math.sin(t * 1.5) + 1) / 2;
        mid  = (Math.sin(t * 0.9 + 1.2) + 1) / 2;
        treb = (Math.sin(t * 2.1 + 0.7) + 1) / 2;
        energy = (bass + mid + treb) / 3;

        ctx.fillStyle = "rgba(0, 0, 0, 0.2)";
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
        ctx.fillRect(0, 0, w, h);

        const circleCount = 8;
        for (let i = 0; i < circleCount; i++) {
          const baseRadius = minDim * 0.04 + i * minDim * 0.05;
          const freqAmp = (i % 2 === 0) ? mid : treb;
          const currentRadius = baseRadius + freqAmp * 60;

          ctx.beginPath();
          ctx.arc(cx, cy, currentRadius, 0, Math.PI * 2);

          const hue = (t * 50 + i * 20) % 360;
          ctx.strokeStyle = "hsl(" + hue + ", 100%, " + (60 + freqAmp * 20) + "%)";
          ctx.lineWidth = 1 + freqAmp * 2.5;
          ctx.shadowBlur = 10 + freqAmp * 20;
          ctx.shadowColor = "hsl(" + hue + ", 100%, 50%)";
          ctx.stroke();
        }
        ctx.shadowBlur = 0;

        const lineCount = 64;
        for (let i = 0; i < lineCount; i++) {
          const angle = (i * (Math.PI * 2)) / lineCount + t * 0.05 * treb;
          const maxDist = minDim * 0.75;
          const lineLength = maxDist + bass * 100;

          const x2 = cx + Math.cos(angle) * lineLength;
          const y2 = cy + Math.sin(angle) * lineLength;

          ctx.beginPath();
          ctx.moveTo(cx, cy);
          ctx.lineTo(x2, y2);

          const lineHue = (i * 5 + t * 50) % 360;
          ctx.strokeStyle = "hsla(" + lineHue + ", 100%, 60%, " +
            (0.2 + energy * 0.6) + ")";
          ctx.lineWidth = 1;
          ctx.stroke();
        }

        const coreRadius = 5 + bass * 50;
        const coreGradient = ctx.createRadialGradient(
          cx, cy, 0, cx, cy, coreRadius
        );
        coreGradient.addColorStop(0, "rgba(255, 255, 255, 0.9)");
        coreGradient.addColorStop(
          0.5,
          "rgba(255, 0, 102," + (0.7 + bass * 0.3) + ")"
        );
        coreGradient.addColorStop(1, "rgba(255, 0, 102, 0)");
        ctx.fillStyle = coreGradient;
        ctx.beginPath();
        ctx.arc(cx, cy, coreRadius, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.save();
      ctx.globalAlpha = 0.13;
      ctx.fillStyle = "rgba(0, 0, 0, 1)";
      const gap = 3;
      const off = (t * 35) % gap;
      for (let y = off; y < h; y += gap) {
        ctx.fillRect(0, y, w, 1);
      }
      ctx.restore();

      requestAnimationFrame(drawFrame);
    }
    requestAnimationFrame(drawFrame);

    /* ---- Play/Pause ---- */
    const kick = document.getElementById("kickPlay");
    if (kick && audio) {
      kick.addEventListener("click", function () {
        if (audio.paused) {
          setStatus("connecting...");
          kick.textContent = "Connecting...";

          audio
            .play()
            .then(function () {
              isPlaying = true;
              setStatus("playing");
              kick.textContent = "Pause";
              initAnalyser();
              if (audioCtx && audioCtx.state === "suspended") {
                audioCtx.resume();
              }
            })
            .catch(function (e) {
              console.error("Audio Play Error:", e);
              setStatus("error starting stream");
              kick.textContent = "Play";
            });
        } else {
          audio.pause();
          isPlaying = false;
          setStatus("paused");
          kick.textContent = "Play";
        }
      });

      audio.addEventListener("play", function () {
        isPlaying = true;
        setStatus("playing");
        kick.textContent = "Pause";
        initAnalyser();
        if (audioCtx && audioCtx.state === "suspended") {
          audioCtx.resume();
        }
      });

      audio.addEventListener("pause", function () {
        isPlaying = false;
        setStatus("paused");
        kick.textContent = "Play";
      });

      audio.addEventListener("error", function () {
        setStatus("audio error (stream offline?)");
        kick.textContent = "Play";
      });
    }
  });
</script>
