<script async src="https://www.tiktok.com/embed.js"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {

  /* -----------------------------
     Dynamic: "RADIO RRR Live – Sunday Night Mix"
  ----------------------------- */
  const titleEl = document.getElementById("streamTitle");

  function getDayPeriod(hour) {
    if (hour < 12) return "Morning";
    if (hour < 17) return "Afternoon";
    return "Night"; // after 5pm, it's night for the station vibe
  }

  function updateTitle() {
    const now = new Date();
    const days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
    const dayName = days[now.getDay()];
    const period = getDayPeriod(now.getHours());
    titleEl.textContent = `RADIO RRR Live – ${dayName} ${period} Mix`;
  }

  updateTitle();

  /* -----------------------------
     Visualizer + Stream Engine
  ----------------------------- */

  const audio = document.getElementById("liveStream");
  const statusEl = document.getElementById("status");
  const kick = document.getElementById("kickPlay");
  const canvas = document.getElementById("viz");
  const ctx = canvas.getContext("2d");

  function setStatus(msg) {
    statusEl.style.display = "block";
    statusEl.textContent = "Status: " + msg;
  }

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.clientWidth;
    const h = canvas.clientHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener("resize", resize);

  let audioCtx = null;
  let analyser = null;
  let dataArray = null;
  let analyserEnabled = false;
  let analyserInitAttempted = false;
  let isPlaying = false;

  function initAnalyser() {
    if (analyserInitAttempted) return;
    analyserInitAttempted = true;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      audioCtx = new AC();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 1024;
      dataArray = new Uint8Array(analyser.frequencyBinCount);

      const sourceNode = audioCtx.createMediaElementSource(audio);
      sourceNode.connect(analyser);
      analyser.connect(audioCtx.destination);

      analyserEnabled = true;
      console.log("Analyser enabled");
    } catch (err) {
      console.warn("Analyser blocked, using fake waves instead");
      analyserEnabled = false;
    }
  }

  function avgRange(arr, start, end) {
    let sum = 0;
    for (let i = start; i < end; i++) sum += arr[i];
    return sum / (end - start || 1);
  }

  let startTime = performance.now();

  function drawFrame() {
    const t = (performance.now() - startTime) / 1000;
    const w = canvas.clientWidth;
    const h = canvas.clientHeight;

    let bass = 0, mid = 0, treb = 0, energy = 0.1;

    if (analyserEnabled && analyser && dataArray && isPlaying) {
      try {
        analyser.getByteFrequencyData(dataArray);
        const len = dataArray.length;
        bass = avgRange(dataArray, 0, len * 0.08) / 255;
        mid  = avgRange(dataArray, len * 0.08, len * 0.4) / 255;
        treb = avgRange(dataArray, len * 0.4, len) / 255;
        energy = bass * 1.2 + mid * 0.6 + treb * 0.3;
      } catch {
        analyserEnabled = false;
      }
    }

    // Idle animation when analyser unavailable / paused
    if (!analyserEnabled || !isPlaying) {
      bass = (Math.sin(t * 2.3) + 1) / 2;
      mid  = (Math.sin(t * 1.4 + 1.2) + 1) / 2;
      treb = (Math.sin(t * 3.2 + 0.7) + 1) / 2;
      energy = (bass + mid + treb) / 3;
    }

    const horizon = h * 0.55;
    const cx = w / 2;

    /* ---------------------------
       NEON SUNSET BACKGROUND
    --------------------------- */

    // Sky
    const sky = ctx.createLinearGradient(0, 0, 0, horizon);
    sky.addColorStop(0, "#090018");
    sky.addColorStop(0.35, "#3a0060");
    sky.addColorStop(0.7, "#ff0066");
    sky.addColorStop(1, "#ff6600");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, w, horizon);

    // Stars
    const starCount = 90;
    ctx.fillStyle = "rgba(255,255,255,0.8)";
    for (let i = 0; i < starCount; i++) {
      const sx = (i * 73 + (t * 10)) % w;
      const sy = (i * 53) % (h * 0.4);
      const size = (i % 7 === 0 ? 1.4 : 0.7);
      ctx.fillRect(sx, sy, size, size);
    }

    // Sun
    const sunRadius = Math.min(w, h) * 0.16;
    const sunY = horizon - sunRadius * 0.25 - bass * 8;
    const sunGrad = ctx.createRadialGradient(
      cx, sunY, sunRadius * 0.1,
      cx, sunY, sunRadius
    );
    sunGrad.addColorStop(0, "rgba(255,255,200,0.98)");
    sunGrad.addColorStop(0.4, "rgba(255,180,80,0.96)");
    sunGrad.addColorStop(1, "rgba(255,0,80,0)");
    ctx.fillStyle = sunGrad;
    ctx.beginPath();
    ctx.arc(cx, sunY, sunRadius, 0, Math.PI * 2);
    ctx.fill();

    // Sun scanlines
    ctx.save();
    ctx.globalCompositeOperation = "source-atop";
    ctx.fillStyle = "rgba(10,5,20,0.7)";
    const stripeH = sunRadius * 0.14;
    for (let y = -sunRadius; y < sunRadius; y += stripeH * 1.7) {
      ctx.fillRect(cx - sunRadius, sunY + y, sunRadius * 2, stripeH);
    }
    ctx.restore();

    // Water
    const waterGrad = ctx.createLinearGradient(0, horizon, 0, h);
    waterGrad.addColorStop(0, "#150020");
    waterGrad.addColorStop(0.5, "#05071a");
    waterGrad.addColorStop(1, "#02030a");
    ctx.fillStyle = waterGrad;
    ctx.fillRect(0, horizon, w, h);

    // Reflection
    const reflectGrad = ctx.createLinearGradient(cx, horizon, cx, h);
    reflectGrad.addColorStop(0, "rgba(255,120,160,0.7)");
    reflectGrad.addColorStop(0.4, "rgba(255,80,200,0.35)");
    reflectGrad.addColorStop(1, "rgba(255,0,150,0)");
    ctx.fillStyle = reflectGrad;
    ctx.globalAlpha = 0.55 + energy * 0.25;
    const reflectWidth = sunRadius * 1.4 + bass * 20;
    ctx.beginPath();
    ctx.moveTo(cx - reflectWidth, horizon);
    ctx.quadraticCurveTo(cx, h * 0.8 + bass * 14, cx + reflectWidth, horizon);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 1;

    // Water scanlines
    ctx.save();
    ctx.globalAlpha = 0.13;
    ctx.fillStyle = "rgba(0,0,0,1)";
    const gap = 3, off = (t * 35) % gap;
    for (let y = off; y < h; y += gap) {
      ctx.fillRect(0, y, w, 1);
    }
    ctx.restore();

    /* ---------------------------
       DJ MADE OF WAVES + DOTS
       (Only when music is actually playing)
    --------------------------- */

    if (isPlaying) {
      const djEnergy = 0.4 + energy * 1.4; // overall movement
      const djX = cx;
      const djBaseY = horizon + (h - horizon) * 0.18; // where the DJ "stands"

      // Deck line (baseline)
      ctx.save();
      ctx.globalAlpha = 0.8;
      const deckY = djBaseY + 52;
      const deckGrad = ctx.createLinearGradient(0, deckY - 4, 0, deckY + 4);
      deckGrad.addColorStop(0, "rgba(255,0,120,0.9)");
      deckGrad.addColorStop(1, "rgba(0,220,255,0.9)");
      ctx.strokeStyle = deckGrad;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(djX - w * 0.22, deckY);
      ctx.lineTo(djX + w * 0.22, deckY);
      ctx.stroke();
      ctx.restore();

      // Head: pulsing circle made from a ring of dots
      const headRadius = 22 + bass * 16;
      const headY = djBaseY - 40 - bass * 6;

      const headDots = 32;
      for (let i = 0; i < headDots; i++) {
        const angle = (i / headDots) * Math.PI * 2;
        const wobble = Math.sin(t * 4 + angle * 3) * 2 * djEnergy;
        const r = headRadius + wobble;

        const x = djX + Math.cos(angle) * r;
        const y = headY + Math.sin(angle) * r;

        const size = 2 + treb * 3;
        const alpha = 0.6 + 0.4 * Math.sin(t * 5 + i * 0.4);
        ctx.fillStyle = `rgba(255,255,255,${alpha.toFixed(2)})`;
        ctx.beginPath();
        ctx.arc(x, y, size, 0, Math.PI * 2);
        ctx.fill();
      }

      // Headphones arcs (also dots)
      const hpOffset = headRadius + 6;
      const hpDots = 18;
      for (let i = 0; i < hpDots; i++) {
        const side = i < hpDots / 2 ? -1 : 1;
        const localIndex = i % (hpDots / 2);
        const frac = localIndex / (hpDots / 2 - 1);
        const angle = Math.PI * (0.35 + frac * 0.3); // small arc over the head

        const wobble = Math.sin(t * 3 + frac * 6 * side) * 2 * djEnergy;
        const r = hpOffset + wobble;

        const x = djX + side * Math.cos(angle) * r;
        const y = headY - Math.sin(angle) * r;

        const size = 2 + mid * 3;
        ctx.fillStyle = side < 0
          ? "rgba(255,120,250,0.9)"
          : "rgba(0,240,255,0.9)";
        ctx.beginPath();
        ctx.arc(x, y, size, 0, Math.PI * 2);
        ctx.fill();
      }

      // Torso: vertical column of dots that pulse with the beat
      const torsoHeight = 60 + mid * 35;
      const torsoDots = 18;
      for (let i = 0; i < torsoDots; i++) {
        const frac = i / (torsoDots - 1);
        const y = headY + 8 + frac * torsoHeight;
        const sway = Math.sin(t * 3 + frac * 4) * 8 * djEnergy;

        // left + right torso "edges"
        const spread = 16 + bass * 10;

        const baseAlpha = 0.35 + 0.65 * frac;
        const size = 2 + energy * 3;

        // left
        ctx.fillStyle = `rgba(255,0,150,${baseAlpha.toFixed(2)})`;
        ctx.beginPath();
        ctx.arc(djX - spread + sway * 0.5, y, size, 0, Math.PI * 2);
        ctx.fill();

        // right
        ctx.fillStyle = `rgba(0,200,255,${baseAlpha.toFixed(2)})`;
        ctx.beginPath();
        ctx.arc(djX + spread + sway * 0.5, y, size, 0, Math.PI * 2);
        ctx.fill();

        // center "core"
        ctx.fillStyle = `rgba(255,255,255,${(baseAlpha * 0.7).toFixed(2)})`;
        ctx.beginPath();
        ctx.arc(djX + sway * 0.15, y, size * 0.7, 0, Math.PI * 2);
        ctx.fill();
      }

      // Arms: waveform-style strings of dots reaching to decks
      function drawArm(side) {
        const armDots = 26;
        const reachX = djX + side * (w * 0.18);
        const startY = headY + 15;
        const endY = deckY - 5;

        for (let i = 0; i < armDots; i++) {
          const frac = i / (armDots - 1);

          const baseX = djX + side * 14 * (1 - frac) + side * (w * 0.16) * frac;
          const baseY = startY + (endY - startY) * frac;

          const wave = Math.sin(frac * Math.PI * 4 + t * 6 + side * 0.7) *
                       (8 + 24 * djEnergy * frac);

          const x = baseX + wave * side;
          const y = baseY + Math.cos(frac * Math.PI * 3 + t * 4) *
                    (3 + 6 * djEnergy * (1 - frac));

          const size = 1.8 + energy * 2.5 * (1 - frac);
          const alpha = 0.25 + 0.75 * (1 - frac) * (0.7 + 0.3 * bass);

          ctx.fillStyle = side < 0
            ? `rgba(255,80,220,${alpha.toFixed(2)})`
            : `rgba(0,220,255,${alpha.toFixed(2)})`;

          ctx.beginPath();
          ctx.arc(x, y, size, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      drawArm(-1);
      drawArm(1);

      // Deck activity dots (little bouncing lights)
      const deckDots = 20;
      for (let i = 0; i < deckDots; i++) {
        const frac = i / (deckDots - 1);
        const x = djX - w * 0.2 + frac * (w * 0.4);
        const y = deckY + Math.sin(t * 8 + i * 0.7) * (3 + bass * 6);

        const size = 1.4 + energy * 2.2;
        const alpha = 0.3 + 0.7 * Math.random() * energy;

        ctx.fillStyle = i % 2 === 0
          ? `rgba(255,255,255,${alpha.toFixed(2)})`
          : `rgba(255,255,0,${alpha.toFixed(2)})`;

        ctx.beginPath();
        ctx.arc(x, y, size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    requestAnimationFrame(drawFrame);
  }

  requestAnimationFrame(drawFrame);

  /* -----------------------------
     Play / Pause wiring
  ----------------------------- */

  kick.addEventListener("click", () => {
    if (audio.paused) {
      const p = audio.play();
      if (p && p.then) {
        p.then(() => {
          isPlaying = true;
          setStatus("playing");
          initAnalyser();
          if (audioCtx && audioCtx.state === "suspended") {
            audioCtx.resume();
          }
        }).catch(() => {
          setStatus("tap the player above to start");
        });
      }
    } else {
      audio.pause();
      isPlaying = false;
      setStatus("paused");
    }
  });

  audio.addEventListener("play", () => {
    isPlaying = true;
    setStatus("playing");
    initAnalyser();
    if (audioCtx && audioCtx.state === "suspended") {
      audioCtx.resume();
    }
  });

  audio.addEventListener("pause", () => {
    isPlaying = false;
    setStatus("paused");
  });

  audio.addEventListener("error", () => {
    setStatus("audio error (stream offline?)");
  });
});
</script>
