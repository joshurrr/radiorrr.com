<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Radio RRR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #050710;
      color: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .wrapper {
      max-width: 600px;
      width: 100%;
      padding: 2.5rem 1.75rem;
      border-radius: 18px;
      /* Style based on uploaded content */
      background: radial-gradient(circle at top, #4338ca 0, #050710 55%);
      box-shadow: 0 18px 40px rgba(0,0,0,0.55);
      text-align: center;
    }
    .tagline {
      font-size: 0.95rem;
      color: #c7c7ff;
      margin: 0.5rem 0 1.25rem;
    }
    .visualizer {
      width: 100%;
      height: 260px;
      border-radius: 14px;
      overflow: hidden;
      background: #050710;
      margin-bottom: 0.6rem;
    }
    #viz { width: 100%; height: 100%; display: block; }

    .channel {
      padding: 1.2rem 1.4rem;
      border-radius: 16px;
      background: rgba(10,10,30,0.85);
      border: 1px solid rgba(129,140,248,0.5);
      margin-bottom: 1.75rem;
      text-align: left;
    }
    .channel span { font-weight: 600; font-size: 1rem; }
    .channel small { font-size: 0.8rem; opacity: 0.75; }

    .stream-title {
      display: block;
      margin: 0.4rem 0 0.4rem;
      font-weight: 600;
      font-size: 1rem;
    }

    audio { width: 100%; margin-top: 0.2rem; }
    .status { display:none; font-size: 0.8rem; margin-top: 0.4rem; opacity: 0.8; }
    .kick {
      margin-top:0.6rem; padding:0.45rem 0.7rem;
      border-radius:10px; border:1px solid rgba(129,140,248,0.6);
      background:#0b1020; color:#c7c7ff;
      cursor:pointer; font-size:0.85rem;
    }
    /* Updated container for reliable video embed */
    .video-container {
      position: relative;
      width: 100%; 
      padding-bottom: 56.25%; /* Standard 16:9 ratio */
      margin-top: 0.8rem;
    }
    .video-container iframe {
      position: absolute; width: 100%; height: 100%; border: 0;
      top: 0; left: 0; border-radius: 12px;
    }
    /* Specific styling for the 'Shorts' embed to maintain a tall aspect ratio */
    .shorts-container {
        padding-bottom: 177.77%; /* 9:16 aspect ratio (56.25 * 3.16) */
    }
    .links { margin-top: 0.75rem; font-size: 0.85rem; text-align:center; }
    .links a { color: #a5b4fc; text-decoration: none; margin: 0 0.4rem; }
    .footnote { margin-top: 1.5rem; font-size: 0.7rem; opacity: 0.55; }
  </style>
</head>

<body>
  <main class="wrapper">

    <img src="logo.png" alt="Radio RRR Logo"
         style="width: 300px; max-width: 90%; margin: 0 auto 10px; display: block;">

    <p class="tagline">Streaming Electro · Synth · 80s · Memes · Remixed</p>

    <div class="channel">

      <div class="visualizer">
        <canvas id="viz"></canvas>
      </div>

      <span id="streamTitle" class="stream-title">RADIO RRR Live</span>

      <audio id="liveStream" controls crossorigin="anonymous">
        <source src="https://stream.nightride.fm/nightride.mp3" type="audio/mpeg" />
      </audio>

      <button id="kickPlay" class="kick">Play</button>
      <div id="status" class="status"></div>
    </div>

    <div class="channel">
      <span>Latest Shorts</span><br />
      <small>@RADIO_RRR · short videos and edits</small>

      <div class="video-container shorts-container">
        <iframe
          src="https://www.youtube.com/embed/videoseries?list=PLli1uTuS0FH4q3y_F4fL8s-9M8Xh_4qY0" 
          allowfullscreen
          loading="lazy">
        </iframe>
      </div>
    </div>

    <div class="channel">
      <span>YouTube Likes</span><br />
      <small>Latest videos we liked</small>

      <div class="video-container">
        <iframe
          src="https://www.youtube.com/embed/videoseries?list=PLli1uTuS0FH7xR1QBnIvY3V9btomaSpTv"
          allowfullscreen
          loading="lazy">
        </iframe>
      </div>
    </div>

    <div class="links">
      <a href="https://www.instagram.com/radio.rrr/" target="_blank">Instagram</a> ·
      <a href="https://www.tiktok.com/@josh.u.rrr" target="_blank">TikTok</a> ·
      <a href="https://www.youtube.com/@RADIO_RRR" target="_blank">YouTube</a> ·
      <a href="https://github.com/joshurrr" target="_blank">GitHub</a>
    </div>

    <p class="footnote">
      Streaming 24/7<br>
      Contact: <a href="mailto:admin@radiorrr.com" style="color:#a5b4fc;">admin@radiorrr.com</a>
    </p>

  </main>

  <script>
  document.addEventListener("DOMContentLoaded", () => {

    const titleEl = document.getElementById("streamTitle");

    function getDayPeriod(hour) {
      if (hour < 12) return "Morning";
      if (hour < 17) return "Afternoon";
      return "Night";
    }

    function updateTitle() {
      const now = new Date();
      const days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
      const dayName = days[now.getDay()];
      const period = getDayPeriod(now.getHours());

      const variantsByPeriod = {
        Morning: ["Morning Chill","Sunrise Session","Morning Transmission"],
        Afternoon: ["Afternoon Chill","Daystream Session","Retro Run"],
        Night: ["Night Chill","After Dark","Night Transmission","Late Night Set"]
      };

      const list = variantsByPeriod[period] || ["Live Mix"];
      const label = list[now.getDay() % list.length];

      titleEl.textContent = `RADIO RRR Live – ${dayName} ${label}`;
    }

    updateTitle();
    // Added setInterval back for title update
    setInterval(updateTitle, 3600000); 


    const audio = document.getElementById("liveStream");
    const statusEl = document.getElementById("status");
    const kick = document.getElementById("kickPlay");
    const canvas = document.getElementById("viz");
    const ctx = canvas.getContext("2d");

    function setStatus(msg) {
      statusEl.style.display = "block";
      statusEl.textContent = "Status: " + msg;
    }

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    window.addEventListener("resize", resize);

    let audioCtx = null;
    let analyser = null;
    let dataArray = null;
    let analyserEnabled = false;
    let analyserInitAttempted = false;
    let isPlaying = false;

    function initAnalyser() {
      if (analyserInitAttempted) return;
      analyserInitAttempted = true;
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AC();
        analyser = audioCtx.createAnalyser();
        // Reduced FFT for better performance with this complex visualizer
        analyser.fftSize = 256; 
        dataArray = new Uint8Array(analyser.frequencyBinCount);
        const src = audioCtx.createMediaElementSource(audio);
        src.connect(analyser);
        analyser.connect(audioCtx.destination);
        analyserEnabled = true;
      } catch { analyserEnabled = false; }
    }

    function avgRange(arr, start, end) {
      let sum = 0;
      for (let i = start; i < end; i++) sum += arr[i];
      return sum / (end - start);
    }

    let startTime = performance.now();

    // === SUNSET VISUALIZER (Restored from your previous code) ===
    function drawFrame() {
      // CRITICAL SAFETY BLOCK ADDED
      try {
        const t = (performance.now() - startTime) / 1000;
        const w = canvas.clientWidth;
        const h = canvas.clientHeight;

        let bass = 0, mid = 0, treb = 0, energy = 0.1;

        if (analyserEnabled && isPlaying) {
          analyser.getByteFrequencyData(dataArray);
          const len = dataArray.length;
          // Normalized audio data based on your previous sunset logic
          bass = avgRange(dataArray, 0, len*0.08) / 255;
          mid  = avgRange(dataArray, len*0.08, len*0.4) / 255;
          treb = avgRange(dataArray, len*0.4, len) / 255;
          energy = bass*1.2 + mid*0.6 + treb*0.3;
        } else {
          // Demo animation when paused
          bass = (Math.sin(t*2.3)+1)/2;
          mid  = (Math.sin(t*1.4+1.2)+1)/2;
          treb = (Math.sin(t*3.2+0.7)+1)/2;
          energy = (bass+mid+treb)/3;
        }

        const horizon = h*0.55;
        const cx = w/2;

        // 1. Sky Gradient
        const sky = ctx.createLinearGradient(0,0,0,horizon);
        sky.addColorStop(0,"#090018");
        sky.addColorStop(0.35,"#3a0060");
        sky.addColorStop(0.7,"#ff0066");
        sky.addColorStop(1,"#ff6600");
        ctx.fillStyle = sky;
        ctx.fillRect(0,0,w,horizon);

        // 2. Stars
        const starCount=90;
        ctx.fillStyle="rgba(255,255,255,0.8)";
        for(let i=0;i<starCount;i++){
          const sx=(i*73+(t*10))%w;
          const sy=(i*53)%(h*0.4);
          const size=(i%7===0?1.4:0.7);
          ctx.fillRect(sx,sy,size,size);
        }

        // 3. Sun/Pulse
        const sunRadius=Math.min(w,h)*0.16;
        const sunY=horizon-sunRadius*0.25-bass*8;
        const g=ctx.createRadialGradient(cx,sunY,sunRadius*0.1,cx,sunY,sunRadius);
        g.addColorStop(0,"rgba(255,255,200,0.98)");
        g.addColorStop(0.4,"rgba(255,180,80,0.96)");
        g.addColorStop(1,"rgba(255,0,80,0)");
        ctx.fillStyle=g;
        ctx.beginPath();
        ctx.arc(cx,sunY,sunRadius,0,Math.PI*2);
        ctx.fill();

        // 4. Water Background
        const waterGrad=ctx.createLinearGradient(0,horizon,0,h);
        waterGrad.addColorStop(0,"#150020");
        waterGrad.addColorStop(0.5,"#05071a");
        waterGrad.addColorStop(1,"#02030a");
        ctx.fillStyle=waterGrad;
        ctx.fillRect(0,horizon,w,h);

        // 5. Sun Reflection
        const reflectGrad=ctx.createLinearGradient(cx,horizon,cx,h);
        reflectGrad.addColorStop(0,"rgba(255,120,160,0.7)");
        reflectGrad.addColorStop(0.4,"rgba(255,80,200,0.35)");
        reflectGrad.addColorStop(1,"rgba(255,0,150,0)");
        ctx.fillStyle=reflectGrad;
        ctx.globalAlpha=0.55+energy*0.25;
        const rw=sunRadius*1.4+bass*20;
        ctx.beginPath();
        ctx.moveTo(cx-rw,horizon);
        ctx.quadraticCurveTo(cx,h*0.8+bass*14,cx+rw,horizon);
        ctx.closePath();
        ctx.fill();
        ctx.globalAlpha=1;

        // 6. Audio Bars
        const barCount=48;
        const bt=horizon+(h-horizon)*0.15;
        const bb=h*0.95;
        const bh=bb-bt;
        const bw=w/barCount;

        for(let i=0;i<barCount;i++){
          let v;
          if(analyserEnabled && isPlaying){
            const len=dataArray.length;
            const norm=i/(barCount-1);
            const idx=Math.floor(Math.pow(norm,0.7)*(len-1));
            v=dataArray[idx]/255;
          } else {
            v=(Math.sin(t*3+i*0.3)+1)/2;
          }
          const amp=0.2+bass*1.5;
          const hgt=bh*(0.05+v*amp);
          const x=i*bw;
          const y=bb-hgt;

          const grad=ctx.createLinearGradient(0,y,0,y+hgt);
          grad.addColorStop(0,"rgba(255,120,250,0.95)");
          grad.addColorStop(0.5,"rgba(0,240,255,0.9)");
          grad.addColorStop(1,"rgba(0,120,255,0.5)");
          ctx.fillStyle=grad;
          ctx.fillRect(x+1,y,bw-2,hgt);
        }

        // 7. Scanlines
        ctx.save();
        ctx.globalAlpha=0.13;
        ctx.fillStyle="rgba(0,0,0,1)";
        const gap=3, off=(t*35)%gap;
        for(let y=off;y<h;y+=gap){
          ctx.fillRect(0,y,w,1);
        }
        ctx.restore();

        requestAnimationFrame(drawFrame);
      } catch (e) {
          // If the visualizer fails, we log it but do not crash the page.
          console.error("Visualizer drawing error (non-fatal):", e);
          requestAnimationFrame(drawFrame); // Continue the loop attempt
      }
    }
    requestAnimationFrame(drawFrame);

    // Play button logic
    kick.addEventListener("click", () => {
      if (audio.paused) {
        audio.play().then(() => {
          isPlaying = true;
          setStatus("playing");
          initAnalyser();
          if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
        }).catch(() => setStatus("tap the player above to start"));
      } else {
        audio.pause();
        isPlaying = false;
        setStatus("paused");
      }
    });

    audio.addEventListener("play", () => {
      isPlaying = true;
      setStatus("playing");
      initAnalyser();
      if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    });

    audio.addEventListener("pause", () => {
      isPlaying = false;
      setStatus("paused");
    });

    audio.addEventListener("error", () => setStatus("audio error (stream offline?)"));
  });
  </script>

</body>
</html>
