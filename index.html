<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Radio RRR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #050710;
      color: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .wrapper {
      max-width: 600px;
      width: 100%;
      padding: 2.5rem 1.75rem;
      border-radius: 18px;
      background: radial-gradient(circle at top, #4338ca 0, #050710 55%);
      box-shadow: 0 18px 40px rgba(0,0,0,0.55);
      text-align: center;
      position: relative;
    }
    .tagline {
      font-size: 0.95rem;
      color: #c7c7ff;
      margin-bottom: 1.25rem;
      margin-top: 0.5rem;
    }

    .visualizer {
      width: 100%;
      height: 220px;
      border-radius: 14px;
      overflow: hidden;
      background: radial-gradient(circle at center, #0a0f22 0%, #050710 70%);
      border: 1px solid rgba(129,140,248,0.5);
      box-shadow: inset 0 0 40px rgba(0,0,0,0.7);
      margin-bottom: 1.5rem;
      position: relative;
    }
    #viz { width: 100%; height: 100%; display: block; }

    .channel {
      padding: 1.2rem 1.4rem;
      border-radius: 16px;
      background: rgba(10,10,30,0.85);
      border: 1px solid rgba(129,140,248,0.5);
      margin-bottom: 1.75rem;
      text-align: left;
    }
    .channel span { font-weight: 600; font-size: 1rem; }
    .channel small { font-size: 0.8rem; opacity: 0.75; }
    audio { width: 100%; margin-top: 0.8rem; }

    .status {
      margin-top: 0.55rem;
      font-size: 0.78rem;
      opacity: 0.75;
    }
    .kick {
      margin-top:0.6rem;
      padding:0.45rem 0.7rem;
      border-radius:10px;
      border:1px solid rgba(129,140,248,0.6);
      background:#0b1020;
      color:#c7c7ff;
      cursor:pointer;
      font-size:0.85rem;
    }
    .kick:hover { filter: brightness(1.15); }

    .video-container {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      margin-top: 0.8rem;
    }
    .video-container iframe {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 0;
      top: 0; left: 0;
      border-radius: 12px;
    }

    .links { margin-top: 0.75rem; font-size: 0.85rem; }
    .links a { color: #a5b4fc; text-decoration: none; margin: 0 0.4rem; }
    .links a:hover { text-decoration: underline; }
    .footnote { margin-top: 1.5rem; font-size: 0.7rem; opacity: 0.55; }
  </style>
</head>

<body>
  <main class="wrapper">

    <img src="logo.png" alt="Radio RRR Logo" style="width: 300px; margin: 0 auto 20px; display: block;">

    <p class="tagline">Streaming Electro · Synth · 80s · Chill</p>

    <!-- DIGITAL TUNNEL VISUALIZER -->
    <div class="visualizer">
      <canvas id="viz"></canvas>
    </div>

    <!-- AUDIO STREAM -->
    <div class="channel">
      <span id="streamTitle">Dark Synth Live Stream (guest station)</span><br />
      <small id="streamSubtitle">Powered by Nightride / REKT Network</small>

      <audio id="liveStream" controls playsinline crossorigin="anonymous">
        <source id="src1" src="https://stream.rekt.fm/darksynth.mp3" type="audio/mpeg" />
        <source id="src2" src="https://stream.rekt.fm/darksynth.ogg" type="audio/ogg" />
        Your browser does not support the audio element.
      </audio>

      <button id="kickPlay" class="kick">Play</button>
      <div id="status" class="status">Status: idle</div>
    </div>

    <!-- VIDEO STREAM -->
    <div class="channel">
      <span>video</span><br />
      <div class="video-container">
        <iframe
          src="https://www.youtube.com/embed/p6x_4q-xaYU?list=PLli1uTuS0FH6vQ05dGXjiAl2k5K5gZpZs"
          title="YouTube playlist player"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen>
        </iframe>
      </div>
    </div>

    <div class="links">
      <a href="https://www.instagram.com/radio.rrr/" target="_blank" rel="noopener">Instagram</a> ·
      <a href="https://www.tiktok.com/@josh.u.rrr" target="_blank" rel="noopener">TikTok</a> ·
      <a href="https://www.youtube.com/@RADIO_RRR" target="_blank" rel="noopener">YouTube</a> ·
      <a href="https://github.com/joshurrr" target="_blank" rel="noopener">GitHub</a>
    </div>

    <p class="footnote">Streaming 24/7</p>

  </main>

  <script>
    (function () {
      // ---------- AUDIO + SCHEDULE ----------
      var audio = document.getElementById("liveStream");
      var src1 = document.getElementById("src1");
      var src2 = document.getElementById("src2");
      var titleEl = document.getElementById("streamTitle");
      var subEl = document.getElementById("streamSubtitle");
      var statusEl = document.getElementById("status");
      var kick = document.getElementById("kickPlay");

      function setStatus(msg) { statusEl.textContent = "Status: " + msg; }

      var defaultTitle = "Dark Synth Live Stream (guest station)";
      var defaultSubtitle = "Powered by Nightride / REKT Network";
      var defaultMp3 = "https://stream.rekt.fm/darksynth.mp3";
      var defaultOgg = "https://stream.rekt.fm/darksynth.ogg";

      var sundayTitle = "Sunday Recovery Sessions";
      var sundaySubtitle = "Chill / dark synth downshift";
      var sundayMp3 = "https://stream.rekt.fm/darksynth.mp3"; // change later
      var sundayOgg = "https://stream.rekt.fm/darksynth.ogg"; // change later

      var isSunday = (new Date()).getDay() === 0;
      if (isSunday) {
        titleEl.textContent = sundayTitle;
        subEl.textContent = sundaySubtitle;
        src1.src = sundayMp3;
        src2.src = sundayOgg;
      } else {
        titleEl.textContent = defaultTitle;
        subEl.textContent = defaultSubtitle;
        src1.src = defaultMp3;
        src2.src = defaultOgg;
      }
      audio.load();

      // ---------- VISUALIZER (safe for iOS) ----------
      var canvas = document.getElementById("viz");
      var ctx = canvas.getContext("2d");
      var analyser = null;
      var dataArray = null;
      var audioCtx = null;
      var sourceNode = null;

      function resize() {
        var dpr = window.devicePixelRatio || 1;
        var w = canvas.clientWidth;
        var h = canvas.clientHeight;
        if (!w || !h) return; // iOS layout race guard
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      window.addEventListener("resize", resize);
      window.addEventListener("load", resize);
      resize();

      function initAnalyserOnGesture() {
        if (audioCtx || analyser) return;
        try {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          analyser = audioCtx.createAnalyser();
          analyser.fftSize = 1024;
          dataArray = new Uint8Array(analyser.frequencyBinCount);

          // This can throw on iOS if CORS headers are missing — that's why it's in try/catch.
          sourceNode = audioCtx.createMediaElementSource(audio);
          sourceNode.connect(analyser);
          analyser.connect(audioCtx.destination);
        } catch (e) {
          console.log("iOS analyser blocked/CORS. Visualizer will idle.", e);
          analyser = null;
          dataArray = null;
        }
      }

      function avgRange(start, end) {
        var sum = 0;
        for (var i = start; i < end; i++) sum += dataArray[i] || 0;
        return sum / (end - start);
      }

      // Stars
      var stars = [];
      var STAR_COUNT = 200;
      function resetStar(s) {
        s.x = (Math.random() * 2 - 1);
        s.y = (Math.random() * 2 - 1);
        s.z = Math.random() * 1.2 + 0.2;
      }
      for (var i = 0; i < STAR_COUNT; i++) {
        var s = {};
        resetStar(s);
        stars.push(s);
      }

      var t0 = performance.now();

      function draw() {
        var now = performance.now();
        var t = (now - t0) / 1000;

        var w = canvas.clientWidth;
        var h = canvas.clientHeight;
        if (!w || !h) { requestAnimationFrame(draw); return; }

        var cx = w / 2;
        var cy = h / 2;

        var energy = 0.10, bass = 0, mid = 0;

        if (analyser) {
          analyser.getByteFrequencyData(dataArray);
          bass = avgRange(0, 20) / 255;
          mid  = avgRange(20, 120) / 255;
          energy = Math.min(1, (bass * 0.9 + mid * 0.4));
        } else {
          energy = 0.08 + 0.05 * Math.sin(t * 1.8);
        }

        ctx.fillStyle = "rgba(5,7,16,0.28)";
        ctx.fillRect(0, 0, w, h);

        var rings = 26;
        var maxR = Math.min(w, h) * 0.9;
        var speed = 0.30 + energy * 1.2;

        for (var r = 0; r < rings; r++) {
          var p = (r / rings + t * speed) % 1;
          var radius = Math.pow(p, 2.1) * maxR * (0.9 + energy * 0.25);
          var rot = t * (0.5 + energy * 1.0) + p * 2.2;
          var alpha = Math.max(0, 1 - p) * (0.22 + energy * 0.85);

          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(rot);
          ctx.lineWidth = 1 + energy * 3;
          ctx.strokeStyle = "rgba(129,140,248," + alpha + ")";
          ctx.beginPath();

          var sides = 8;
          for (var k = 0; k <= sides; k++) {
            var ang = (k / sides) * Math.PI * 2;
            var rr = radius * (0.9 + 0.1 * Math.sin(ang * 3 + t));
            var x = Math.cos(ang) * rr;
            var y = Math.sin(ang) * rr;
            if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
          }
          ctx.stroke();
          ctx.restore();
        }

        var starSpeed = 0.40 + energy * 2.0;
        for (var j = 0; j < stars.length; j++) {
          var st = stars[j];
          st.z -= starSpeed * 0.01;
          if (st.z <= 0.05) resetStar(st);

          var sx = cx + (st.x / st.z) * cx;
          var sy = cy + (st.y / st.z) * cy;

          if (sx < 0 || sx > w || sy < 0 || sy > h) {
            resetStar(st); continue;
          }

          var size = (1 / st.z) * (0.6 + energy * 1.2);
          var aStar = Math.min(1, (1 - st.z) * (0.12 + energy * 0.7));

          ctx.fillStyle = "rgba(199,199,255," + aStar + ")";
          ctx.fillRect(sx, sy, size, size);
        }

        requestAnimationFrame(draw);
      }
      requestAnimationFrame(draw);

      // User gesture: play + init analyser
      kick.addEventListener("click", function () {
        initAnalyserOnGesture();
        setStatus("trying to play...");
        audio.play().then(function () {
          setStatus("playing");
          if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
        }).catch(function (err) {
          console.log(err);
          setStatus("blocked by browser (tap Play again)");
        });
      });

      audio.addEventListener("playing", function(){
        setStatus("playing");
        initAnalyserOnGesture();
        if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
      });
      audio.addEventListener("pause", function(){ setStatus("paused"); });
      audio.addEventListener("waiting", function(){ setStatus("buffering..."); });
      audio.addEventListener("error", function(){ setStatus("error loading stream"); });

    })();
  </script>

</body>
</html>
